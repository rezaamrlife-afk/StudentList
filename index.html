<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmericanLife — Student Groups</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #f4f5f7;
  color: #171717;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.screen {
  min-height: 100vh;
  background: #f4f5f7;
  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
  background: #ffffff;
  border-bottom: 1px solid #e4e4e4;
  padding: 16px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 20;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  font-size: 21px;
  font-weight: 700;
  color: #171717;
  letter-spacing: 0.01em;
}

.logo span {
  color: #4169e1;
}

.group-badge {
  color: #ffffff;
  font-size: 12px;
  font-weight: 700;
  padding: 5px 13px;
  border-radius: 20px;
}

.days-label {
  font-size: 13px;
  color: #777;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.nav-dots {
  display: flex;
  align-items: center;
  gap: 7px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d4d4d4;
  cursor: pointer;
  transition: all .2s ease;
}

.dot.active {
  background: #4169e1;
  transform: scale(1.25);
}

.timer-bar-wrap {
  width: 110px;
  height: 3px;
  background: #e4e4e4;
  border-radius: 5px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  background: #4169e1;
  width: 100%;
}

.btn-refresh,
.btn-pause {
  border: 1px solid #ddd;
  background: #fff;
  color: #555;
  font-size: 12px;
  padding: 7px 12px;
  border-radius: 7px;
  cursor: pointer;
}

.btn-refresh:hover,
.btn-pause:hover {
  background: #f2f2f2;
}

.btn-refresh {
  color: #4169e1;
}

/* =========================
   MAIN
========================= */

.slide {
  flex: 1;
  padding: 28px 30px;
}

.slide-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 20px;
}

.group-title {
  font-size: 29px;
  font-weight: 650;
  color: #151515;
}

.group-meta {
  display: flex;
  align-items: center;
  gap: 10px;
}

.meta-chip {
  background: #fff;
  border: 1px solid #e0e0e0;
  color: #555;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 20px;
}

.meta-chip strong {
  color: #171717;
  margin-left: 4px;
}

.assignment-status {
  font-size: 12px;
  color: #9a6b00;
  background: #fff8df;
  border: 1px solid #f1df9c;
  padding: 6px 12px;
  border-radius: 20px;
}

/* =========================
   LEVEL GRID
========================= */

.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
  gap: 14px;
  align-items: start;
}

.level-card {
  background: #ffffff;
  border: 1px solid #e1e1e1;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.03);
}

.level-card-header {
  padding: 11px 15px;
  border-bottom: 1px solid #eeeeee;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.level-name {
  font-size: 13px;
  font-weight: 700;
  color: #4169e1;
  letter-spacing: .02em;
}

.level-count {
  min-width: 24px;
  text-align: center;
  background: #eef2ff;
  color: #4169e1;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 7px;
  border-radius: 10px;
}

/* =========================
   TEACHER
========================= */

.teacher-row {
  padding: 9px 15px;
  background: #fafafa;
  border-bottom: 1px solid #eeeeee;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.teacher-label {
  font-size: 11px;
  color: #888;
}

.teacher-name {
  font-size: 12px;
  font-weight: 700;
  color: #333;
}

.teacher-name.tbd {
  color: #aaa;
  font-weight: 500;
}

/* =========================
   STUDENTS
========================= */

.student-list {
  padding: 6px 0;
}

.student-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 15px;
  border-bottom: 1px solid #f1f1f1;
}

.student-row:last-child {
  border-bottom: none;
}

.avatar {
  width: 29px;
  height: 29px;
  border-radius: 50%;
  background: #edf1ff;
  color: #4169e1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  flex-shrink: 0;
}

.student-name {
  font-size: 12px;
  color: #333;
  flex: 1;
  line-height: 1.3;
}

.status-text {
  font-size: 10px;
  white-space: nowrap;
}

.status-text.ky {
  color: #2f8f62;
}

.status-text.yk {
  color: #d66a3d;
}

.status-text.empty {
  color: #999;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.status-dot.ky {
  background: #4caf82;
}

.status-dot.yk {
  background: #e87040;
}

.status-dot.empty {
  background: #aaa;
}

/* =========================
   EMPTY / ERROR
========================= */

.empty {
  padding: 25px;
  text-align: center;
  color: #999;
  font-size: 13px;
}

.error-box {
  background: #fff;
  border: 1px solid #f0c9c9;
  color: #b34b4b;
  padding: 20px;
  border-radius: 10px;
  font-size: 13px;
}

/* =========================
   FOOTER
========================= */

.footer {
  padding: 12px 30px;
  background: #ffffff;
  border-top: 1px solid #e5e5e5;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.legend {
  display: flex;
  gap: 17px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #777;
}

.legend-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.slide-counter {
  font-size: 11px;
  color: #999;
}

.updated {
  font-size: 10px;
  color: #aaa;
  margin-left: 15px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

  .header {
    padding: 13px 16px;
  }

  .days-label {
    display: none;
  }

  .timer-bar-wrap {
    display: none;
  }

  .nav-dots {
    display: none;
  }

  .slide {
    padding: 20px 16px;
  }

  .slide-header {
    align-items: flex-start;
    flex-direction: column;
    gap: 10px;
  }

  .group-title {
    font-size: 24px;
  }

  .levels-grid {
    grid-template-columns: 1fr;
  }

  .footer {
    padding: 10px 16px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <!-- HEADER -->
  <div class="header">

    <div class="header-left">

      <div class="logo">
        American<span>Life</span>
      </div>

      <div id="group-badge" class="group-badge">
        MW
      </div>

      <div id="days-label" class="days-label">
        Monday & Wednesday
      </div>

    </div>

    <div class="header-right">

      <div class="nav-dots" id="nav-dots"></div>

      <div class="timer-bar-wrap">
        <div class="timer-bar" id="timer-bar"></div>
      </div>

      <button class="btn-refresh" id="btn-refresh">
        ↻ Refresh
      </button>

      <button class="btn-pause" id="btn-pause">
        ⏸ Pause
      </button>

    </div>

  </div>


  <!-- CONTENT -->
  <div class="slide" id="slide-content">

    <div class="empty">
      Loading Google Sheet...
    </div>

  </div>


  <!-- FOOTER -->
  <div class="footer">

    <div class="legend">

      <div class="legend-item">
        <div class="legend-dot" style="background:#4caf82"></div>
        Enrolled (KY)
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background:#e87040"></div>
        Not enrolled (YK)
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background:#aaa"></div>
        Status not specified
      </div>

      <span class="updated" id="updated">
        Updating...
      </span>

    </div>

    <div class="slide-counter" id="slide-counter">
      1 / 4
    </div>

  </div>

</div>


<script>

/* ============================================================
   GOOGLE SHEET CONFIGURATION
============================================================ */

const SPREADSHEET_ID =
  "1EP-k7eBQ9w7BUhJ-mdng70EtTPXhDHNMib5lbSXyJBw";

/*
   IMPORTANT:

   Main student sheet:
   gid = 610591116

   Teachers sheet:
   sheet name = Teachers
*/

const STUDENTS_GID = "610591116";

const TEACHERS_SHEET_NAME = "Teachers";


/* ============================================================
   GROUPS
============================================================ */

const groups = [

  {
    key: "MW",
    label: "MW",
    days: "Monday & Wednesday",
    color: "#4169e1"
  },

  {
    key: "TT",
    label: "TT",
    days: "Tuesday & Thursday",
    color: "#e87040"
  },

  {
    key: "SA",
    label: "SA",
    days: "Saturday",
    color: "#4caf82"
  },

  {
    key: "SU",
    label: "SU",
    days: "Sunday",
    color: "#9a63d9"
  }

];


/* ============================================================
   LEVEL ORDER
============================================================ */

const LEVEL_ORDER = [

  "A1.1",
  "A1.2",
  "A1.3",

  "A2.1",
  "A2.2",
  "A2.3",
  "A2.3 mini",

  "B1.1",
  "B1.2",
  "B1.3",

  "B2.1",
  "B2.2",
  "B2.3",

  "BELİRSİZ"

];


/* ============================================================
   NORMALIZE TEXT
============================================================ */

function normalize(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .trim()
    .replace(/\s+/g, " ")
    .toUpperCase();

}


/* ============================================================
   NORMALIZE LEVEL
============================================================ */

function normalizeLevel(value) {

  let v = normalize(value);

  v = v
    .replace("A1.3 PLUS", "A2.1")
    .replace("A1.3PLUS", "A2.1")
    .replace("A2.3 MINI", "A2.3 MINI");

  if (
    v === "?" ||
    v === "" ||
    v === "UNKNOWN" ||
    v === "BELIRSIZ" ||
    v === "BELİRSİZ"
  ) {
    return "BELİRSİZ";
  }

  return v;

}


/* ============================================================
   JSONP GOOGLE VISUALIZATION REQUEST
============================================================ */

function loadGoogleSheet(params) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "googleSheetCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    const script = document.createElement("script");

    const timeout = setTimeout(() => {

      cleanup();

      reject(
        new Error("Google Sheet request timed out.")
      );

    }, 15000);


    window[callbackName] = function(data) {

      clearTimeout(timeout);

      cleanup();

      resolve(data);

    };


    function cleanup() {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    }


    const queryParams = new URLSearchParams();

    queryParams.set(
      "tqx",
      "responseHandler:" + callbackName
    );

    Object.keys(params).forEach(key => {

      if (
        params[key] !== undefined &&
        params[key] !== null
      ) {

        queryParams.set(
          key,
          params[key]
        );

      }

    });


    script.src =
      "https://docs.google.com/spreadsheets/d/" +
      SPREADSHEET_ID +
      "/gviz/tq?" +
      queryParams.toString();


    script.onerror = function() {

      clearTimeout(timeout);

      cleanup();

      reject(
        new Error("Could not connect to Google Sheets.")
      );

    };


    document.body.appendChild(script);

  });

}


/* ============================================================
   CONVERT GOOGLE GVIZ DATA TO OBJECTS
============================================================ */

function gvizToObjects(response) {

  if (
    !response ||
    !response.table
  ) {

    throw new Error(
      "Invalid Google Sheets response."
    );

  }


  const table = response.table;

  const cols = table.cols.map(col =>
    normalize(col.label)
  );


  return table.rows.map(row => {

    const obj = {};

    cols.forEach((col, index) => {

      if (!col) return;

      const cell =
        row.c &&
        row.c[index];

      obj[col] =
        cell && cell.v !== undefined
          ? cell.v
          : "";

    });

    return obj;

  });

}


/* ============================================================
   LOAD STUDENTS
============================================================ */

async function loadStudents() {

  const response =
    await loadGoogleSheet({

      gid: STUDENTS_GID

    });


  return gvizToObjects(response);

}


/* ============================================================
   LOAD TEACHERS
============================================================ */

async function loadTeachers() {

  const response =
    await loadGoogleSheet({

      sheet: TEACHERS_SHEET_NAME

    });


  return gvizToObjects(response);

}


/* ============================================================
   MAP STUDENT ROW
============================================================ */

function convertStudent(row) {

  const name =
    row["İSİM SOYİSİM"] ||
    row["ISIM SOYISIM"] ||
    row["NAME"] ||
    row["STUDENT"] ||
    "";

  const level =
    row["NORM_SEVIYE"] ||
    row["NORM SEVIYE"] ||
    row["YENI DONEM SEVIYE"] ||
    row["LEVEL"] ||
    "";

  const time =
    row["ZAMAN"] ||
    row["TIME"] ||
    row["GROUP"] ||
    "";

  const status =
    row["KAYIT DURUMU (KY/YK)"] ||
    row["KAYIT DURUMU"] ||
    row["STATUS"] ||
    "";


  return {

    name: String(name).trim(),

    level: normalizeLevel(level),

    time: normalize(time),

    status: normalize(status)

  };

}


/* ============================================================
   MAP TEACHER ROW
============================================================ */

function convertTeacher(row) {

  const group =
    row["GROUP"] ||
    row["GRUP"] ||
    "";

  const level =
    row["LEVEL"] ||
    row["SEVIYE"] ||
    row["SEVİYE"] ||
    "";

  const teacher =
    row["TEACHER"] ||
    row["TEACHER NAME"] ||
    row["TEACHERNAME"] ||
    row["MODERATOR"] ||
    "";


  return {

    group: normalize(group),

    level: normalizeLevel(level),

    teacher: String(teacher).trim()

  };

}


/* ============================================================
   CREATE TEACHER MAP
============================================================ */

function createTeacherMap(teacherRows) {

  const map = {};


  teacherRows
    .map(convertTeacher)
    .forEach(item => {

      if (!item.group || !item.level) {
        return;
      }


      const key =
        item.group +
        "|" +
        item.level;


      map[key] =
        item.teacher || "TBD";

    });


  return map;

}


/* ============================================================
   CHECK GROUP MATCH
============================================================ */

function belongsToGroup(time, groupKey) {

  const t = normalize(time);

  if (!t) return false;


  if (groupKey === "MW") {

    return t === "MW" ||
           t.includes("MW");

  }


  if (groupKey === "TT") {

    return t === "TT" ||
           t.includes("TT");

  }


  if (groupKey === "SA") {

    return (
      t === "SA" ||
      t === "SA-SU" ||
      t === "SA SU"
    );

  }


  if (groupKey === "SU") {

    return (
      t === "SU" ||
      t === "SA-SU" ||
      t === "SA SU"
    );

  }


  return false;

}


/* ============================================================
   INITIALS
============================================================ */

function getInitials(name) {

  const parts =
    String(name)
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  if (!parts.length) {
    return "?";
  }


  if (parts.length === 1) {

    return parts[0]
      .substring(0, 2)
      .toUpperCase();

  }


  return (
    parts[0][0] +
    parts[1][0]
  ).toUpperCase();

}


/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ============================================================
   GROUP STUDENTS
============================================================ */

function getStudentsForGroup(
  students,
  groupKey
) {

  return students.filter(student =>

    belongsToGroup(
      student.time,
      groupKey
    )

  );

}


/* ============================================================
   GROUP BY LEVEL
============================================================ */

function groupByLevel(students) {

  const map = {};


  students.forEach(student => {

    const level =
      student.level || "BELİRSİZ";


    if (!map[level]) {
      map[level] = [];
    }


    map[level].push(student);

  });


  return Object.entries(map)
    .sort(([a], [b]) => {

      const ai =
        LEVEL_ORDER.indexOf(a);

      const bi =
        LEVEL_ORDER.indexOf(b);


      const aa =
        ai === -1 ? 999 : ai;

      const bb =
        bi === -1 ? 999 : bi;


      return aa - bb;

    });

}


/* ============================================================
   RENDER SLIDE
============================================================ */

function renderSlide(
  groupIndex,
  students,
  teacherMap
) {

  const group =
    groups[groupIndex];


  const groupStudents =
    getStudentsForGroup(
      students,
      group.key
    );


  const byLevel =
    groupByLevel(groupStudents);


  /* HEADER */

  const badge =
    document.getElementById(
      "group-badge"
    );


  badge.textContent =
    group.label;


  badge.style.background =
    group.color;


  document.getElementById(
    "days-label"
  ).textContent =
    group.days;


  /* ASSIGNMENT CHECK */

  const hasTeacher =
    byLevel.some(([level]) => {

      const key =
        normalize(group.key) +
        "|" +
        normalizeLevel(level);

      const teacher =
        teacherMap[key];

      return (
        teacher &&
        teacher.toUpperCase() !== "TBD"
      );

    });


  const content =
    document.getElementById(
      "slide-content"
    );


  if (!groupStudents.length) {

    content.innerHTML = `

      <div class="slide-header">

        <div class="group-title">
          ${escapeHTML(group.days)}
        </div>

        <div class="group-meta">

          <div class="meta-chip">
            Students
            <strong>0</strong>
          </div>

          <div class="assignment-status">
            Teacher assignment pending
          </div>

        </div>

      </div>

      <div class="error-box">
        No students found for this group.
      </div>

    `;

  } else {

    content.innerHTML = `

      <div class="slide-header">

        <div class="group-title">
          ${escapeHTML(group.days)}
        </div>

        <div class="group-meta">

          <div class="meta-chip">
            Students
            <strong>${groupStudents.length}</strong>
          </div>

          <div class="assignment-status"
               style="${
                 hasTeacher
                 ? "color:#2f8f62;background:#eefaf4;border-color:#c8ead8;"
                 : ""
               }">

            ${
              hasTeacher
              ? "Teachers assigned"
              : "Teacher assignment pending"
            }

          </div>

        </div>

      </div>


      <div class="levels-grid">

        ${byLevel.map(
          ([level, levelStudents]) => {

            const key =
              normalize(group.key) +
              "|" +
              normalizeLevel(level);


            const teacher =
              teacherMap[key] ||
              "TBD";


            const teacherIsTBD =
              !teacher ||
              teacher.toUpperCase() === "TBD";


            return `

              <div class="level-card">

                <div class="level-card-header">

                  <span class="level-name">
                    ${escapeHTML(level)}
                  </span>

                  <span class="level-count">
                    ${levelStudents.length}
                  </span>

                </div>


                <div class="teacher-row">

                  <span class="teacher-label">
                    Teacher
                  </span>

                  <span class="
                    teacher-name
                    ${teacherIsTBD ? "tbd" : ""}
                  ">

                    ${escapeHTML(teacher)}

                  </span>

                </div>


                <div class="student-list">

                  ${levelStudents.map(
                    student => {

                      let statusClass =
                        "empty";

                      let statusText =
                        "Status not specified";


                      if (
                        student.status === "KY"
                      ) {

                        statusClass = "ky";
                        statusText = "Enrolled";

                      }
                      else if (
                        student.status === "YK"
                      ) {

                        statusClass = "yk";
                        statusText = "Not enrolled";

                      }


                      return `

                        <div class="student-row">

                          <div class="avatar">
                            ${escapeHTML(
                              getInitials(
                                student.name
                              )
                            )}
                          </div>

                          <div class="student-name">
                            ${escapeHTML(
                              student.name
                            )}
                          </div>

                          <div class="
                            status-dot
                            ${statusClass}
                          "></div>

                          <div class="
                            status-text
                            ${statusClass}
                          ">

                            ${statusText}

                          </div>

                        </div>

                      `;

                    }
                  ).join("")}

                </div>

              </div>

            `;

          }
        ).join("")}

      </div>

    `;

  }


  /* COUNTER */

  document.getElementById(
    "slide-counter"
  ).textContent =
    `${groupIndex + 1} / ${groups.length}`;


  /* DOTS */

  document
    .querySelectorAll(".dot")
    .forEach((dot, index) => {

      dot.classList.toggle(
        "active",
        index === groupIndex
      );

    });

}


/* ============================================================
   GLOBAL DATA
============================================================ */

let students = [];

let teacherMap = {};

let currentSlide = 0;

let paused = false;

let elapsed = 0;

let lastTick = null;

let raf = null;


/* ============================================================
   BUILD NAV DOTS
============================================================ */

function buildDots() {

  const wrap =
    document.getElementById(
      "nav-dots"
    );


  wrap.innerHTML = "";


  groups.forEach(
    (group, index) => {

      const dot =
        document.createElement(
          "div"
        );


      dot.className =
        "dot" +
        (index === 0
          ? " active"
          : "");


      dot.title =
        group.days;


      dot.addEventListener(
        "click",
        () => {

          currentSlide =
            index;

          resetTimer();

          renderSlide(
            currentSlide,
            students,
            teacherMap
          );

        }
      );


      wrap.appendChild(dot);

    }
  );

}


/* ============================================================
   TIMER
============================================================ */

const SLIDE_DURATION = 15000;


function resetTimer() {

  elapsed = 0;

  lastTick =
    performance.now();

}


function tick(now) {

  if (!paused) {

    if (lastTick) {

      elapsed +=
        now - lastTick;

    }


    lastTick = now;


    const pct =
      Math.max(
        0,
        100 -
        (
          elapsed /
          SLIDE_DURATION
        ) *
        100
      );


    document.getElementById(
      "timer-bar"
    ).style.width =
      pct + "%";


    if (
      elapsed >=
      SLIDE_DURATION
    ) {

      currentSlide =
        (
          currentSlide + 1
        ) %
        groups.length;


      renderSlide(
        currentSlide,
        students,
        teacherMap
      );


      elapsed = 0;

    }

  } else {

    lastTick = now;

  }


  raf =
    requestAnimationFrame(
      tick
    );

}


/* ============================================================
   LOAD EVERYTHING
============================================================ */

async function loadAll() {

  const content =
    document.getElementById(
      "slide-content"
    );


  content.innerHTML = `

    <div class="empty">
      Loading students and teachers...
    </div>

  `;


  try {

    /*
      Load BOTH sheets independently.

      Students:
      gid = 610591116

      Teachers:
      sheet name = Teachers
    */

    const [
      studentRows,
      teacherRows
    ] = await Promise.all([

      loadStudents(),

      loadTeachers()

    ]);


    students =
      studentRows
        .map(convertStudent)
        .filter(
          s => s.name
        );


    teacherMap =
      createTeacherMap(
        teacherRows
      );


    console.log(
      "Students loaded:",
      students
    );


    console.log(
      "Teacher map:",
      teacherMap
    );


    /*
      IMPORTANT DEBUG INFORMATION
    */

    console.log(
      "Teacher assignments found:",
      Object.keys(
        teacherMap
      ).length
    );


    renderSlide(
      currentSlide,
      students,
      teacherMap
    );


    const now =
      new Date();


    document.getElementById(
      "updated"
    ).textContent =
      "Updated " +
      now.toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }
      );


  } catch (error) {

    console.error(
      "Google Sheets error:",
      error
    );


    content.innerHTML = `

      <div class="error-box">

        <strong>
          Could not load Google Sheet.
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

        <br><br>

        Make sure:

        <br>
        • The Google Sheet is accessible
        <br>
        • The main sheet uses gid ${STUDENTS_GID}
        <br>
        • The second tab is named exactly "Teachers"
        <br>
        • The Teachers tab has GROUP, LEVEL and TEACHER columns

      </div>

    `;

  }

}


/* ============================================================
   REFRESH BUTTON
============================================================ */

document
  .getElementById(
    "btn-refresh"
  )
  .addEventListener(
    "click",
    async () => {

      await loadAll();

      resetTimer();

    }
  );


/* ============================================================
   PAUSE BUTTON
============================================================ */

document
  .getElementById(
    "btn-pause"
  )
  .addEventListener(
    "click",
    () => {

      paused =
        !paused;


      document.getElementById(
        "btn-pause"
      ).textContent =
        paused
        ? "▶ Resume"
        : "⏸ Pause";

    }
  );


/* ============================================================
   START
============================================================ */

buildDots();

loadAll();

resetTimer();

raf =
  requestAnimationFrame(
    tick
  );

</script>
