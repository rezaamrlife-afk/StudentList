<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmericanLife</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #f4f5f7;
  font-family: Arial, sans-serif;
  color: #222;
}

.screen {
  min-height: 100vh;
  background: #f4f5f7;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  background: #fff;
  border-bottom: 1px solid #ddd;
  padding: 16px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  font-size: 21px;
  font-weight: 700;
}

.logo span {
  color: #4169e1;
}

.group-badge {
  color: white;
  font-size: 12px;
  font-weight: 700;
  padding: 5px 13px;
  border-radius: 20px;
}

.days-label {
  color: #777;
  font-size: 13px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-dots {
  display: flex;
  gap: 7px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ccc;
  cursor: pointer;
}

.dot.active {
  background: #4169e1;
}

.timer-bar-wrap {
  width: 100px;
  height: 3px;
  background: #ddd;
}

.timer-bar {
  height: 100%;
  background: #4169e1;
}

.btn {
  border: 1px solid #ddd;
  background: white;
  color: #555;
  font-size: 12px;
  padding: 7px 12px;
  border-radius: 7px;
  cursor: pointer;
}

.btn:hover {
  background: #f2f2f2;
}

/* MAIN */

.slide {
  flex: 1;
  padding: 28px 30px;
}

.slide-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.group-title {
  font-size: 29px;
  font-weight: 650;
}

.group-meta {
  display: flex;
  gap: 10px;
  align-items: center;
}

.meta-chip {
  background: white;
  border: 1px solid #ddd;
  color: #555;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 20px;
}

.meta-chip strong {
  color: #222;
  margin-left: 4px;
}

.assignment-status {
  background: #fff8df;
  border: 1px solid #f0df9d;
  color: #9a6b00;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 20px;
}

/* LEVEL GRID */

.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
  gap: 14px;
  align-items: start;
}

.level-card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}

.level-card-header {
  padding: 11px 15px;
  border-bottom: 1px solid #eee;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.level-name {
  color: #4169e1;
  font-size: 13px;
  font-weight: 700;
}

.level-count {
  background: #eef2ff;
  color: #4169e1;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 10px;
}

/* TEACHER */

.teacher-row {
  background: #fafafa;
  border-bottom: 1px solid #eee;
  padding: 9px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.teacher-label {
  font-size: 11px;
  color: #888;
}

.teacher-name {
  font-size: 12px;
  font-weight: 700;
  color: #333;
}

.teacher-name.tbd {
  color: #aaa;
  font-weight: 500;
}

/* STUDENTS */

.student-list {
  padding: 6px 0;
}

.student-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 15px;
  border-bottom: 1px solid #f1f1f1;
}

.student-row:last-child {
  border-bottom: none;
}

.avatar {
  width: 29px;
  height: 29px;
  border-radius: 50%;
  background: #edf1ff;
  color: #4169e1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  flex-shrink: 0;
}

.student-name {
  flex: 1;
  font-size: 12px;
  color: #333;
}

.status-text {
  font-size: 10px;
  white-space: nowrap;
}

.status-text.ky {
  color: #2f8f62;
}

.status-text.yk {
  color: #d66a3d;
}

.status-text.empty {
  color: #999;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.status-dot.ky {
  background: #4caf82;
}

.status-dot.yk {
  background: #e87040;
}

.status-dot.empty {
  background: #aaa;
}

/* ERROR */

.error-box {
  background: white;
  border: 1px solid #eccaca;
  color: #b34b4b;
  padding: 20px;
  border-radius: 10px;
  font-size: 13px;
}

.empty {
  padding: 30px;
  text-align: center;
  color: #999;
}

/* FOOTER */

.footer {
  background: white;
  border-top: 1px solid #ddd;
  padding: 12px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.legend {
  display: flex;
  gap: 18px;
  align-items: center;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #777;
}

.legend-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.updated {
  color: #aaa;
  font-size: 10px;
  margin-left: 10px;
}

.slide-counter {
  color: #999;
  font-size: 11px;
}

/* MOBILE */

@media(max-width:800px) {

  .header {
    padding: 13px 16px;
  }

  .days-label,
  .timer-bar-wrap,
  .nav-dots {
    display: none;
  }

  .slide {
    padding: 20px 16px;
  }

  .slide-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .levels-grid {
    grid-template-columns: 1fr;
  }

  .footer {
    padding: 10px 16px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <!-- HEADER -->
  <div class="header">

    <div class="header-left">

      <div class="logo">
        American<span>Life</span>
      </div>

      <div id="group-badge" class="group-badge">
        MW
      </div>

      <div id="days-label" class="days-label">
        Monday & Wednesday
      </div>

    </div>

    <div class="header-right">

          class="legend-dot"

</div>


<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const SPREADSHEET_ID =
"1EP-k7eBQ9w7BUhJ-mdng70EtTPXhDHNMib5lbSXyJBw";

const STUDENTS_GID =
"610591116";

const TEACHERS_SHEET =
"Teachers";


/* =========================================================
   GROUPS
========================================================= */

const groups = [

  {
    key: "MW",
    label: "MW",
    days: "Monday & Wednesday",
    color: "#4169e1"
  },

  {
    key: "TT",
    label: "TT",
    days: "Tuesday & Thursday",
    color: "#e87040"
  },

  {
    key: "SA",
    label: "SA",
    days: "Saturday",
    color: "#4caf82"
  },

  {
    key: "SU",
    label: "SU",
    days: "Sunday",
    color: "#9a63d9"
  }

];


/* =========================================================
   LEVEL ORDER
========================================================= */

const LEVEL_ORDER = [

  "A1.1",
  "A1.2",
  "A1.3",

  "A2.1",
  "A2.2",
  "A2.3",
  "A2.3 MINI",

  "B1.1",
  "B1.2",
  "B1.3",

  "B2.1",
  "B2.2",
  "B2.3",

  "BELİRSİZ"

];


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .trim()
    .replace(/\s+/g, " ")
    .toUpperCase();

}


/* =========================================================
   LEVEL NORMALIZE
========================================================= */

function normalizeLevel(value) {

  let v = normalize(value);

  if (
    v === "?" ||
    v === "" ||
    v === "UNKNOWN" ||
    v === "BELIRSIZ" ||
    v === "BELİRSİZ"
  ) {
    return "BELİRSİZ";
  }

  if (
    v === "A2.3 MINI"
  ) {
    return "A2.3 MINI";
  }

  return v;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   GOOGLE GVIZ JSONP
========================================================= */

function loadGoogleSheet(params) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "sheetCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement("script");


      const timeout =
        setTimeout(() => {

          cleanup();

          reject(
            new Error(
              "Google Sheet request timed out."
            )
          );

        }, 15000);


      window[callbackName] =
        function(data) {

          clearTimeout(timeout);

          cleanup();

          resolve(data);

        };


      function cleanup() {

        delete window[callbackName];

        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(script);

        }

      }


      const query =
        new URLSearchParams();


      query.set(
        "tqx",
        "responseHandler:" +
        callbackName
      );


      Object.keys(params)
        .forEach(key => {

          if (
            params[key] !== undefined &&
            params[key] !== null
          ) {

            query.set(
              key,
              params[key]
            );

          }

        });


      script.src =
        "https://docs.google.com/spreadsheets/d/" +
        SPREADSHEET_ID +
        "/gviz/tq?" +
        query.toString();


      script.onerror =
        function() {

          clearTimeout(timeout);

          cleanup();

          reject(
            new Error(
              "Could not connect to Google Sheets."
            )
          );

        };


      document.body
        .appendChild(script);

    }
  );

}


/* =========================================================
   GVIZ → OBJECTS
========================================================= */

function gvizToObjects(response) {

  if (
    !response ||
    !response.table
  ) {

    throw new Error(
      "Invalid Google Sheets response."
    );

  }


  const columns =
    response.table.cols
      .map(column =>
        normalize(column.label)
      );


  return response.table.rows
    .map(row => {

      const object = {};


      columns.forEach(
        (column, index) => {

          if (!column) return;


          const cell =
            row.c &&
            row.c[index];


          object[column] =
            cell &&
            cell.v !== undefined
              ? cell.v
              : "";

        }
      );


      return object;

    });

}


/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadStudents() {

  const response =
    await loadGoogleSheet({

      gid: STUDENTS_GID

    });


  return gvizToObjects(
    response
  );

}


/* =========================================================
   LOAD TEACHERS
========================================================= */

async function loadTeachers() {

  const response =
    await loadGoogleSheet({

      sheet:
        TEACHERS_SHEET

    });


  return gvizToObjects(
    response
  );

}


/* =========================================================
   STUDENT CONVERSION
========================================================= */

function convertStudent(row) {

  const name =
    row["İSİM SOYİSİM"] ||
    row["ISIM SOYISIM"] ||
    row["NAME"] ||
    row["STUDENT"] ||
    "";


  const level =
    row["NORM_SEVIYE"] ||
    row["NORM SEVIYE"] ||
    row["YENI DONEM SEVIYE"] ||
    row["YENI DÖNEM SEVIYE"] ||
    row["LEVEL"] ||
    "";


  const time =
    row["ZAMAN"] ||
    row["TIME"] ||
    row["GROUP"] ||
    "";


  const status =
    row["KAYIT DURUMU (KY/YK)"] ||
    row["KAYIT DURUMU"] ||
    row["STATUS"] ||
    "";


  return {

    name:
      String(name).trim(),

    level:
      normalizeLevel(level),

    time:
      normalize(time),

    status:
      normalize(status)

  };

}


/* =========================================================
   TEACHER CONVERSION
========================================================= */

function convertTeacher(row) {

  const group =
    row["GROUP"] ||
    row["GRUP"] ||
    "";


  const level =
    row["LEVEL"] ||
    row["SEVIYE"] ||
    row["SEVİYE"] ||
    "";


  const teacher =
    row["TEACHER"] ||
    row["TEACHER NAME"] ||
    row["TEACHERNAME"] ||
    row["MODARES"] ||
    row["مدرس"] ||
    "";


  return {

    group:
      normalize(group),

    level:
      normalizeLevel(level),

    teacher:
      String(teacher).trim()

  };

}


/* =========================================================
   TEACHER MAP
========================================================= */

function createTeacherMap(rows) {

  const map = {};


  rows
    .map(convertTeacher)
    .forEach(item => {

      if (
        !item.group ||
        !item.level
      ) {
        return;
      }


      const key =
        item.group +
        "|" +
        item.level;


      map[key] =
        item.teacher || "TBD";

    });


  return map;

}


/* =========================================================
   GROUP MATCH
========================================================= */

function belongsToGroup(
  time,
  groupKey
) {

  const t =
    normalize(time);


  if (!t) {
    return false;
  }


  if (groupKey === "MW") {

    return (
      t === "MW" ||
      t.includes("MW")
    );

  }


  if (groupKey === "TT") {

    return (
      t === "TT" ||
      t.includes("TT")
    );

  }


  if (groupKey === "SA") {

    return (
      t === "SA" ||
      t === "SA-SU" ||
      t === "SA SU"
    );

  }


  if (groupKey === "SU") {

    return (
      t === "SU" ||
      t === "SA-SU" ||
      t === "SA SU"
    );

  }


  return false;

}


/* =========================================================
   INITIALS
========================================================= */

function getInitials(name) {

  const parts =
    String(name)
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  if (!parts.length) {
    return "?";
  }


  if (parts.length === 1) {

    return parts[0]
      .substring(0, 2)
      .toUpperCase();

  }


  return (
    parts[0][0] +
    parts[1][0]
  ).toUpperCase();

}


/* =========================================================
   GROUP STUDENTS
========================================================= */

function getStudentsForGroup(
  students,
  groupKey
) {

  return students.filter(
    student =>
      belongsToGroup(
        student.time,
        groupKey
      )
  );

}


/* =========================================================
   GROUP BY LEVEL
========================================================= */

function groupByLevel(students) {

  const map = {};


  students.forEach(student => {

    const level =
      student.level ||
      "BELİرسİZ";


    if (!map[level]) {
      map[level] = [];
    }


    map[level].push(student);

  });


  return Object.entries(map)
    .sort(([a], [b]) => {

      const ai =
        LEVEL_ORDER.indexOf(
          a
        );

      const bi =
        LEVEL_ORDER.indexOf(
          b
        );


      return (
        (ai === -1 ? 999 : ai) -
        (bi === -1 ? 999 : bi)
      );

    });

}


/* =========================================================
   RENDER
========================================================= */

function renderSlide(
  groupIndex
) {

  const group =
    groups[groupIndex];


  const groupStudents =
    getStudentsForGroup(
      students,
      group.key
    );


  const levels =
    groupByLevel(
      groupStudents
    );


  document.getElementById(
    "group-badge"
  ).textContent =
    group.label;


  document.getElementById(
    "group-badge"
  ).style.background =
    group.color;


  document.getElementById(
    "days-label"
  ).textContent =
    group.days;


  const content =
    document.getElementById(
      "slide-content"
    );


  if (!groupStudents.length) {

    content.innerHTML = `

      <div class="slide-header">

        <div class="group-title">
          ${escapeHTML(group.days)}
        </div>

        <div class="group-meta">

          <div class="meta-chip">
            Students
            <strong>0</strong>
          </div>

          <div class="assignment-status">
            Teacher assignment pending
          </div>

        </div>

      </div>

      <div class="error-box">
        No students in this group.
      </div>

    `;

  }

  else {

    content.innerHTML = `

      <div class="slide-header">

        <div class="group-title">
          ${escapeHTML(group.days)}
        </div>

        <div class="group-meta">

          <div class="meta-chip">
            Students
            <strong>
              ${groupStudents.length}
            </strong>
          </div>

          <div class="assignment-status">
            Teachers
          </div>

        </div>

      </div>


      <div class="levels-grid">

        ${levels.map(
          ([level, levelStudents]) => {

            const teacherKey =
              normalize(group.key) +
              "|" +
              normalizeLevel(level);


            const teacher =
              teacherMap[
                teacherKey
              ] ||
              "TBD";


            const teacherIsTBD =
              !teacher ||
              normalize(teacher) ===
              "TBD";


            return `

              <div class="level-card">

                <div class="level-card-header">

                  <span class="level-name">
                    ${escapeHTML(level)}
                  </span>

                  <span class="level-count">
                    ${levelStudents.length}
                  </span>

                </div>


                <div class="teacher-row">

                  <span class="teacher-label">
                    Teacher
                  </span>

                  <span class="
                    teacher-name
                    ${teacherIsTBD ? "tbd" : ""}
                  ">

                    ${escapeHTML(teacher)}

                  </span>

                </div>


                <div class="student-list">

                  ${levelStudents.map(
                    student => {

                      let statusClass =
                        "empty";

                      let statusText =
                        "Status not specified";


                      if (
                        student.status ===
                        "KY"
                      ) {

                        statusClass =
                          "ky";

                        statusText =
                          "Enrolled";

                      }

                      else if (
                        student.status ===
                        "YK"
                      ) {

                        statusClass =
                          "yk";

                        statusText =
                          "Not enrolled";

                      }


                      return `

                        <div class="student-row">

                          <div class="avatar">
                            ${escapeHTML(
                              getInitials(
                                student.name
                              )
                            )}
                          </div>

                          <div class="student-name">
                            ${escapeHTML(
                              student.name
                            )}
                          </div>

                          <div class="
                            status-dot
                            ${statusClass}
                          "></div>

                          <div class="
                            status-text
                            ${statusClass}
                          ">

                            ${statusText}

                          </div>

                        </div>

                      `;

                    }
                  ).join("")}

                </div>

              </div>

            `;

          }
        ).join("")}

      </div>

    `;

  }


  document.getElementById(
    "slide-counter"
  ).textContent =
    `${groupIndex + 1} / ${groups.length}`;


  document
    .querySelectorAll(".dot")
    .forEach(
      (dot, index) => {

        dot.classList.toggle(
          "active",
          index === groupIndex
        );

      }
    );

}


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let students = [];

let teacherMap = {};

let currentSlide = 0;

let paused = false;

let elapsed = 0;

let lastTick = null;


/* =========================================================
   DOTS
========================================================= */

function buildDots() {

  const container =
    document.getElementById(
      "nav-dots"
    );


  container.innerHTML = "";


  groups.forEach(
    (group, index) => {

      const dot =
        document.createElement(
          "div"
        );


      dot.className =
        index === 0
          ? "dot active"
          : "dot";


      dot.title =
        group.days;


      dot.onclick =
        function() {

          currentSlide =
            index;

          resetTimer();

          renderSlide(
            currentSlide
          );

        };


      container.appendChild(
        dot
      );

    }
  );

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadAll() {

  const content =
    document.getElementById(
      "slide-content"
    );


  content.innerHTML = `

    <div class="empty">
      Loading students and teachers...
    </div>

  `;


  try {

    /*
      IMPORTANT:

      Students come from:
      gid 610591116

      Teachers come from:
      tab "Teachers"
    */

    const results =
      await Promise.all([

        loadStudents(),

        loadTeachers()

      ]);


    const studentRows =
      results[0];


    const teacherRows =
      results[1];


    students =
      studentRows
        .map(
          convertStudent
        )
        .filter(
          student =>
            student.name
        );


    teacherMap =
      createTeacherMap(
        teacherRows
      );


    console.log(
      "Students:",
      students
    );


    console.log(
      "Teachers:",
      teacherMap
    );


    renderSlide(
      currentSlide
    );


    const now =
      new Date();


    document.getElementById(
      "updated"
    ).textContent =
      "Updated " +
      now.toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }
      );

  }

  catch(error) {

    console.error(
      error
    );


    content.innerHTML = `

      <div class="error-box">

        <strong>
          Could not load Google Sheet.
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

        <br><br>

        Check that:

        <br>
        • Google Sheet is accessible
        <br>
        • Main sheet has gid ${STUDENTS_GID}
        <br>
        • Teachers tab is named exactly:
          <strong>Teachers</strong>
        <br>
        • Teachers has:
          GROUP | LEVEL | TEACHER

      </div>

    `;

  }

}


/* =========================================================
   REFRESH
========================================================= */

document.getElementById(
  "btn-refresh"
).onclick =
  async function() {

    await loadAll();

    resetTimer();

  };


/* =========================================================
   PAUSE
========================================================= */

document.getElementById(
  "btn-pause"
).onclick =
  function() {

    paused =
      !paused;


    this.textContent =
      paused
        ? "▶ Resume"
        : "⏸ Pause";

  };


/* =========================================================
   TIMER
========================================================= */

const SLIDE_DURATION =
  15000;


function resetTimer() {

  elapsed = 0;

  lastTick =
    performance.now();

}


function tick(now) {

  if (!paused) {

    if (lastTick) {

      elapsed +=
        now - lastTick;

    }


    lastTick = now;


    const percentage =
      Math.max(
        0,
        100 -
        (
          elapsed /
          SLIDE_DURATION
        ) *
        100
      );


    document.getElementById(
      "timer-bar"
    ).style.width =
      percentage + "%";


    if (
      elapsed >=
      SLIDE_DURATION
    ) {

      currentSlide =
        (
          currentSlide + 1
        ) %
        groups.length;


      renderSlide(
        currentSlide
      );


      elapsed = 0;

    }

  }

  else {

    lastTick = now;

  }


  requestAnimationFrame(
    tick
  );

}


/* =========================================================
   START
========================================================= */

buildDots();

loadAll();

resetTimer();

requestAnimationFrame(
  tick
);

</script>
