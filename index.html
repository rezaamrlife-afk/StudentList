<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmericanLife Student List</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #f5f6f8;
  font-family: Arial, Helvetica, sans-serif;
  color: #222;
}

.screen {
  background: #f5f6f8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  font-size: 20px;
  font-weight: 600;
  color: #111827;
  letter-spacing: 0.02em;
}

.logo span {
  color: #6c8ef5;
}

.group-badge {
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
}

.days-label {
  font-size: 13px;
  color: #6b7280;
}

/* HEADER RIGHT */

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.nav-dots {
  display: flex;
  gap: 8px;
  align-items: center;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d1d5db;
  cursor: pointer;
  transition: all .2s;
}

.dot.active {
  background: #6c8ef5;
  transform: scale(1.2);
}

.timer-bar-wrap {
  width: 120px;
  height: 3px;
  background: #e5e7eb;
  border-radius: 2px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  background: #6c8ef5;
  border-radius: 2px;
}

.btn-pause {
  background: #ffffff;
  border: 1px solid #d1d5db;
  color: #555;
  font-size: 12px;
  padding: 7px 14px;
  border-radius: 6px;
  cursor: pointer;
}

.btn-pause:hover {
  background: #f3f4f6;
}

/* SLIDE */

.slide {
  flex: 1;
  padding: 28px 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.slide-header {
  display: flex;
  align-items: flex-end;
  gap: 20px;
}

.group-title {
  font-size: 30px;
  font-weight: 600;
  color: #111827;
}

.group-meta {
  display: flex;
  gap: 12px;
  align-items: center;
  padding-bottom: 3px;
}

.meta-chip {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  color: #555;
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.meta-chip .label {
  color: #9ca3af;
}

.meta-chip .value {
  color: #333;
  font-weight: 600;
}

.teacher-chip {
  background: #eef2ff;
  border: 1px solid #dbe3ff;
  color: #526ed8;
  font-size: 12px;
  padding: 5px 14px;
  border-radius: 20px;
}

/* LEVELS */

.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
  flex: 1;
  align-content: start;
}

.level-card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.03);
}

.level-card-header {
  padding: 11px 16px;
  border-bottom: 1px solid #edf0f3;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.level-name {
  font-size: 13px;
  font-weight: 600;
  color: #526ed8;
  letter-spacing: .04em;
}

.level-count {
  background: #eef2ff;
  color: #526ed8;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 10px;
}

.student-list {
  padding: 7px 0;
}

.student-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  border-bottom: 1px solid #f1f2f4;
}

.student-row:last-child {
  border-bottom: none;
}

.avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #eef2ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  color: #526ed8;
  flex-shrink: 0;
}

.student-name {
  font-size: 13px;
  color: #374151;
  flex: 1;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.status-dot.ky {
  background: #4caf82;
}

.status-dot.yk {
  background: #e87040;
}

/* LOADING */

.loading {
  text-align: center;
  padding: 60px 20px;
  color: #9ca3af;
  font-size: 14px;
}

/* ERROR */

.error {
  background: #fff1f2;
  border: 1px solid #fecdd3;
  color: #be123c;
  border-radius: 10px;
  padding: 18px;
  font-size: 14px;
}

/* FOOTER */

.footer {
  padding: 12px 32px;
  background: #ffffff;
  border-top: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.legend {
  display: flex;
  gap: 16px;
  align-items: center;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #6b7280;
}

.legend-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.slide-counter {
  font-size: 12px;
  color: #9ca3af;
}

/* MOBILE */

@media (max-width: 700px) {

  .header {
    padding: 15px;
  }

  .header-right {
    gap: 10px;
  }

  .timer-bar-wrap {
    display: none;
  }

  .days-label {
    display: none;
  }

  .slide {
    padding: 20px 15px;
  }

  .slide-header {
    align-items: flex-start;
    flex-direction: column;
    gap: 10px;
  }

  .group-title {
    font-size: 24px;
  }

  .levels-grid {
    grid-template-columns: 1fr;
  }

  .footer {
    padding: 12px 15px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <div class="header">

    <div class="header-left">

      <div class="logo">
        American<span>Life</span>
      </div>

      <div id="group-badge" class="group-badge">
        MW
      </div>

      <div id="days-label" class="days-label">
        Monday & Wednesday
      </div>

    </div>

    <div class="header-right">

      <div class="nav-dots" id="nav-dots"></div>

      <div class="timer-bar-wrap">
        <div
          class="timer-bar"
          id="timer-bar"
          style="width:100%">
        </div>
      </div>

      <button
        class="btn-pause"
        id="btn-pause">
        ⏸ Pause
      </button>

    </div>

  </div>


  <div class="slide" id="slide-content">

    <div class="loading">
      Loading students...
    </div>

  </div>


  <div class="footer">

    <div class="legend">

      <div class="legend-item">
        <div
          class="legend-dot"
          style="background:#4caf82">
        </div>
        Enrolled (KY)
      </div>

      <div class="legend-item">
        <div
          class="legend-dot"
          style="background:#e87040">
        </div>
        Not enrolled (YK)
      </div>

    </div>

    <div
      class="slide-counter"
      id="slide-counter">
    </div>

  </div>

</div>


<script>

/* =========================================================
   GOOGLE SHEET
   ========================================================= */

const SHEET_ID =
"1EP-k7eBQ9w7BUhJ-mdng70EtTPXhDHNMib5lbSXyJBw";

const SHEET_GID =
"610591116";


/*
  Google Visualization endpoint
  This reads the Google Sheet directly.
*/

const SHEET_URL =
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`;


/* =========================================================
   GROUPS
   ========================================================= */

const groups = [

  {
    key: "MW",
    label: "MW",
    days: "Monday & Wednesday",
    color: "#6c8ef5"
  },

  {
    key: "TT",
    label: "TT",
    days: "Tuesday & Thursday",
    color: "#e87040"
  },

  {
    key: "SA",
    label: "SA",
    days: "Saturday",
    color: "#4caf82"
  },

  {
    key: "SU",
    label: "SU",
    days: "Sunday",
    color: "#b06cf5"
  }

];


/* =========================================================
   DATA
   ========================================================= */

let data = [];


/* =========================================================
   GET INITIALS
   ========================================================= */

function getInitials(name) {

  if (!name) return "?";

  const parts =
    name.trim().split(/\s+/);

  if (parts.length === 1) {
    return parts[0].substring(0,2).toUpperCase();
  }

  return (
    parts[0][0] +
    parts[1][0]
  ).toUpperCase();

}


/* =========================================================
   CLEAN VALUE
   ========================================================= */

function clean(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value).trim();

}


/* =========================================================
   FIND COLUMN
   ========================================================= */

function findColumn(headers, names) {

  for (const name of names) {

    const index =
      headers.findIndex(
        h =>
          h.toLowerCase().trim() ===
          name.toLowerCase().trim()
      );

    if (index !== -1) {
      return index;
    }

  }

  return -1;

}


/* =========================================================
   LOAD GOOGLE SHEET
   ========================================================= */

async function loadStudents() {

  const content =
    document.getElementById("slide-content");

  content.innerHTML = `
    <div class="loading">
      Loading students from Google Sheet...
    </div>
  `;

  try {

    const response =
      await fetch(SHEET_URL);

    if (!response.ok) {
      throw new Error(
        "Could not access Google Sheet."
      );
    }

    const text =
      await response.text();


    /*
      Google returns:

      google.visualization.Query.setResponse({...})
    */

    const jsonText =
      text.substring(
        text.indexOf("{"),
        text.lastIndexOf("}") + 1
      );


    const json =
      JSON.parse(jsonText);


    const rows =
      json.table.rows || [];


    const headers =
      json.table.cols.map(
        col =>
          clean(col.label || col.id)
      );


    console.log("Google Sheet headers:", headers);


    /*
      Try to automatically detect columns.
    */

    const nameIndex =
      findColumn(headers, [
        "name",
        "student",
        "student name",
        "student_name",
        "fullname",
        "full name"
      ]);


    const levelIndex =
      findColumn(headers, [
        "level",
        "cefr",
        "class level"
      ]);


    const timeIndex =
      findColumn(headers, [
        "time",
        "days",
        "day",
        "schedule",
        "group"
      ]);


    const statusIndex =
      findColumn(headers, [
        "status",
        "enrollment",
        "enrolled"
      ]);


    console.log({
      nameIndex,
      levelIndex,
      timeIndex,
      statusIndex
    });


    /*
      If headers were not detected,
      use first 4 columns.
    */

    const finalNameIndex =
      nameIndex >= 0 ? nameIndex : 0;

    const finalLevelIndex =
      levelIndex >= 0 ? levelIndex : 1;

    const finalTimeIndex =
      timeIndex >= 0 ? timeIndex : 2;

    const finalStatusIndex =
      statusIndex >= 0 ? statusIndex : 3;


    data =
      rows.map(row => {

        const cells =
          row.c || [];

        return {

          name:
            clean(
              cells[finalNameIndex]?.v
            ),

          level:
            clean(
              cells[finalLevelIndex]?.v
            ) || "BELİRSİZ",

          time:
            clean(
              cells[finalTimeIndex]?.v
            ).toUpperCase(),

          status:
            clean(
              cells[finalStatusIndex]?.v
            ).toUpperCase()

        };

      })
      .filter(student =>
        student.name
      );


    console.log(
      "Students loaded:",
      data
    );


    if (!data.length) {

      content.innerHTML = `
        <div class="error">
          No students were found in the Google Sheet.
        </div>
      `;

      return;
    }


    buildDots();

    renderSlide(0);

    resetTimer();

    raf =
      requestAnimationFrame(tick);


  } catch (error) {

    console.error(error);

    content.innerHTML = `
      <div class="error">
        <strong>Google Sheet could not be loaded.</strong>
        <br><br>
        Make sure the Google Sheet is shared as
        <strong>Anyone with the link → Viewer</strong>.
        <br><br>
        Error:
        ${error.message}
      </div>
    `;

  }

}


/* =========================================================
   FILTER STUDENTS
   ========================================================= */

function getStudentsForGroup(groupKey) {

  return data.filter(student => {

    const t =
      student.time
        .toUpperCase()
        .trim();


    if (groupKey === "MW") {

      return t.includes("MW");

    }


    if (groupKey === "TT") {

      return t.includes("TT");

    }


    if (groupKey === "SA") {

      return (
        t === "SA" ||
        t === "SA-SU" ||
        t.includes("SA")
      );

    }


    if (groupKey === "SU") {

      return (
        t === "SU" ||
        t === "SA-SU" ||
        t.includes("SU")
      );

    }


    return false;

  });

}


/* =========================================================
   GROUP BY LEVEL
   ========================================================= */

function groupByLevel(students) {

  const map = {};


  students.forEach(student => {

    const level =
      student.level || "BELİRSİZ";

    if (!map[level]) {
      map[level] = [];
    }

    map[level].push(student);

  });


  const order = [

    "A1.1",
    "A1.2",
    "A1.3",

    "A2.1",
    "A2.2",
    "A2.3",
    "A2.3 MINI",
    "A2.3 mini",

    "B1.1",
    "B1.2",
    "B1.3",

    "B2.1",

    "BELİRSİZ"

  ];


  return Object.entries(map)
    .sort(([a], [b]) => {

      const ai =
        order.findIndex(
          x =>
            x.toLowerCase() ===
            a.toLowerCase()
        );

      const bi =
        order.findIndex(
          x =>
            x.toLowerCase() ===
            b.toLowerCase()
        );


      return (
        (ai === -1 ? 999 : ai) -
        (bi === -1 ? 999 : bi)
      );

    });

}


/* =========================================================
   RENDER SLIDE
   ========================================================= */

function renderSlide(groupIdx) {

  const group =
    groups[groupIdx];


  const students =
    getStudentsForGroup(group.key);


  const byLevel =
    groupByLevel(students);


  document.getElementById(
    "group-badge"
  ).textContent =
    group.label;


  document.getElementById(
    "group-badge"
  ).style.background =
    group.color;


  document.getElementById(
    "days-label"
  ).textContent =
    group.days;


  const content =
    document.getElementById(
      "slide-content"
    );


  if (!students.length) {

    content.innerHTML = `

      <div class="slide-header">

        <div class="group-title">
          ${group.days}
        </div>

        <div class="group-meta">

          <div class="meta-chip">

            <span class="label">
              Students
            </span>

            <span class="value">
              0
            </span>

          </div>

          <div class="teacher-chip">
            Teacher: TBD
          </div>

        </div>

      </div>


      <div class="loading">
        No students in this group.
      </div>

    `;

  }

  else {

    content.innerHTML = `

      <div class="slide-header">

        <div class="group-title">
          ${group.days}
        </div>

        <div class="group-meta">

          <div class="meta-chip">

            <span class="label">
              Students
            </span>

            <span class="value">
              ${students.length}
            </span>

          </div>

          <div class="teacher-chip">
            Teacher: TBD
          </div>

        </div>

      </div>


      <div class="levels-grid">

        ${byLevel.map(
          ([level, students]) => `

          <div class="level-card">

            <div class="level-card-header">

              <span class="level-name">
                ${level}
              </span>

              <span class="level-count">
                ${students.length}
              </span>

            </div>


            <div class="student-list">

              ${students.map(
                student => `

                <div class="student-row">

                  <div class="avatar">
                    ${getInitials(student.name)}
                  </div>

                  <div class="student-name">
                    ${student.name}
                  </div>

                  <div
                    class="status-dot ${
                      student.status === "KY"
                        ? "ky"
                        : "yk"
                    }">
                  </div>

                </div>

              `
              ).join("")}

            </div>

          </div>

        `
        ).join("")}

      </div>

    `;

  }


  document.getElementById(
    "slide-counter"
  ).textContent =
    `${groupIdx + 1} / ${groups.length}`;


  const dots =
    document.querySelectorAll(".dot");


  dots.forEach(
    (dot, index) => {

      dot.classList.toggle(
        "active",
        index === groupIdx
      );

    }
  );

}


/* =========================================================
   DOTS
   ========================================================= */

function buildDots() {

  const wrap =
    document.getElementById(
      "nav-dots"
    );


  wrap.innerHTML = "";


  groups.forEach(
    (group, index) => {

      const dot =
        document.createElement(
          "div"
        );


      dot.className =
        "dot" +
        (index === 0
          ? " active"
          : "");


      dot.title =
        group.days;


      dot.addEventListener(
        "click",
        () => {

          currentSlide =
            index;

          resetTimer();

          renderSlide(
            index
          );

        }
      );


      wrap.appendChild(dot);

    }
  );

}


/* =========================================================
   TIMER
   ========================================================= */

const SLIDE_DURATION =
  15000;

let currentSlide =
  0;

let paused =
  false;

let elapsed =
  0;

let lastTick =
  null;

let raf =
  null;


/* =========================================================
   RESET TIMER
   ========================================================= */

function resetTimer() {

  elapsed = 0;

  lastTick =
    performance.now();

}


/* =========================================================
   TIMER TICK
   ========================================================= */

function tick(now) {

  if (!paused) {

    if (lastTick) {

      elapsed +=
        now - lastTick;

    }


    lastTick =
      now;


    const pct =
      Math.max(
        0,
        100 -
        (elapsed /
          SLIDE_DURATION) *
        100
      );


    document.getElementById(
      "timer-bar"
    ).style.width =
      pct + "%";


    if (
      elapsed >=
      SLIDE_DURATION
    ) {

      currentSlide =
        (currentSlide + 1) %
        groups.length;


      renderSlide(
        currentSlide
      );


      elapsed = 0;

    }

  }

  else {

    lastTick =
      now;

  }


  raf =
    requestAnimationFrame(
      tick
    );

}


/* =========================================================
   PAUSE / RESUME
   ========================================================= */

document
  .getElementById(
    "btn-pause"
  )
  .addEventListener(
    "click",
    () => {

      paused =
        !paused;


      document.getElementById(
        "btn-pause"
      ).textContent =
        paused
          ? "▶ Resume"
          : "⏸ Pause";

    }
  );


/* =========================================================
   AUTO REFRESH FROM GOOGLE SHEET
   ========================================================= */

/*
  Every 60 seconds the data is
  downloaded again from Google Sheet.

  So if a new student is added,
  the display updates automatically.
*/

setInterval(
  async () => {

    const oldData =
      JSON.stringify(data);

    try {

      const response =
        await fetch(
          SHEET_URL +
          "&cache=" +
          Date.now()
        );


      const text =
        await response.text();


      const jsonText =
        text.substring(
          text.indexOf("{"),
          text.lastIndexOf("}") + 1
        );


      const json =
        JSON.parse(jsonText);


      const rows =
        json.table.rows || [];


      const headers =
        json.table.cols.map(
          col =>
            clean(
              col.label ||
              col.id
            )
        );


      const nameIndex =
        findColumn(headers, [
          "name",
          "student",
          "student name",
          "student_name",
          "fullname",
          "full name"
        ]);


      const levelIndex =
        findColumn(headers, [
          "level",
          "cefr",
          "class level"
        ]);


      const timeIndex =
        findColumn(headers, [
          "time",
          "days",
          "day",
          "schedule",
          "group"
        ]);


      const statusIndex =
        findColumn(headers, [
          "status",
          "enrollment",
          "enrolled"
        ]);


      const ni =
        nameIndex >= 0
          ? nameIndex
          : 0;


      const li =
        levelIndex >= 0
          ? levelIndex
          : 1;


      const ti =
        timeIndex >= 0
          ? timeIndex
          : 2;


      const si =
        statusIndex >= 0
          ? statusIndex
          : 3;


      data =
        rows
          .map(row => {

            const cells =
              row.c || [];


            return {

              name:
                clean(
                  cells[ni]?.v
                ),

              level:
                clean(
                  cells[li]?.v
                ) ||
                "BELİRSİZ",

              time:
                clean(
                  cells[ti]?.v
                ).toUpperCase(),

              status:
                clean(
                  cells[si]?.v
                ).toUpperCase()

            };

          })
          .filter(
            student =>
              student.name
          );


      if (
        JSON.stringify(data) !==
        oldData
      ) {

        console.log(
          "Google Sheet updated."
        );


        renderSlide(
          currentSlide
        );

      }

    }

    catch (error) {

      console.warn(
        "Refresh failed:",
        error
      );

    }

  },

  60000
);


/* =========================================================
   START
   ========================================================= */

loadStudents();

</script>

</body>
</html>
