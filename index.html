<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AmericanLife Student Groups</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #f5f6f8;
  font-family: Arial, Helvetica, sans-serif;
  color: #222;
}

.screen {
  min-height: 100vh;
  background: #f5f6f8;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  font-size: 21px;
  font-weight: 600;
  color: #111827;
}

.logo span {
  color: #4969d8;
}

.group-badge {
  color: white;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
}

.days-label {
  font-size: 13px;
  color: #777;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.nav-dots {
  display: flex;
  gap: 8px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d5d8df;
  cursor: pointer;
}

.dot.active {
  background: #4969d8;
}

.timer-bar-wrap {
  width: 120px;
  height: 4px;
  background: #e5e7eb;
  border-radius: 4px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  background: #4969d8;
  width: 100%;
}

.btn-pause {
  background: #ffffff;
  border: 1px solid #d7dbe2;
  color: #555;
  font-size: 12px;
  padding: 7px 14px;
  border-radius: 7px;
  cursor: pointer;
}

.btn-pause:hover {
  background: #f3f4f6;
}

/* MAIN */

.slide {
  flex: 1;
  padding: 30px 32px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.slide-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.group-title {
  font-size: 30px;
  font-weight: 600;
  color: #111827;
}

.group-meta {
  display: flex;
  gap: 10px;
  align-items: center;
}

.meta-chip {
  background: white;
  border: 1px solid #e2e5ea;
  color: #555;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 20px;
}

.meta-chip .label {
  color: #888;
  margin-right: 5px;
}

.meta-chip .value {
  color: #222;
  font-weight: 600;
}

.teacher-chip {
  background: #eef2ff;
  border: 1px solid #dbe3ff;
  color: #4969d8;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 20px;
}

/* LEVELS */

.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 14px;
}

.level-card {
  background: white;
  border: 1px solid #e2e5ea;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.level-card-header {
  padding: 11px 16px;
  border-bottom: 1px solid #edf0f3;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.level-name {
  font-size: 13px;
  font-weight: 600;
  color: #4969d8;
}

.level-count {
  background: #eef2ff;
  color: #4969d8;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 10px;
}

.student-list {
  padding: 7px 0;
}

.student-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  border-bottom: 1px solid #f1f2f4;
}

.student-row:last-child {
  border-bottom: none;
}

.avatar {
  width: 29px;
  height: 29px;
  border-radius: 50%;
  background: #edf1ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  color: #4969d8;
  flex-shrink: 0;
}

.student-name {
  font-size: 13px;
  color: #333;
  flex: 1;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.status-dot.ky {
  background: #35a76f;
}

.status-dot.yk {
  background: #e07843;
}

.status-dot.empty {
  background: #b8bdc7;
}

/* EMPTY */

.empty {
  background: white;
  border: 1px solid #e2e5ea;
  border-radius: 12px;
  padding: 40px;
  text-align: center;
  color: #888;
}

/* FOOTER */

.footer {
  padding: 12px 32px;
  background: #ffffff;
  border-top: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.legend {
  display: flex;
  gap: 18px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #777;
}

.legend-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.slide-counter {
  font-size: 12px;
  color: #999;
}

/* LOADING */

.loading {
  text-align: center;
  padding: 80px 20px;
  color: #777;
}

/* ERROR */

.error {
  background: #fff3f3;
  border: 1px solid #ffd5d5;
  color: #b42318;
  padding: 20px;
  border-radius: 10px;
  line-height: 1.6;
}

/* MOBILE */

@media (max-width: 700px) {

  .header {
    padding: 15px 18px;
  }

  .days-label {
    display: none;
  }

  .timer-bar-wrap,
  .nav-dots {
    display: none;
  }

  .slide {
    padding: 22px 18px;
  }

  .slide-header {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }

  .group-title {
    font-size: 24px;
  }

  .levels-grid {
    grid-template-columns: 1fr;
  }

  .footer {
    padding: 12px 18px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <header class="header">

    <div class="header-left">

      <div class="logo">
        American<span>Life</span>
      </div>

      <div id="group-badge" class="group-badge">
        MW
      </div>

      <div id="days-label" class="days-label">
        Monday & Wednesday
      </div>

    </div>

    <div class="header-right">

      <div id="nav-dots" class="nav-dots"></div>

      <div class="timer-bar-wrap">
        <div id="timer-bar" class="timer-bar"></div>
      </div>

      <button id="btn-pause" class="btn-pause">
        ⏸ Pause
      </button>

    </div>

  </header>


  <main id="slide-content" class="slide">

    <div class="loading">
      Loading students...
    </div>

  </main>


  <footer class="footer">

    <div class="legend">

      <div class="legend-item">
        <div class="legend-dot" style="background:#35a76f"></div>
        Enrolled (KY)
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background:#e07843"></div>
        Not enrolled (YK)
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background:#b8bdc7"></div>
        Status not specified
      </div>

    </div>

    <div id="slide-counter" class="slide-counter">
      1 / 4
    </div>

  </footer>

</div>


<script>

const groups = [

  {
    key: "MW",
    label: "MW",
    days: "Monday & Wednesday",
    color: "#4969d8"
  },

  {
    key: "TT",
    label: "TT",
    days: "Tuesday & Thursday",
    color: "#e07843"
  },

  {
    key: "SA",
    label: "SA",
    days: "Saturday",
    color: "#35a76f"
  },

  {
    key: "SU",
    label: "SU",
    days: "Sunday",
    color: "#9a62d6"
  }

];


let data = [];

let currentSlide = 0;

let paused = false;

let elapsed = 0;

let lastTick = null;

const SLIDE_DURATION = 15000;


/* INITIALS */

function getInitials(name) {

  if (!name) return "?";

  const parts = name.trim().split(/\s+/);

  if (parts.length === 1) {
    return parts[0].substring(0, 2).toUpperCase();
  }

  return (
    parts[0][0] +
    parts[1][0]
  ).toUpperCase();
}


/* NORMALIZE */

function normalize(value) {

  return String(value || "")
    .trim()
    .toUpperCase();

}


/* GET GROUP STUDENTS */

function getStudentsForGroup(groupKey) {

  return data.filter(student => {

    const time = normalize(student.time);

    if (groupKey === "MW") {
      return time.includes("MW");
    }

    if (groupKey === "TT") {
      return time.includes("TT");
    }

    if (groupKey === "SA") {
      return time === "SA" || time === "SA-SU";
    }

    if (groupKey === "SU") {
      return time === "SU" || time === "SA-SU";
    }

    return false;

  });

}


/* LEVEL SORT */

function levelRank(level) {

  const order = [

    "A1.1",
    "A1.2",
    "A1.3",
    "A2.1",
    "A2.2",
    "A2.3",
    "A2.3 MINI",
    "B1.1",
    "B1.2",
    "B1.3",
    "B2.1",
    "B2.2",
    "BELİRSİZ"

  ];

  const index = order.indexOf(normalize(level));

  return index === -1 ? 999 : index;

}


/* GROUP BY LEVEL */

function groupByLevel(students) {

  const map = {};

  students.forEach(student => {

    const level =
      student.level ||
      "BELİRSİZ";

    if (!map[level]) {
      map[level] = [];
    }

    map[level].push(student);

  });


  return Object.entries(map)
    .sort((a, b) => {

      return levelRank(a[0]) - levelRank(b[0]);

    });

}


/* RENDER */

function renderSlide(groupIndex) {

  const group = groups[groupIndex];

  const students =
    getStudentsForGroup(group.key);

  const byLevel =
    groupByLevel(students);


  document.getElementById(
    "group-badge"
  ).textContent = group.label;


  document.getElementById(
    "group-badge"
  ).style.background = group.color;


  document.getElementById(
    "days-label"
  ).textContent = group.days;


  const content =
    document.getElementById("slide-content");


  if (students.length === 0) {

    content.innerHTML = `

      <div class="slide-header">

        <div class="group-title">
          ${group.days}
        </div>

        <div class="group-meta">

          <div class="meta-chip">
            <span class="label">Students</span>
            <span class="value">0</span>
          </div>

          <div class="teacher-chip">
            Teacher: TBD
          </div>

        </div>

      </div>

      <div class="empty">
        No students in this group.
      </div>

    `;

  } else {

    content.innerHTML = `

      <div class="slide-header">

        <div class="group-title">
          ${group.days}
        </div>

        <div class="group-meta">

          <div class="meta-chip">
            <span class="label">Students</span>
            <span class="value">
              ${students.length}
            </span>
          </div>

          <div class="teacher-chip">
            Teacher: TBD
          </div>

        </div>

      </div>


      <div class="levels-grid">

        ${byLevel.map(([level, students]) => `

          <div class="level-card">

            <div class="level-card-header">

              <span class="level-name">
                ${level}
              </span>

              <span class="level-count">
                ${students.length}
              </span>

            </div>


            <div class="student-list">

              ${students.map(student => {

                const status =
                  normalize(student.status);

                let statusClass = "empty";

                if (status === "KY") {
                  statusClass = "ky";
                }

                if (status === "YK") {
                  statusClass = "yk";
                }

                return `

                  <div class="student-row">

                    <div class="avatar">
                      ${getInitials(student.name)}
                    </div>

                    <div class="student-name">
                      ${student.name}
                    </div>

                    <div
                      class="status-dot ${statusClass}"
                      title="${status || "Status not specified"}"
                    ></div>

                  </div>

                `;

              }).join("")}

            </div>

          </div>

        `).join("")}

      </div>

    `;

  }


  document.getElementById(
    "slide-counter"
  ).textContent =
    `${groupIndex + 1} / ${groups.length}`;


  document
    .querySelectorAll(".dot")
    .forEach((dot, index) => {

      dot.classList.toggle(
        "active",
        index === groupIndex
      );

    });

}


/* DOTS */

function buildDots() {

  const container =
    document.getElementById("nav-dots");

  container.innerHTML = "";

  groups.forEach((group, index) => {

    const dot =
      document.createElement("div");

    dot.className =
      "dot" +
      (index === 0 ? " active" : "");

    dot.title = group.days;

    dot.addEventListener(
      "click",
      () => {

        currentSlide = index;

        resetTimer();

        renderSlide(currentSlide);

      }
    );

    container.appendChild(dot);

  });

}


/* LOAD DATA */

async function loadStudents() {

  try {

    const response =
      await fetch(
        "/api/students?ts=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "API returned " +
        response.status
      );

    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "Unable to load students"
      );

    }


    data =
      Array.isArray(result.students)
        ? result.students
        : [];


    renderSlide(currentSlide);


  } catch (error) {

    console.error(error);


    document.getElementById(
      "slide-content"
    ).innerHTML = `

      <div class="error">

        <strong>
          Could not load Google Sheet.
        </strong>

        <br><br>

        ${error.message}

      </div>

    `;

  }

}


/* TIMER */

function resetTimer() {

  elapsed = 0;

  lastTick =
    performance.now();

  document.getElementById(
    "timer-bar"
  ).style.width = "100%";

}


function tick(now) {

  if (!paused) {

    if (lastTick !== null) {

      elapsed +=
        now - lastTick;

    }

    lastTick = now;


    const percentage =
      Math.max(
        0,
        100 -
        (elapsed /
          SLIDE_DURATION) *
        100
      );


    document.getElementById(
      "timer-bar"
    ).style.width =
      percentage + "%";


    if (
      elapsed >=
      SLIDE_DURATION
    ) {

      currentSlide =
        (currentSlide + 1) %
        groups.length;

      renderSlide(
        currentSlide
      );

      resetTimer();

    }

  } else {

    lastTick = now;

  }


  requestAnimationFrame(tick);

}


/* PAUSE */

document
  .getElementById("btn-pause")
  .addEventListener(
    "click",
    () => {

      paused = !paused;

      document.getElementById(
        "btn-pause"
      ).textContent =
        paused
          ? "▶ Resume"
          : "⏸ Pause";

    }
  );


/* START */

buildDots();

loadStudents();

resetTimer();

requestAnimationFrame(tick);


/*
   Refresh Google Sheet data
   every 60 seconds.
*/

setInterval(
  loadStudents,
  60000
);

</script>

</body>
</html>
