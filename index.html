<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AmericanLife — Student Groups</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #f5f6f8;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  color: #171717;
}

.screen {
  min-height: 100vh;
  background: #f5f6f8;
  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.logo {
  font-size: 21px;
  font-weight: 700;
  color: #171717;
  letter-spacing: 0.01em;
  white-space: nowrap;
}

.logo span {
  color: #6c8ef5;
}

.group-badge {
  color: #ffffff;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
  white-space: nowrap;
  transition: background 0.2s;
}

.days-label {
  font-size: 13px;
  color: #6b7280;
  white-space: nowrap;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.nav-dots {
  display: flex;
  gap: 7px;
  align-items: center;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d1d5db;
  cursor: pointer;
  transition: all 0.2s;
}

.dot:hover {
  transform: scale(1.25);
}

.dot.active {
  background: #6c8ef5;
  transform: scale(1.15);
}

.timer-bar-wrap {
  width: 120px;
  height: 4px;
  background: #e5e7eb;
  border-radius: 4px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  background: #6c8ef5;
  border-radius: 4px;
  transition: width 0.1s linear;
}

.btn {
  border: 1px solid #d9dce1;
  background: #ffffff;
  color: #555b65;
  font-size: 12px;
  padding: 7px 12px;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.2s;
}

.btn:hover {
  background: #f3f4f6;
  color: #111827;
}

.btn-refresh {
  font-size: 12px;
}

/* =========================
   MAIN
========================= */

.slide {
  flex: 1;
  padding: 28px 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.slide-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
}

.slide-title-area {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.group-title {
  font-size: 31px;
  font-weight: 700;
  color: #171717;
  letter-spacing: -0.02em;
}

.group-subtitle {
  font-size: 13px;
  color: #777e89;
}

.group-meta {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.meta-chip {
  background: #ffffff;
  border: 1px solid #e1e4e8;
  color: #6b7280;
  font-size: 12px;
  padding: 7px 12px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 7px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}

.meta-chip .label {
  color: #9ca3af;
}

.meta-chip .value {
  color: #222;
  font-weight: 600;
}

.teacher-chip {
  background: #eef2ff;
  border: 1px solid #dce3ff;
  color: #526ed5;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 13px;
  border-radius: 20px;
}

/* =========================
   LEVEL GRID
========================= */

.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
  align-items: start;
}

.level-card {
  background: #ffffff;
  border: 1px solid #e1e4e8;
  border-radius: 12px;
  overflow: hidden;
  box-shadow:
    0 2px 5px rgba(0,0,0,0.035),
    0 1px 1px rgba(0,0,0,0.025);
}

.level-card-header {
  padding: 11px 16px;
  border-bottom: 1px solid #edf0f2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.level-header-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.level-name {
  font-size: 13px;
  font-weight: 700;
  color: #526ed5;
  letter-spacing: 0.03em;
}

.level-count {
  background: #eef2ff;
  color: #526ed5;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 10px;
}

.level-teacher {
  font-size: 11px;
  color: #737983;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 120px;
}

.student-list {
  padding: 6px 0;
}

.student-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  border-bottom: 1px solid #f0f1f3;
}

.student-row:last-child {
  border-bottom: none;
}

.avatar {
  width: 29px;
  height: 29px;
  border-radius: 50%;
  background: #eef2ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: #526ed5;
  flex-shrink: 0;
}

.student-info {
  flex: 1;
  min-width: 0;
}

.student-name {
  font-size: 13px;
  color: #33373d;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.student-status {
  font-size: 9px;
  margin-top: 2px;
  color: #9ca3af;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.status-dot.ky {
  background: #4caf82;
}

.status-dot.yk {
  background: #e87040;
}

.status-dot.empty {
  background: #aeb4bc;
}

/* =========================
   EMPTY / ERROR
========================= */

.message-box {
  background: #ffffff;
  border: 1px solid #e1e4e8;
  border-radius: 12px;
  padding: 30px;
  color: #6b7280;
  font-size: 14px;
  text-align: center;
}

.error-box {
  background: #fff7f5;
  border: 1px solid #ffd9d2;
  color: #b84b36;
  border-radius: 12px;
  padding: 18px 20px;
  font-size: 13px;
  line-height: 1.6;
}

.loading {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 180px;
  color: #888f99;
  font-size: 13px;
}

/* =========================
   FOOTER
========================= */

.footer {
  padding: 12px 32px;
  background: #ffffff;
  border-top: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.footer-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.legend {
  display: flex;
  gap: 16px;
  align-items: center;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #737983;
}

.legend-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.last-updated {
  font-size: 10px;
  color: #a0a5ad;
}

.slide-counter {
  font-size: 12px;
  color: #9ca3af;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

  .header {
    padding: 15px 18px;
  }

  .header-right {
    gap: 8px;
  }

  .days-label {
    display: none;
  }

  .timer-bar-wrap {
    width: 70px;
  }

  .slide {
    padding: 20px 18px;
  }

  .slide-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .group-meta {
    justify-content: flex-start;
  }

  .levels-grid {
    grid-template-columns: 1fr;
  }

  .footer {
    padding: 12px 18px;
  }

  .footer-left {
    flex-direction: column;
    align-items: flex-start;
    gap: 7px;
  }
}

@media (max-width: 520px) {

  .logo {
    font-size: 18px;
  }

  .group-badge {
    padding: 5px 10px;
  }

  .btn-refresh {
    display: none;
  }

  .group-title {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <!-- HEADER -->
  <div class="header">

    <div class="header-left">

      <div class="logo">
        American<span>Life</span>
      </div>

      <div id="group-badge" class="group-badge">
        MW
      </div>

      <div id="days-label" class="days-label">
        Monday & Wednesday
      </div>

    </div>

    <div class="header-right">

      <div
        class="nav-dots"
        id="nav-dots">
      </div>

      <div class="timer-bar-wrap">
        <div
          class="timer-bar"
          id="timer-bar"
          style="width:100%">
        </div>
      </div>

      <button
        class="btn"
        id="btn-refresh">
        ↻ Refresh
      </button>

      <button
        class="btn"
        id="btn-pause">
        ⏸ Pause
      </button>

    </div>

  </div>


  <!-- MAIN -->
  <div
    class="slide"
    id="slide-content">

    <div class="loading">
      Loading Google Sheet...
    </div>

  </div>


  <!-- FOOTER -->
  <div class="footer">

    <div class="footer-left">

      <div class="legend">

        <div class="legend-item">
          <div
            class="legend-dot"
            style="background:#4caf82">
          </div>
          Enrolled (KY)
        </div>

        <div class="legend-item">
          <div
            class="legend-dot"
            style="background:#e87040">
          </div>
          Not enrolled (YK)
        </div>

        <div class="legend-item">
          <div
            class="legend-dot"
            style="background:#aeb4bc">
          </div>
          Status not specified
        </div>

      </div>

      <div
        class="last-updated"
        id="last-updated">
      </div>

    </div>

    <div
      class="slide-counter"
      id="slide-counter">
      1 / 4
    </div>

  </div>

</div>


<script>

/* =========================================================
   GOOGLE SHEET CONFIGURATION
========================================================= */

const SPREADSHEET_ID =
  "1EP-k7eBQ9w7BUhJ-mdng70EtTPXhDHNMib5lbSXyJBw";

/*
   Your student sheet:
   gid = 610591116

   Teachers sheet:
   tab name = Teachers
*/

const STUDENT_GID = "610591116";

const TEACHER_SHEET_NAME = "Teachers";


/* =========================================================
   GOOGLE GVIZ URLS
========================================================= */

const STUDENT_URL =
  `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&gid=${STUDENT_GID}`;

const TEACHER_URL =
  `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(TEACHER_SHEET_NAME)}`;


/* =========================================================
   GROUPS
========================================================= */

const groups = [

  {
    key: "MW",
    label: "MW",
    days: "Monday & Wednesday",
    color: "#6c8ef5"
  },

  {
    key: "TT",
    label: "TT",
    days: "Tuesday & Thursday",
    color: "#e87040"
  },

  {
    key: "SA",
    label: "SA",
    days: "Saturday",
    color: "#4caf82"
  },

  {
    key: "SU",
    label: "SU",
    days: "Sunday",
    color: "#b06cf5"
  }

];


/* =========================================================
   LEVEL ORDER
========================================================= */

const levelOrder = [

  "A1.1",
  "A1.2",
  "A1.3",

  "A2.1",
  "A2.2",
  "A2.3",
  "A2.3 mini",

  "B1.1",
  "B1.2",
  "B1.3",

  "B2.1",
  "B2.2",
  "B2.3",

  "BELİRSİZ"

];


/* =========================================================
   DATA
========================================================= */

let students = [];

let teachers = {};

let currentSlide = 0;

let paused = false;

let elapsed = 0;

let lastTick = null;

let raf = null;

const SLIDE_DURATION = 15000;

const AUTO_REFRESH = 60000;


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .trim()
    .replace(/\s+/g, " ");

}


/* =========================================================
   NORMALIZE LEVEL
========================================================= */

function normalizeLevel(value) {

  let level = normalizeText(value);

  if (!level) {
    return "BELİRSİZ";
  }

  const lower = level.toLowerCase();

  if (
    lower === "?" ||
    lower === "belirsiz" ||
    lower === "unknown"
  ) {
    return "BELİRSİZ";
  }

  /*
    Normalize variations such as:
    A2.3 mini
    A2.3 Mini
    a2.3 mini
  */

  if (lower === "a2.3 mini") {
    return "A2.3 mini";
  }

  return level.toUpperCase();

}


/* =========================================================
   GET INITIALS
========================================================= */

function getInitials(name) {

  const parts =
    normalizeText(name)
      .split(" ")
      .filter(Boolean);

  if (!parts.length) {
    return "?";
  }

  if (parts.length === 1) {
    return parts[0]
      .substring(0, 2)
      .toUpperCase();
  }

  return (
    parts[0][0] +
    parts[1][0]
  ).toUpperCase();

}


/* =========================================================
   GROUP MATCHING
========================================================= */

function getStudentsForGroup(groupKey) {

  return students.filter(student => {

    const time =
      normalizeText(student.time)
        .toUpperCase();

    if (!time) {
      return false;
    }

    /*
      MW-TT students appear in both groups.
    */

    if (groupKey === "MW") {
      return time === "MW" ||
             time === "MW-TT" ||
             time.includes("MW");
    }

    if (groupKey === "TT") {
      return time === "TT" ||
             time === "MW-TT" ||
             time.includes("TT");
    }

    /*
      SA-SU students appear in both groups.
    */

    if (groupKey === "SA") {
      return time === "SA" ||
             time === "SA-SU" ||
             time.includes("SA");
    }

    if (groupKey === "SU") {
      return time === "SU" ||
             time === "SA-SU" ||
             time.includes("SU");
    }

    return false;

  });

}


/* =========================================================
   GROUP BY LEVEL
========================================================= */

function groupByLevel(list) {

  const map = {};

  list.forEach(student => {

    const level =
      normalizeLevel(student.level);

    if (!map[level]) {
      map[level] = [];
    }

    map[level].push(student);

  });

  return Object.entries(map)
    .sort(([a], [b]) => {

      const ai =
        levelOrder.indexOf(a);

      const bi =
        levelOrder.indexOf(b);

      const av =
        ai === -1 ? 999 : ai;

      const bv =
        bi === -1 ? 999 : bi;

      return av - bv;

    });

}


/* =========================================================
   TEACHER KEY
========================================================= */

function teacherKey(group, level) {

  return (
    normalizeText(group).toUpperCase() +
    "|" +
    normalizeLevel(level).toUpperCase()
  );

}


/* =========================================================
   GET TEACHER
========================================================= */

function getTeacher(group, level) {

  const key =
    teacherKey(group, level);

  return teachers[key] || "";

}


/* =========================================================
   GET GROUP TEACHERS
========================================================= */

function getGroupTeachers(groupKey, groupedLevels) {

  const names = [];

  groupedLevels.forEach(([level]) => {

    const teacher =
      getTeacher(groupKey, level);

    if (
      teacher &&
      !names.includes(teacher)
    ) {
      names.push(teacher);
    }

  });

  return names;

}


/* =========================================================
   PARSE GOOGLE GVIZ
========================================================= */

function parseGViz(text) {

  /*
    Google returns:

    google.visualization.Query.setResponse({...});
  */

  const start =
    text.indexOf("{");

  const end =
    text.lastIndexOf("}");

  if (
    start === -1 ||
    end === -1
  ) {
    throw new Error(
      "Invalid Google Sheet response."
    );
  }

  const json =
    JSON.parse(
      text.substring(
        start,
        end + 1
      )
    );

  if (
    json.status === "error"
  ) {
    throw new Error(
      json.errors?.[0]?.detailed_message ||
      json.errors?.[0]?.message ||
      "Google Sheet API error."
    );
  }

  return json;

}


/* =========================================================
   GVIZ TABLE → ARRAY
========================================================= */

function tableToObjects(json) {

  const table =
    json.table;

  if (!table) {
    return [];
  }

  const columns =
    table.cols.map(
      col =>
        normalizeText(
          col.label ||
          col.id
        )
    );

  return table.rows.map(row => {

    const obj = {};

    columns.forEach(
      (column, index) => {

        const cell =
          row.c?.[index];

        obj[column] =
          cell?.f ??
          cell?.v ??
          "";

      }
    );

    return obj;

  });

}


/* =========================================================
   FETCH STUDENTS
========================================================= */

async function loadStudents() {

  const response =
    await fetch(
      STUDENT_URL,
      {
        cache: "no-store"
      }
    );

  if (!response.ok) {

    throw new Error(
      `Student sheet returned HTTP ${response.status}`
    );

  }

  const text =
    await response.text();

  const json =
    parseGViz(text);

  const rows =
    tableToObjects(json);

  return rows.map(row => {

    /*
      We intentionally support
      both English and Turkish headers.
    */

    const name =
      row["İSİM SOYİSİM"] ||
      row["ISIM SOYISIM"] ||
      row["NAME"] ||
      row["Name"] ||
      "";

    const level =
      row["NORM_SEVIYE"] ||
      row["NORM SEVIYE"] ||
      row["YENI DONEM SEVIYE"] ||
      row["YENİ DÖNEM SEVİYE"] ||
      row["LEVEL"] ||
      "";

    const time =
      row["ZAMAN"] ||
      row["TIME"] ||
      "";

    const status =
      row["Kayıt Durumu (KY/YK)"] ||
      row["KAYIT DURUMU (KY/YK)"] ||
      row["KAYIT DURUMU"] ||
      row["STATUS"] ||
      "";

    return {

      name:
        normalizeText(name),

      level:
        normalizeLevel(level),

      time:
        normalizeText(time),

      status:
        normalizeText(status)
          .toUpperCase()

    };

  }).filter(student => {

    return student.name;

  });

}


/* =========================================================
   FETCH TEACHERS
========================================================= */

async function loadTeachers() {

  const response =
    await fetch(
      TEACHER_URL,
      {
        cache: "no-store"
      }
    );

  if (!response.ok) {

    throw new Error(
      `Teachers sheet returned HTTP ${response.status}`
    );

  }

  const text =
    await response.text();

  const json =
    parseGViz(text);

  const rows =
    tableToObjects(json);

  const result = {};

  rows.forEach(row => {

    /*
      Expected columns:

      GROUP | LEVEL | TEACHER

      Example:

      MW | A1.2 | TEST
    */

    const group =
      row["GROUP"] ||
      row["Group"] ||
      row["group"] ||
      "";

    const level =
      row["LEVEL"] ||
      row["Level"] ||
      row["level"] ||
      "";

    const teacher =
      row["TEACHER"] ||
      row["Teacher"] ||
      row["teacher"] ||
      "";

    if (
      !normalizeText(group) ||
      !normalizeText(level)
    ) {
      return;
    }

    const key =
      teacherKey(
        group,
        level
      );

    result[key] =
      normalizeText(teacher);

  });

  return result;

}


/* =========================================================
   LOAD ALL DATA
========================================================= */

async function loadData() {

  showLoading();

  try {

    const [
      loadedStudents,
      loadedTeachers
    ] =
      await Promise.all([
        loadStudents(),
        loadTeachers()
      ]);

    students =
      loadedStudents;

    teachers =
      loadedTeachers;

    updateLastUpdated();

    renderSlide(
      currentSlide
    );

  } catch (error) {

    console.error(
      "Google Sheet error:",
      error
    );

    showError(
      error
    );

  }

}


/* =========================================================
   LOADING SCREEN
========================================================= */

function showLoading() {

  const content =
    document.getElementById(
      "slide-content"
    );

  content.innerHTML = `
    <div class="loading">
      Loading Google Sheet...
    </div>
  `;

}


/* =========================================================
   ERROR SCREEN
========================================================= */

function showError(error) {

  const content =
    document.getElementById(
      "slide-content"
    );

  content.innerHTML = `

    <div class="error-box">

      <strong>
        Could not load Google Sheet.
      </strong>

      <br><br>

      ${escapeHtml(
        error?.message ||
        "Unknown error"
      )}

      <br><br>

      Make sure the Google Sheet is accessible
      to anyone with the link and that the
      <strong>Teachers</strong> tab exists.

    </div>

  `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(status) {

  if (status === "KY") {
    return "ky";
  }

  if (status === "YK") {
    return "yk";
  }

  return "empty";

}


/* =========================================================
   STATUS LABEL
========================================================= */

function getStatusLabel(status) {

  if (status === "KY") {
    return "Enrolled";
  }

  if (status === "YK") {
    return "Not enrolled";
  }

  return "Status not specified";

}


/* =========================================================
   RENDER SLIDE
========================================================= */

function renderSlide(groupIdx) {

  const group =
    groups[groupIdx];

  if (!group) {
    return;
  }

  const groupStudents =
    getStudentsForGroup(
      group.key
    );

  const byLevel =
    groupByLevel(
      groupStudents
    );

  const groupTeachers =
    getGroupTeachers(
      group.key,
      byLevel
    );

  /* Header */

  const badge =
    document.getElementById(
      "group-badge"
    );

  badge.textContent =
    group.label;

  badge.style.background =
    group.color;

  const daysLabel =
    document.getElementById(
      "days-label"
    );

  daysLabel.textContent =
    group.days;


  /* Main content */

  const content =
    document.getElementById(
      "slide-content"
    );

  const teacherText =
    groupTeachers.length
      ? groupTeachers.join(" · ")
      : "TBD";


  if (!groupStudents.length) {

    content.innerHTML = `

      <div class="slide-header">

        <div class="slide-title-area">

          <div class="group-title">
            ${escapeHtml(group.days)}
          </div>

          <div class="group-subtitle">
            No students currently assigned to this group.
          </div>

        </div>

        <div class="group-meta">

          <div class="meta-chip">

            <span class="label">
              Students
            </span>

            <span class="value">
              0
            </span>

          </div>

          <div class="teacher-chip">
            Teachers: ${escapeHtml(teacherText)}
          </div>

        </div>

      </div>

      <div class="message-box">
        No students in this group.
      </div>

    `;

  } else {

    content.innerHTML = `

      <div class="slide-header">

        <div class="slide-title-area">

          <div class="group-title">
            ${escapeHtml(group.days)}
          </div>

          <div class="group-subtitle">
            ${groupTeachers.length
              ? "Teachers: " +
                escapeHtml(
                  groupTeachers.join(" · ")
                )
              : "Teacher assignment pending"}
          </div>

        </div>

        <div class="group-meta">

          <div class="meta-chip">

            <span class="label">
              Students
            </span>

            <span class="value">
              ${groupStudents.length}
            </span>

          </div>

          <div class="teacher-chip">
            Teachers: ${escapeHtml(teacherText)}
          </div>

        </div>

      </div>


      <div class="levels-grid">

        ${byLevel.map(
          ([level, levelStudents]) => {

            const teacher =
              getTeacher(
                group.key,
                level
              );

            return `

              <div class="level-card">

                <div class="level-card-header">

                  <div class="level-header-left">

                    <span class="level-name">
                      ${escapeHtml(level)}
                    </span>

                    <span class="level-count">
                      ${levelStudents.length}
                    </span>

                  </div>

                  <div
                    class="level-teacher"
                    title="${escapeHtml(
                      teacher || "TBD"
                    )}"
                  >
                    ${escapeHtml(
                      teacher || "TBD"
                    )}
                  </div>

                </div>


                <div class="student-list">

                  ${levelStudents.map(
                    student => {

                      const statusClass =
                        getStatusClass(
                          student.status
                        );

                      const statusLabel =
                        getStatusLabel(
                          student.status
                        );

                      return `

                        <div class="student-row">

                          <div class="avatar">
                            ${escapeHtml(
                              getInitials(
                                student.name
                              )
                            )}
                          </div>

                          <div class="student-info">

                            <div class="student-name">
                              ${escapeHtml(
                                student.name
                              )}
                            </div>

                            <div class="student-status">
                              ${escapeHtml(
                                statusLabel
                              )}
                            </div>

                          </div>

                          <div
                            class="status-dot ${statusClass}"
                            title="${escapeHtml(
                              statusLabel
                            )}"
                          >
                          </div>

                        </div>

                      `;

                    }
                  ).join("")}

                </div>

              </div>

            `;

          }
        ).join("")}

      </div>

    `;

  }


  /* Counter */

  document.getElementById(
    "slide-counter"
  ).textContent =
    `${groupIdx + 1} / ${groups.length}`;


  /* Navigation dots */

  const dots =
    document.querySelectorAll(
      ".dot"
    );

  dots.forEach(
    (dot, index) => {

      dot.classList.toggle(
        "active",
        index === groupIdx
      );

    }
  );

}


/* =========================================================
   NAVIGATION DOTS
========================================================= */

function buildDots() {

  const wrap =
    document.getElementById(
      "nav-dots"
    );

  wrap.innerHTML = "";

  groups.forEach(
    (group, index) => {

      const dot =
        document.createElement(
          "div"
        );

      dot.className =
        "dot" +
        (
          index === 0
            ? " active"
            : ""
        );

      dot.title =
        group.days;

      dot.addEventListener(
        "click",
        () => {

          currentSlide =
            index;

          resetTimer();

          renderSlide(
            currentSlide
          );

        }
      );

      wrap.appendChild(
        dot
      );

    }
  );

}


/* =========================================================
   TIMER
========================================================= */

function resetTimer() {

  elapsed = 0;

  lastTick =
    performance.now();

  document.getElementById(
    "timer-bar"
  ).style.width = "100%";

}


/* =========================================================
   TIMER LOOP
========================================================= */

function tick(now) {

  if (!paused) {

    if (lastTick !== null) {

      elapsed +=
        now - lastTick;

    }

    lastTick = now;

    const percentage =
      Math.max(
        0,
        100 -
        (
          elapsed /
          SLIDE_DURATION
        ) * 100
      );

    document.getElementById(
      "timer-bar"
    ).style.width =
      percentage + "%";


    if (
      elapsed >=
      SLIDE_DURATION
    ) {

      currentSlide =
        (
          currentSlide + 1
        ) % groups.length;

      renderSlide(
        currentSlide
      );

      elapsed = 0;

    }

  } else {

    lastTick = now;

  }

  raf =
    requestAnimationFrame(
      tick
    );

}


/* =========================================================
   PAUSE BUTTON
========================================================= */

document
  .getElementById(
    "btn-pause"
  )
  .addEventListener(
    "click",
    () => {

      paused =
        !paused;

      document.getElementById(
        "btn-pause"
      ).textContent =
        paused
          ? "▶ Resume"
          : "⏸ Pause";

    }
  );


/* =========================================================
   REFRESH BUTTON
========================================================= */

document
  .getElementById(
    "btn-refresh"
  )
  .addEventListener(
    "click",
    async () => {

      await loadData();

      resetTimer();

    }
  );


/* =========================================================
   LAST UPDATED
========================================================= */

function updateLastUpdated() {

  const element =
    document.getElementById(
      "last-updated"
    );

  const now =
    new Date();

  element.textContent =
    "Updated " +
    now.toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );

}


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
  async () => {

    /*
      Reload Google Sheet data
      without changing the current group.
    */

    await loadData();

  },
  AUTO_REFRESH
);


/* =========================================================
   INITIALIZE
========================================================= */

buildDots();

loadData();

resetTimer();

raf =
  requestAnimationFrame(
    tick
  );

</script>

</body>
</html>
