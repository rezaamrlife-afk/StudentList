<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmericanLife Student Groups</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #f5f6f8;
  font-family: Arial, Helvetica, sans-serif;
  color: #222;
}

.screen {
  background: #f5f6f8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  background: #ffffff;
  border-bottom: 1px solid #e4e6eb;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  font-size: 20px;
  font-weight: 600;
  color: #222;
  letter-spacing: .02em;
}

.logo span {
  color: #6c8ef5;
}

.group-badge {
  background: #6c8ef5;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
}

.days-label {
  font-size: 13px;
  color: #777;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 24px;
}

.nav-dots {
  display: flex;
  gap: 8px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d5d8df;
  cursor: pointer;
}

.dot.active {
  background: #6c8ef5;
}

.timer-bar-wrap {
  width: 120px;
  height: 3px;
  background: #e3e5e9;
  border-radius: 2px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  background: #6c8ef5;
  transition: width .1s linear;
}

.btn-pause {
  background: #fff;
  border: 1px solid #dcdfe5;
  color: #555;
  font-size: 12px;
  padding: 7px 14px;
  border-radius: 6px;
  cursor: pointer;
}

.btn-pause:hover {
  background: #f1f2f4;
}

/* CONTENT */

.slide {
  flex: 1;
  padding: 28px 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.slide-header {
  display: flex;
  align-items: flex-end;
  gap: 20px;
}

.group-title {
  font-size: 32px;
  font-weight: 600;
  color: #222;
}

.group-meta {
  display: flex;
  gap: 12px;
  align-items: center;
  padding-bottom: 4px;
}

.meta-chip {
  background: #fff;
  border: 1px solid #e0e2e6;
  color: #777;
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 20px;
}

.meta-chip .label {
  color: #999;
  margin-right: 5px;
}

.meta-chip .value {
  color: #222;
  font-weight: 600;
}

.teacher-chip {
  background: #eef2ff;
  border: 1px solid #dce3ff;
  color: #5875d6;
  font-size: 12px;
  padding: 5px 14px;
  border-radius: 20px;
}

/* LEVEL GRID */

.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}

.level-card {
  background: #fff;
  border: 1px solid #e2e4e8;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.03);
}

.level-card-header {
  padding: 11px 16px;
  border-bottom: 1px solid #eceef1;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.level-name {
  font-size: 13px;
  font-weight: 600;
  color: #5875d6;
  letter-spacing: .04em;
}

.level-count {
  background: #eef2ff;
  color: #5875d6;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
}

.student-list {
  padding: 7px 0;
}

.student-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  border-bottom: 1px solid #f0f1f3;
}

.student-row:last-child {
  border-bottom: none;
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #eef2ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  color: #5875d6;
  flex-shrink: 0;
}

.student-name {
  font-size: 13px;
  color: #333;
  flex: 1;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.status-dot.ky {
  background: #4caf82;
}

.status-dot.yk {
  background: #e87040;
}

.status-dot.empty {
  background: #bfc3ca;
}

/* LOADING */

.loading {
  padding: 60px;
  text-align: center;
  color: #888;
  font-size: 14px;
}

.error {
  background: #fff;
  border: 1px solid #f0c8c8;
  color: #c44;
  padding: 30px;
  border-radius: 10px;
  text-align: center;
}

/* FOOTER */

.footer {
  padding: 12px 32px;
  background: #fff;
  border-top: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.legend {
  display: flex;
  gap: 18px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #777;
}

.legend-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.slide-counter {
  font-size: 12px;
  color: #999;
}

/* MOBILE */

@media (max-width: 700px) {

  .header {
    padding: 15px;
  }

  .header-right {
    gap: 10px;
  }

  .timer-bar-wrap {
    display: none;
  }

  .days-label {
    display: none;
  }

  .slide {
    padding: 20px 15px;
  }

  .slide-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .group-title {
    font-size: 25px;
  }

  .levels-grid {
    grid-template-columns: 1fr;
  }

  .footer {
    padding: 10px 15px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <div class="header">

    <div class="header-left">

      <div class="logo">
        American<span>Life</span>
      </div>

      <div id="group-badge" class="group-badge">
        MW
      </div>

      <div id="days-label" class="days-label">
        Monday & Wednesday
      </div>

    </div>

    <div class="header-right">

      <div class="nav-dots" id="nav-dots"></div>

      <div class="timer-bar-wrap">
        <div
          class="timer-bar"
          id="timer-bar"
          style="width:100%">
        </div>
      </div>

      <button
        class="btn-pause"
        id="btn-pause">
        ⏸ Pause
      </button>

    </div>

  </div>


  <div class="slide" id="slide-content">

    <div class="loading">
      Loading students from Google Sheet...
    </div>

  </div>


  <div class="footer">

    <div class="legend">

      <div class="legend-item">
        <div
          class="legend-dot"
          style="background:#4caf82">
        </div>
        Enrolled (KY)
      </div>

      <div class="legend-item">
        <div
          class="legend-dot"
          style="background:#e87040">
        </div>
        Not enrolled (YK)
      </div>

      <div class="legend-item">
        <div
          class="legend-dot"
          style="background:#bfc3ca">
        </div>
        Status not specified
      </div>

    </div>

    <div
      class="slide-counter"
      id="slide-counter">
    </div>

  </div>

</div>


<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const SPREADSHEET_ID =
  "1EP-k7eBQ9w7BUhJ-mdng70EtTPXhDHNMib5lbSXyJBw";

const SHEET_GID =
  "610591116";


/*
   IMPORTANT:

   We DO NOT use the Google Sheets API here.

   We use Google Visualization API (gviz),
   which works with a public Google Sheet.
*/

const SHEET_URL =
  `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`;


/* =========================================================
   GROUPS
========================================================= */

const groups = [

  {
    key: "MW",
    label: "MW",
    days: "Monday & Wednesday",
    color: "#6c8ef5"
  },

  {
    key: "TT",
    label: "TT",
    days: "Tuesday & Thursday",
    color: "#e87040"
  },

  {
    key: "SA",
    label: "SA",
    days: "Saturday",
    color: "#4caf82"
  },

  {
    key: "SU",
    label: "SU",
    days: "Sunday",
    color: "#b06cf5"
  }

];


/* =========================================================
   GLOBAL DATA
========================================================= */

let students = [];

let currentSlide = 0;

let paused = false;

let elapsed = 0;

let lastTick = null;

let raf = null;

const SLIDE_DURATION = 15000;


/* =========================================================
   GOOGLE GVIZ PARSER
========================================================= */

async function loadGoogleSheet() {

  try {

    const response = await fetch(SHEET_URL);

    if (!response.ok) {

      throw new Error(
        `Google Sheet returned HTTP ${response.status}`
      );

    }

    const text = await response.text();

    /*
      Google returns:

      google.visualization.Query.setResponse({...});

      We extract the JSON object.
    */

    const start = text.indexOf("(");

    const end = text.lastIndexOf(")");

    if (start === -1 || end === -1) {

      throw new Error(
        "Invalid Google Sheet response."
      );

    }

    const jsonText =
      text.substring(start + 1, end);

    const json =
      JSON.parse(jsonText);

    if (
      !json.table ||
      !json.table.rows
    ) {

      throw new Error(
        "No table data found in Google Sheet."
      );

    }

    const columns =
      json.table.cols.map(
        col => (col.label || "").trim()
      );


    students =
      json.table.rows.map(row => {

        const obj = {};

        columns.forEach((column, index) => {

          const cell =
            row.c &&
            row.c[index];

          obj[column] =
            cell && cell.v != null
              ? String(cell.v).trim()
              : "";

        });

        return obj;

      });


    console.log(
      "Google Sheet loaded:",
      students
    );


    renderSlide(currentSlide);

  }

  catch (error) {

    console.error(error);

    document.getElementById(
      "slide-content"
    ).innerHTML = `

      <div class="error">

        <strong>Could not load Google Sheet.</strong>

        <br><br>

        ${escapeHtml(error.message)}

        <br><br>

        <small>
          Make sure the Google Sheet is shared as
          <b>Anyone with the link → Viewer</b>.
        </small>

      </div>

    `;

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================================
   FIND COLUMN
========================================================= */

function findColumn(obj, possibleNames) {

  const keys =
    Object.keys(obj);

  for (const wanted of possibleNames) {

    const exact =
      keys.find(
        key =>
          key.trim().toLowerCase() ===
          wanted.trim().toLowerCase()
      );

    if (exact) return exact;

  }

  return null;

}


/* =========================================================
   NORMALIZE STUDENT DATA
========================================================= */

function normalizeStudents() {

  return students.map(s => {

    const nameColumn =
      findColumn(s, [
        "İSİM SOYİSİM",
        "ISIM SOYISIM",
        "İSİM",
        "NAME"
      ]);

    const levelColumn =
      findColumn(s, [
        "NORM_SEVIYE",
        "NORM SEVIYE",
        "YENI DONEM SEVIYE",
        "YENİ DÖNEM SEVİYE"
      ]);

    const timeColumn =
      findColumn(s, [
        "ZAMAN",
        "TIME"
      ]);

    const statusColumn =
      findColumn(s, [
        "Kayıt Durumu (KY/YK)",
        "KAYIT DURUMU (KY/YK)",
        "STATUS",
        "KAYIT DURUMU"
      ]);

    return {

      name:
        nameColumn
          ? s[nameColumn]
          : "",

      level:
        levelColumn
          ? s[levelColumn]
          : "BELİRSİZ",

      time:
        timeColumn
          ? s[timeColumn].toUpperCase()
          : "",

      status:
        statusColumn
          ? s[statusColumn].toUpperCase()
          : ""

    };

  });

}


/* =========================================================
   INITIALS
========================================================= */

function getInitials(name) {

  const parts =
    name
      .trim()
      .split(/\s+/);

  if (!parts.length)
    return "?";

  if (parts.length === 1)
    return parts[0][0].toUpperCase();

  return (
    parts[0][0] +
    parts[1][0]
  ).toUpperCase();

}


/* =========================================================
   GROUP FILTER
========================================================= */

function getStudentsForGroup(groupKey) {

  const normalized =
    normalizeStudents();

  return normalized.filter(student => {

    const t =
      (student.time || "")
      .toUpperCase()
      .trim();


    if (groupKey === "MW") {

      return t.includes("MW");

    }


    if (groupKey === "TT") {

      return t.includes("TT");

    }


    if (groupKey === "SA") {

      return (
        t === "SA" ||
        t === "SA-SU"
      );

    }


    if (groupKey === "SU") {

      return (
        t === "SU" ||
        t === "SA-SU"
      );

    }


    return false;

  });

}


/* =========================================================
   LEVEL ORDER
========================================================= */

function groupByLevel(studentList) {

  const map = {};


  studentList.forEach(student => {

    const level =
      student.level ||
      "BELİRSİZ";

    if (!map[level])
      map[level] = [];

    map[level].push(student);

  });


  const order = [

    "A1.1",
    "A1.2",
    "A1.3",
    "A2.1",
    "A2.2",
    "A2.3",
    "A2.3 MINI",
    "A2.3 mini",
    "B1.1",
    "B1.2",
    "B1.3",
    "B2.1",
    "B2.2",
    "BELİRSİZ"

  ];


  return Object.entries(map)

    .sort(([a], [b]) => {

      const ai =
        order.indexOf(a);

      const bi =
        order.indexOf(b);

      return (
        (ai === -1 ? 99 : ai) -
        (bi === -1 ? 99 : bi)
      );

    });

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(status) {

  if (status === "KY")
    return "ky";

  if (status === "YK")
    return "yk";

  return "empty";

}


/* =========================================================
   RENDER SLIDE
========================================================= */

function renderSlide(groupIdx) {

  if (!students.length)
    return;


  const group =
    groups[groupIdx];

  const groupStudents =
    getStudentsForGroup(group.key);

  const byLevel =
    groupByLevel(groupStudents);


  /* HEADER */

  const badge =
    document.getElementById(
      "group-badge"
    );

  const daysLabel =
    document.getElementById(
      "days-label"
    );


  badge.textContent =
    group.label;

  badge.style.background =
    group.color;

  daysLabel.textContent =
    group.days;


  /* CONTENT */

  const content =
    document.getElementById(
      "slide-content"
    );


  if (!groupStudents.length) {

    content.innerHTML = `

      <div class="slide-header">

        <div class="group-title">
          ${escapeHtml(group.days)}
        </div>

        <div class="group-meta">

          <div class="meta-chip">
            <span class="label">
              Students
            </span>

            <span class="value">
              0
            </span>
          </div>

          <div class="teacher-chip">
            Teacher: TBD
          </div>

        </div>

      </div>

      <div class="loading">
        No students in this group.
      </div>

    `;

  }

  else {

    content.innerHTML = `

      <div class="slide-header">

        <div class="group-title">
          ${escapeHtml(group.days)}
        </div>

        <div class="group-meta">

          <div class="meta-chip">

            <span class="label">
              Students
            </span>

            <span class="value">
              ${groupStudents.length}
            </span>

          </div>

          <div class="teacher-chip">
            Teacher: TBD
          </div>

        </div>

      </div>


      <div class="levels-grid">

        ${byLevel.map(
          ([level, list]) => `

            <div class="level-card">

              <div class="level-card-header">

                <span class="level-name">
                  ${escapeHtml(level)}
                </span>

                <span class="level-count">
                  ${list.length}
                </span>

              </div>


              <div class="student-list">

                ${list.map(
                  student => `

                    <div class="student-row">

                      <div class="avatar">
                        ${escapeHtml(
                          getInitials(
                            student.name
                          )
                        )}
                      </div>

                      <div class="student-name">
                        ${escapeHtml(
                          student.name
                        )}
                      </div>

                      <div
                        class="status-dot ${getStatusClass(
                          student.status
                        )}">
                      </div>

                    </div>

                  `
                ).join("")}

              </div>

            </div>

          `
        ).join("")}

      </div>

    `;

  }


  /* COUNTER */

  document.getElementById(
    "slide-counter"
  ).textContent =
    `${groupIdx + 1} / ${groups.length}`;


  /* DOTS */

  document
    .querySelectorAll(".dot")
    .forEach(
      (dot, index) => {

        dot.classList.toggle(
          "active",
          index === groupIdx
        );

      }
    );

}


/* =========================================================
   NAVIGATION DOTS
========================================================= */

function buildDots() {

  const wrap =
    document.getElementById(
      "nav-dots"
    );


  groups.forEach(
    (group, index) => {

      const dot =
        document.createElement(
          "div"
        );

      dot.className =
        "dot" +
        (index === 0
          ? " active"
          : "");

      dot.title =
        group.days;


      dot.addEventListener(
        "click",
        () => {

          currentSlide =
            index;

          resetTimer();

          renderSlide(
            currentSlide
          );

        }
      );


      wrap.appendChild(dot);

    }
  );

}


/* =========================================================
   TIMER
========================================================= */

function resetTimer() {

  elapsed = 0;

  lastTick =
    performance.now();

}


function tick(now) {

  if (!paused) {

    if (lastTick) {

      elapsed +=
        now - lastTick;

    }

    lastTick = now;


    const pct =
      Math.max(
        0,
        100 -
        (
          elapsed /
          SLIDE_DURATION
        ) * 100
      );


    document.getElementById(
      "timer-bar"
    ).style.width =
      pct + "%";


    if (
      elapsed >=
      SLIDE_DURATION
    ) {

      currentSlide =
        (
          currentSlide + 1
        ) %
        groups.length;

      renderSlide(
        currentSlide
      );

      elapsed = 0;

    }

  }

  else {

    lastTick = now;

  }


  raf =
    requestAnimationFrame(
      tick
    );

}


/* =========================================================
   PAUSE
========================================================= */

document
  .getElementById(
    "btn-pause"
  )
  .addEventListener(
    "click",
    () => {

      paused =
        !paused;

      document.getElementById(
        "btn-pause"
      ).textContent =
        paused
          ? "▶ Resume"
          : "⏸ Pause";

    }
  );


/* =========================================================
   START
========================================================= */

buildDots();

loadGoogleSheet();

resetTimer();

raf =
  requestAnimationFrame(
    tick
  );


/* =========================================================
   AUTO REFRESH GOOGLE SHEET
   Every 60 seconds
========================================================= */

setInterval(
  () => {

    loadGoogleSheet();

  },
  60000
);

</script>

</body>
</html>
