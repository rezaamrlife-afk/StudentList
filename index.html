<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmericanLife — Class Groups</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #f5f6f8;
  font-family: Arial, Helvetica, sans-serif;
  color: #171717;
}

.screen {
  min-height: 100vh;
  background: #f5f6f8;
  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  font-size: 21px;
  font-weight: 600;
  color: #111827;
  letter-spacing: .01em;
}

.logo span {
  color: #4f6df5;
}

.group-badge {
  background: #4f6df5;
  color: white;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
}

.days-label {
  font-size: 13px;
  color: #6b7280;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 18px;
}

.nav-dots {
  display: flex;
  align-items: center;
  gap: 7px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d1d5db;
  cursor: pointer;
  transition: .2s;
}

.dot.active {
  background: #4f6df5;
  transform: scale(1.15);
}

.timer-bar-wrap {
  width: 110px;
  height: 3px;
  background: #e5e7eb;
  border-radius: 3px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  background: #4f6df5;
  width: 100%;
}

.btn {
  border: 1px solid #d9dde5;
  background: #ffffff;
  color: #555;
  font-size: 12px;
  padding: 7px 12px;
  border-radius: 7px;
  cursor: pointer;
}

.btn:hover {
  background: #f3f4f6;
}

.btn-refresh {
  color: #4f6df5;
}

/* =========================
   MAIN
========================= */

.slide {
  flex: 1;
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.slide-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
}

.slide-header-left {
  display: flex;
  align-items: flex-end;
  gap: 18px;
}

.group-title {
  font-size: 30px;
  font-weight: 600;
  color: #111827;
}

.group-meta {
  display: flex;
  align-items: center;
  gap: 9px;
  padding-bottom: 3px;
}

.meta-chip {
  background: #ffffff;
  border: 1px solid #e1e4e9;
  color: #6b7280;
  font-size: 12px;
  padding: 5px 11px;
  border-radius: 18px;
}

.meta-chip strong {
  color: #222;
  margin-left: 4px;
}

.assignment-status {
  font-size: 12px;
  color: #9ca3af;
  padding-bottom: 5px;
}

/* =========================
   LEVEL GRID
========================= */

.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
  gap: 13px;
  align-items: start;
}

.level-card {
  background: #ffffff;
  border: 1px solid #e1e4e9;
  border-radius: 11px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.03);
}

.level-card-header {
  padding: 11px 15px;
  border-bottom: 1px solid #edf0f3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.level-info {
  display: flex;
  align-items: center;
  gap: 9px;
}

.level-name {
  font-size: 13px;
  font-weight: 700;
  color: #4f6df5;
  letter-spacing: .02em;
}

.level-count {
  background: #eef1ff;
  color: #4f6df5;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 12px;
}

.teacher-name {
  font-size: 11px;
  color: #6b7280;
  font-weight: 500;
  text-align: right;
}

/* =========================
   STUDENTS
========================= */

.student-list {
  padding: 5px 0;
}

.student-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 15px;
  border-bottom: 1px solid #f0f1f3;
}

.student-row:last-child {
  border-bottom: none;
}

.avatar {
  width: 29px;
  height: 29px;
  border-radius: 50%;
  background: #eef1ff;
  color: #4f6df5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  flex-shrink: 0;
}

.student-name {
  flex: 1;
  font-size: 12px;
  color: #333;
  font-weight: 500;
}

.student-status {
  font-size: 10px;
  font-weight: 500;
  white-space: nowrap;
}

.student-status.ky {
  color: #29945f;
}

.student-status.yk {
  color: #df6938;
}

.student-status.none {
  color: #9ca3af;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.status-dot.ky {
  background: #43a66f;
}

.status-dot.yk {
  background: #e87945;
}

.status-dot.none {
  background: #b8bdc7;
}

/* =========================
   EMPTY / ERROR
========================= */

.message {
  background: #ffffff;
  border: 1px solid #e2e5e9;
  border-radius: 11px;
  padding: 28px;
  text-align: center;
  color: #777;
  font-size: 13px;
}

.error {
  color: #c0392b;
}

/* =========================
   FOOTER
========================= */

.footer {
  padding: 12px 32px;
  background: #ffffff;
  border-top: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.legend {
  display: flex;
  align-items: center;
  gap: 18px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #777;
  font-size: 11px;
}

.legend-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.slide-counter {
  font-size: 11px;
  color: #9ca3af;
}

.updated {
  font-size: 10px;
  color: #9ca3af;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  .header {
    padding: 14px 16px;
  }

  .header-right {
    gap: 8px;
  }

  .timer-bar-wrap,
  .nav-dots {
    display: none;
  }

  .slide {
    padding: 20px 16px;
  }

  .slide-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .slide-header-left {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .group-title {
    font-size: 24px;
  }

  .levels-grid {
    grid-template-columns: 1fr;
  }

  .footer {
    padding: 11px 16px;
  }

  .days-label {
    display: none;
  }
}
</style>
</head>

<body>

<div class="screen">

  <!-- HEADER -->
  <div class="header">

    <div class="header-left">
      <div class="logo">
        American<span>Life</span>
      </div>

      <div id="group-badge" class="group-badge">
        MW
      </div>

      <div id="days-label" class="days-label">

      </div>

      <div class="legend-item">

        <div

        Loading...
      </div>

      <div id="slide-counter" class="slide-counter">
        1 / 4
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   GOOGLE SHEET SETTINGS
========================================================= */

const SPREADSHEET_ID =
  "1EP-k7eBQ9w7BUhJ-mdng70EtTPXhDHNMib5lbSXyJBw";

/*
  IMPORTANT:

  Change these gid values if your tabs have different GIDs.

  Main student sheet:
  gid=610591116

  Teachers sheet:
  Replace TEACHERS_GID below with the real gid
  of your Teachers tab.
*/

const STUDENTS_GID = "610591116";

/*
  IMPORTANT:
  Put the actual gid of the Teachers tab here.

  Example:
  https://docs.google.com/spreadsheets/d/XXXX/edit#gid=123456789

  Then:
  const TEACHERS_GID = "123456789";
*/

const TEACHERS_GID = "PASTE_TEACHERS_GID_HERE";


/* =========================================================
   GROUPS
========================================================= */

const groups = [

  {
    key: "MW",
    label: "MW",
    days: "Monday & Wednesday",
    color: "#4f6df5"
  },

  {
    key: "TT",
    label: "TT",
    days: "Tuesday & Thursday",
    color: "#e87945"
  },

  {
    key: "SA",
    label: "SA",
    days: "Saturday",
    color: "#43a66f"
  },

  {
    key: "SU",
    label: "SU",
    days: "Sunday",
    color: "#9b62df"
  }

];


/* =========================================================
   LEVEL ORDER
========================================================= */

const levelOrder = [

  "A1.1",
  "A1.2",
  "A1.3",

  "A2.1",
  "A2.2",
  "A2.3",
  "A2.3 mini",

  "B1.1",
  "B1.2",
  "B1.3",

  "B2.1",
  "B2.2",
  "B2.3",

  "BELİRSİZ"

];


/* =========================================================
   DATA
========================================================= */

let students = [];
let teachers = {};

let currentSlide = 0;
let paused = false;

const SLIDE_DURATION = 15000;

let elapsed = 0;
let lastTick = null;
let raf = null;


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

  const rows = [];
  let row = [];
  let cell = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {

    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {

      cell += '"';
      i++;
      continue;

    }

    if (char === '"') {

      insideQuotes = !insideQuotes;
      continue;

    }

    if (char === "," && !insideQuotes) {

      row.push(cell.trim());
      cell = "";
      continue;

    }

    if ((char === "\n" || char === "\r") && !insideQuotes) {

      if (char === "\r" && next === "\n") {
        i++;
      }

      row.push(cell.trim());

      if (row.some(v => v !== "")) {
        rows.push(row);
      }

      row = [];
      cell = "";

      continue;

    }

    cell += char;

  }

  if (cell !== "" || row.length > 0) {

    row.push(cell.trim());

    if (row.some(v => v !== "")) {
      rows.push(row);
    }

  }

  return rows;
}


/* =========================================================
   NORMALIZE HEADER
========================================================= */

function normalize(value) {

  return String(value || "")
    .trim()
    .toUpperCase()
    .replace(/\s+/g, " ");

}


/* =========================================================
   FETCH GOOGLE SHEET
========================================================= */

async function fetchSheet(gid) {

  const url =
    `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${gid}&t=${Date.now()}`;

  const response = await fetch(url, {
    cache: "no-store"
  });

  if (!response.ok) {
    throw new Error(
      `Google Sheet API returned ${response.status}`
    );
  }

  const text = await response.text();

  if (
    text.includes("<!DOCTYPE html>") ||
    text.includes("<html")
  ) {
    throw new Error(
      "Google Sheet is not publicly accessible."
    );
  }

  return parseCSV(text);
}


/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadStudents() {

  const rows = await fetchSheet(STUDENTS_GID);

  if (!rows.length) {
    throw new Error("Student sheet is empty.");
  }

  const headers = rows[0].map(normalize);

  const findColumn = (...names) => {

    for (const name of names) {

      const index =
        headers.indexOf(normalize(name));

      if (index !== -1) {
        return index;
      }

    }

    return -1;
  };


  const nameIndex = findColumn(
    "İSİM SOYİSİM",
    "ISIM SOYISIM",
    "NAME",
    "STUDENT"
  );

  const levelIndex = findColumn(
    "NORM_SEVIYE",
    "NORM SEVIYE",
    "YENI DONEM SEVIYE",
    "YENİ DÖNEM SEVİYE",
    "LEVEL"
  );

  const timeIndex = findColumn(
    "ZAMAN",
    "TIME",
    "GROUP"
  );

  const statusIndex = findColumn(
    "Kayıt Durumu (KY/YK)",
    "KAYIT DURUMU (KY/YK)",
    "KAYIT DURUMU",
    "STATUS"
  );


  if (nameIndex === -1) {
    throw new Error(
      "Could not find student name column."
    );
  }

  if (levelIndex === -1) {
    throw new Error(
      "Could not find level column."
    );
  }

  if (timeIndex === -1) {
    throw new Error(
      "Could not find ZAMAN column."
    );
  }


  students = rows
    .slice(1)
    .map(row => {

      const name =
        row[nameIndex] || "";

      const level =
        row[levelIndex] || "BELİRSİZ";

      const time =
        row[timeIndex] || "";

      const status =
        statusIndex !== -1
          ? row[statusIndex] || ""
          : "";

      return {

        name: name.trim(),

        level:
          cleanLevel(level),

        time:
          time.trim().toUpperCase(),

        status:
          normalizeStatus(status)

      };

    })
    .filter(s => s.name !== "");

}


/* =========================================================
   LOAD TEACHERS
========================================================= */

async function loadTeachers() {

  /*
    If Teachers GID has not been entered,
    keep all teachers as TBD.
  */

  if (
    !TEACHERS_GID ||
    TEACHERS_GID === "PASTE_TEACHERS_GID_HERE"
  ) {

    teachers = {};

    return;

  }


  const rows =
    await fetchSheet(TEACHERS_GID);

  if (!rows.length) {

    teachers = {};

    return;

  }


  const headers =
    rows[0].map(normalize);


  const groupIndex =
    headers.indexOf("GROUP");

  const levelIndex =
    headers.indexOf("LEVEL");

  const teacherIndex =
    headers.indexOf("TEACHER");


  if (
    groupIndex === -1 ||
    levelIndex === -1 ||
    teacherIndex === -1
  ) {

    throw new Error(
      "Teachers sheet must have GROUP, LEVEL and TEACHER columns."
    );

  }


  teachers = {};


  rows.slice(1).forEach(row => {

    const group =
      normalize(row[groupIndex]);

    const level =
      cleanLevel(row[levelIndex]);

    const teacher =
      String(row[teacherIndex] || "").trim();


    if (!group || !level) {
      return;
    }


    if (!teachers[group]) {
      teachers[group] = {};
    }


    teachers[group][level] =
      teacher || "TBD";

  });

}


/* =========================================================
   CLEAN LEVEL
========================================================= */

function cleanLevel(value) {

  let level =
    String(value || "")
      .trim()
      .replace(/\*/g, "");

  if (
    level === "" ||
    level === "?" ||
    level.toUpperCase() === "BELIRSIZ" ||
    level.toUpperCase() === "BELİRSİZ"
  ) {

    return "BELİRSİZ";

  }

  level =
    level
      .replace(/\s+/g, " ")
      .trim();


  if (
    level.toLowerCase() === "a2.3 mini"
  ) {

    return "A2.3 mini";

  }


  return level.toUpperCase();

}


/* =========================================================
   STATUS
========================================================= */

function normalizeStatus(value) {

  const status =
    String(value || "")
      .trim()
      .toUpperCase();


  if (status === "KY") {
    return "KY";
  }

  if (status === "YK") {
    return "YK";
  }

  return "";

}


/* =========================================================
   GROUP FILTER
========================================================= */

function getStudentsForGroup(groupKey) {

  return students.filter(student => {

    const time =
      student.time;

    if (groupKey === "MW") {
      return time.includes("MW");
    }

    if (groupKey === "TT") {
      return time.includes("TT");
    }

    if (groupKey === "SA") {
      return (
        time === "SA" ||
        time === "SA-SU"
      );
    }

    if (groupKey === "SU") {
      return (
        time === "SU" ||
        time === "SA-SU"
      );
    }

    return false;

  });

}


/* =========================================================
   GROUP BY LEVEL
========================================================= */

function groupByLevel(list) {

  const map = {};


  list.forEach(student => {

    const level =
      student.level || "BELİRSİZ";

    if (!map[level]) {
      map[level] = [];
    }

    map[level].push(student);

  });


  return Object.entries(map)
    .sort(([a], [b]) => {

      const ai =
        levelOrder.indexOf(a);

      const bi =
        levelOrder.indexOf(b);

      return (
        (ai === -1 ? 999 : ai) -
        (bi === -1 ? 999 : bi)
      );

    });

}


/* =========================================================
   INITIALS
========================================================= */

function getInitials(name) {

  const parts =
    name
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  if (!parts.length) {
    return "?";
  }


  if (parts.length === 1) {
    return parts[0][0].toUpperCase();
  }


  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  ).toUpperCase();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   TEACHER LOOKUP
========================================================= */

function getTeacher(groupKey, level) {

  const group =
    teachers[normalize(groupKey)];

  if (!group) {
    return "TBD";
  }

  return (
    group[level] ||
    "TBD"
  );

}


/* =========================================================
   STATUS TEXT
========================================================= */

function statusText(status) {

  if (status === "KY") {
    return "Enrolled";
  }

  if (status === "YK") {
    return "Not enrolled";
  }

  return "Status not specified";

}


/* =========================================================
   RENDER
========================================================= */

function renderSlide(index) {

  const group =
    groups[index];

  const list =
    getStudentsForGroup(group.key);

  const byLevel =
    groupByLevel(list);


  /* Header */

  const badge =
    document.getElementById(
      "group-badge"
    );

  badge.textContent =
    group.label;

  badge.style.background =
    group.color;


  document.getElementById(
    "days-label"
  ).textContent =
    group.days;


  /* Content */

  const content =
    document.getElementById(
      "slide-content"
    );


  let html = `

    <div class="slide-header">

      <div class="slide-header-left">

        <div class="group-title">
          ${escapeHTML(group.days)}
        </div>

        <div class="group-meta">

          <div class="meta-chip">
            Students
            <strong>${list.length}</strong>
          </div>

        </div>

      </div>

      <div class="assignment-status">
        ${
          list.length
            ? ""
            : "No students in this group."
        }
      </div>

    </div>

  `;


  if (!list.length) {

    html += `
      <div class="message">
        No students in this group.
      </div>
    `;

    content.innerHTML =
      html;

    updateCounter();

    return;

  }


  html += `
    <div class="levels-grid">
  `;


  byLevel.forEach(
    ([level, levelStudents]) => {

      const teacher =
        getTeacher(
          group.key,
          level
        );


      html += `

        <div class="level-card">

          <div class="level-card-header">

            <div class="level-info">

              <span class="level-name">
                ${escapeHTML(level)}
              </span>

              <span class="level-count">
                ${levelStudents.length}
              </span>

            </div>

            <div class="teacher-name">
              ${escapeHTML(teacher)}
            </div>

          </div>

          <div class="student-list">

      `;


      levelStudents.forEach(
        student => {

          const statusClass =
            student.status === "KY"
              ? "ky"
              : student.status === "YK"
                ? "yk"
                : "none";


          html += `

            <div class="student-row">

              <div class="avatar">
                ${escapeHTML(
                  getInitials(
                    student.name
                  )
                )}
              </div>

              <div class="student-name">
                ${escapeHTML(
                  student.name
                )}
              </div>

              <div class="status-dot ${statusClass}">
              </div>

              <div class="student-status ${statusClass}">
                ${statusText(
                  student.status
                )}
              </div>

            </div>

          `;

        }
      );


      html += `

          </div>

        </div>

      `;

    }
  );


  html += `
    </div>
  `;


  content.innerHTML =
    html;


  updateCounter();

}


/* =========================================================
   NAV DOTS
========================================================= */

function buildDots() {

  const container =
    document.getElementById(
      "nav-dots"
    );

  container.innerHTML = "";


  groups.forEach(
    (group, index) => {

      const dot =
        document.createElement(
          "div"
        );

      dot.className =
        "dot" +
        (
          index === currentSlide
            ? " active"
            : ""
        );


      dot.title =
        group.days;


      dot.addEventListener(
        "click",
        () => {

          currentSlide =
            index;

          resetTimer();

          renderSlide(
            currentSlide
          );

        }
      );


      container.appendChild(
        dot
      );

    }
  );

}


/* =========================================================
   COUNTER
========================================================= */

function updateCounter() {

  document.getElementById(
    "slide-counter"
  ).textContent =
    `${currentSlide + 1} / ${groups.length}`;


  document
    .querySelectorAll(".dot")
    .forEach(
      (dot, index) => {

        dot.classList.toggle(
          "active",
          index === currentSlide
        );

      }
    );

}


/* =========================================================
   LOAD EVERYTHING
========================================================= */

async function loadData() {

  const content =
    document.getElementById(
      "slide-content"
    );


  content.innerHTML = `
    <div class="message">
      Loading Google Sheet...
    </div>
  `;


  try {

    await loadStudents();

    await loadTeachers();


    renderSlide(
      currentSlide
    );


    const now =
      new Date();


    document.getElementById(
      "updated"
    ).textContent =
      "Updated " +
      now.toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }
      );


  } catch (error) {

    console.error(error);


    content.innerHTML = `

      <div class="message error">

        <strong>
          Could not load Google Sheet.
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

        <br><br>

        Make sure the Google Sheet is
        publicly accessible and the GID
        is correct.

      </div>

    `;


    document.getElementById(
      "updated"
    ).textContent =
      "Update failed";

  }

}


/* =========================================================
   REFRESH
========================================================= */

document
  .getElementById(
    "refresh-btn"
  )
  .addEventListener(
    "click",
    async () => {

      const button =
        document.getElementById(
          "refresh-btn"
        );


      button.textContent =
        "↻ Loading...";

      button.disabled =
        true;


      try {

        await loadData();

      } finally {

        button.textContent =
          "↻ Refresh";

        button.disabled =
          false;

      }

    }
  );


/* =========================================================
   PAUSE / RESUME
========================================================= */

document
  .getElementById(
    "btn-pause"
  )
  .addEventListener(
    "click",
    () => {

      paused =
        !paused;


      document.getElementById(
        "btn-pause"
      ).textContent =
        paused
          ? "▶ Resume"
          : "⏸ Pause";

    }
  );


/* =========================================================
   TIMER
========================================================= */

function resetTimer() {

  elapsed = 0;

  lastTick =
    performance.now();

  document.getElementById(
    "timer-bar"
  ).style.width =
    "100%";

}


function tick(now) {

  if (!paused) {

    if (lastTick !== null) {

      elapsed +=
        now - lastTick;

    }

    lastTick =
      now;


    const percentage =
      Math.max(
        0,
        100 -
        (
          elapsed /
          SLIDE_DURATION
        ) *
        100
      );


    document.getElementById(
      "timer-bar"
    ).style.width =
      percentage + "%";


    if (
      elapsed >=
      SLIDE_DURATION
    ) {

      currentSlide =
        (
          currentSlide + 1
        ) %
        groups.length;


      renderSlide(
        currentSlide
      );


      resetTimer();

    }

  } else {

    lastTick =
      now;

  }


  raf =
    requestAnimationFrame(
      tick
    );

}


/* =========================================================
   START
========================================================= */

buildDots();

loadData();

resetTimer();

raf =
  requestAnimationFrame(
    tick
  );

</script>

</body>
</html>
