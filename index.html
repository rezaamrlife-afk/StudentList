<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmericanLife — Student Groups</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #f5f7fb;
  font-family: Arial, Helvetica, sans-serif;
  color: #171717;
}

.screen {
  min-height: 100vh;
  background: #f5f7fb;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 16px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 20;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  font-size: 21px;
  font-weight: 700;
  color: #111827;
}

.logo span {
  color: #2563eb;
}

.group-badge {
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
}

.days-label {
  font-size: 13px;
  color: #6b7280;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 18px;
}

.nav-dots {
  display: flex;
  gap: 7px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d1d5db;
  cursor: pointer;
}

.dot.active {
  background: #2563eb;
}

.timer-bar-wrap {
  width: 100px;
  height: 3px;
  background: #e5e7eb;
  border-radius: 4px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  background: #2563eb;
}

.btn {
  border: 1px solid #d1d5db;
  background: #fff;
  color: #374151;
  padding: 7px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 12px;
}

.btn:hover {
  background: #f3f4f6;
}

/* MERGE TAB BUTTON */
.btn-merge {
  border: 1px solid #7c3aed;
  background: #fff;
  color: #7c3aed;
  padding: 7px 14px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  transition: background 0.15s, color 0.15s;
}

.btn-merge:hover,
.btn-merge.active {
  background: #7c3aed;
  color: #fff;
}

/* MAIN */
.slide {
  flex: 1;
  padding: 28px 30px;
}

.slide-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  gap: 20px;
}

.group-title {
  font-size: 30px;
  font-weight: 700;
  color: #111827;
}

.group-time {
  font-size: 14px;
  font-weight: 500;
  color: #6b7280;
  margin-top: 4px;
}

.group-meta {
  display: flex;
  align-items: center;
  gap: 10px;
}

.meta-chip {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  padding: 7px 13px;
  border-radius: 20px;
  font-size: 12px;
}

.meta-chip .label {
  color: #9ca3af;

}

.meta-chip .value {

  color: #111827;
}

/* LEVEL GRID */
.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));

}

.level-card {

  box-shadow: 0 2px 8px rgba(0,0,0,.03);

.level-card.merged {

}

.level-card.cross-merged {

}

.level-card-header {
  padding: 12px 16px;
  background: #fafafa;
  border-bottom: 1px solid #eeeeee;
}

.level-card.merged .level-card-header {
  background: #f5f3ff;
  border-bottom: 1px solid #ede9fe;
}

.level-card.cross-merged .level-card-header {
  background: #ecfeff;
  border-bottom: 1px solid #cffafe;
}

.level-name {
  font-size: 14px;
  font-weight: 700;
  color: #2563eb;
}

.student-count-row {
  margin-top: 3px;
  font-size: 12px;
  color: #555;
}

.student-count-row strong {
  color: #111827;
}

.level-card.merged .level-name {
  color: #7c3aed;
}

.level-card.cross-merged .level-name {
  color: #0891b2;
}

.merge-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  background: #7c3aed;
  color: #fff;
  border-radius: 6px;
  padding: 2px 7px;
  margin-left: 8px;
  vertical-align: middle;
}

.cross-merge-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  background: #0891b2;
  color: #fff;
  border-radius: 6px;
  padding: 2px 7px;
  margin-left: 8px;
  vertical-align: middle;
}

.teacher {
  margin-top: 5px;
  font-size: 12px;
  color: #555;
}

.teacher strong {
  color: #111827;
}

.classroom {
  margin-top: 3px;
  font-size: 12px;
  color: #555;
}

}

/* level divider inside merged card */
.level-divider {

  font-size: 11px;

  color: #7c3aed;
  background: #ede9fe;

.student-list {

}

.student-row {

.student-row:last-child {

.avatar {

  height: 30px;
  border-radius: 50%;
  background: #eef2ff;

  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;

}

.level-card.merged .avatar {

  color: #7c3aed;
}

}

.student-name {
  flex: 1;
  font-size: 13px;

/* AGE BADGE */
.age-badge {
  font-size: 11px;
  font-weight: 700;
  color: #4b5563;
  background: #f3f4f6;

  border-radius: 10px;
  padding: 2px 8px;
  white-space: nowrap;
  flex-shrink: 0;
}

.status {
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 10px;

}

.status.ky {
  color: #15803d;
  background: #dcfce7;
}

.status.yk {

}

.status.empty {

/* MERGE VIEW */
.merge-view-header {
  margin-bottom: 22px;
}

.merge-view-title {
  font-size: 30px;
  font-weight: 700;
  color: #111827;
}

.merge-view-sub {

  color: #6b7280;

/* MERGE SECTION TABS */
.merge-section-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;

  padding-bottom: 0;
}

.merge-tab {
  padding: 8px 18px;

  border-radius: 8px 8px 0 0;
  cursor: pointer;
  border: none;
  background: transparent;
  color: #6b7280;

}

.merge-tab.active {

}

.merge-tab.cross-active {

  border-bottom-color: #0891b2;
}

.merge-tab:hover {
  color: #374151;
}

.merge-section {
  display: none;
}

.merge-section.visible {
  display: block;
}

.merge-group-section {
  margin-bottom: 30px;
}

.merge-group-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.merge-group-badge {
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 14px;
}

.merge-group-name {
  font-size: 16px;
  font-weight: 700;
  color: #374151;
}

.merge-no-merges {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  color: #15803d;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 600;
}

/* Age group divider */
.age-group-title {

  font-weight: 700;

/* Cross-day merge section */
.cross-section-header {

/* FOOTER */
.footer {

  border-top: 1px solid #e5e7eb;

.legend {

.legend-item {

}

.slide-counter {
  font-size: 12px;

.loading {
  text-align: center;
  padding: 70px 20px;
  color: #6b7280;

.error {

/* MOBILE */
@media (max-width: 700px) {
  .header {
    padding: 14px 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .days-label {
    display: none;
  }

  .header-right {
    gap: 8px;
  }

  .timer-bar-wrap {
    display: none;
  }

  .slide {
    padding: 20px 16px;
  }

  .slide-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .group-title {

  }

  .footer {

  }
}
</style>

<body>

<div class="screen">

  <header class="header">

    <div class="header-left">
      <div class="logo">
        American<span>Life</span>
      </div>

      <div id="group-badge" class="group-badge">
        MW
      </div>

      <div id="days-label" class="days-label">
        Monday & Wednesday
      </div>
    </div>

    <div class="header-right">

      <div class="nav-dots" id="nav-dots"></div>

      <div class="timer-bar-wrap">
        <div id="timer-bar" class="timer-bar"></div>
      </div>

      <button id="merge-tab-btn" class="btn-merge">
        ⚡ Merge View
      </button>

      <button id="refresh-btn" class="btn">
        ↻ Refresh
      </button>

      <button id="pause-btn" class="btn">
        ⏸ Pause
      </button>

    </div>

  </header>

  <main class="slide">

    <div id="slide-content">
      <div class="loading">
        Loading Google Sheet...
      </div>
    </div>

  </main>

  <footer class="footer">

    <div class="legend">
      <div class="legend-item">🟢 Renewal (KY)</div>
      <div class="legend-item">🟠 New Registration (YK)</div>
      <div class="legend-item">⚪ Status not specified</div>
    </div>

    <div id="updated" class="slide-counter">
      Loading...
    </div>

    <div id="slide-counter" class="slide-counter">
      1 / 4
    </div>

  </footer>

</div>


<script>

/* =========================================================
   GOOGLE SHEET
   ========================================================= */

const SHEET_ID       = "1EP-k7eBQ9w7BUhJ-mdng70EtTPXhDHNMib5lbSXyJBw";
const DATA_SHEET     = "DATA";
const TEACHERS_SHEET = "Teachers";

/* threshold: levels with fewer than this many students get merged */
const MERGE_THRESHOLD = 3;


/* =========================================================
   GROUPS
   ========================================================= */

const groups = [
  { key: "MW", label: "MW", days: "Monday & Wednesday", time: "17:30 - 19:00", color: "#2563eb" },
  { key: "TT", label: "TT", days: "Tuesday & Thursday", time: "17:30 - 19:00", color: "#ea580c" },
  { key: "SA", label: "SA", days: "Saturday",           time: "10:00 - 13:10", color: "#16a34a" },
  { key: "SU", label: "SU", days: "Sunday",             time: "10:00 - 13:10", color: "#9333ea" }
];


/* =========================================================
   CEFR GROUP DEFINITIONS
   ========================================================= */

const CEFR_GROUPS = {
  "A1": ["A1.1","A1.2","A1.3"],
  "A2": ["A2.1","A2.2","A2.3","A2.3 MINI"],
  "B1": ["B1.1","B1.2","B1.3"],
  "B2": ["B2.1","B2.2","B2.3"]
};

/* Levels that NEVER get merged */
const NEVER_MERGE = ["A1.1"];

function getCEFRGroup(level) {
  const norm = normalize(level);
  for (const [group, levels] of Object.entries(CEFR_GROUPS)) {
    if (levels.map(l => normalize(l)).includes(norm)) return group;
  }
  return null;
}

function canMerge(levelA, levelB) {
  const normA = normalize(levelA);
  const normB = normalize(levelB);
  if (NEVER_MERGE.map(l => normalize(l)).includes(normA)) return false;
  if (NEVER_MERGE.map(l => normalize(l)).includes(normB)) return false;
  return getCEFRGroup(levelA) === getCEFRGroup(levelB) && getCEFRGroup(levelA) !== null;
}


/* =========================================================
   AGE UTILITIES
   ========================================================= */

function parseAge(ageStr) {
  const n = parseInt(String(ageStr || "").trim(), 10);
  return isNaN(n) ? null : n;
}

function getAgeGroup(ageStr) {
  const age = parseAge(ageStr);
  if (age === null) return "unknown";
  if (age >= 8 && age <= 10) return "8-10";
  if (age > 10)              return "10+";
  return "unknown";
}

function ageGroupLabel(key) {
  if (key === "8-10") return "Ages 8–10";
  if (key === "10+")  return "Ages 10+";
  return "Age Unknown";
}

const AGE_GROUP_ORDER = ["8-10","10+","unknown"];


/* =========================================================
   STATE
   ========================================================= */

let students     = [];
let teachers     = [];
let currentSlide = 0;
let paused       = false;
let mergeMode    = false;
let activeMergeTab = "within"; // "within" | "cross"

const SLIDE_DURATION = 15000;
let elapsed  = 0;
let lastTick = null;


/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i], next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') { cell += '"'; i++; continue; }
    if (char === '"') { insideQuotes = !insideQuotes; continue; }
    if (char === "," && !insideQuotes) { row.push(cell.trim()); cell = ""; continue; }

    if ((char === "\n" || char === "\r") && !insideQuotes) {
      if (char === "\r" && next === "\n") i++;
      row.push(cell.trim());
      if (row.some(x => x !== "")) rows.push(row);
      row = []; cell = "";
      continue;
    }
    cell += char;
  }

  if (cell !== "" || row.length) { row.push(cell.trim()); rows.push(row); }
  return rows;
}


/* =========================================================
   FETCH SHEET
   ========================================================= */

async function fetchSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error(`Google Sheet returned ${response.status}`);
  const text = await response.text();
  if (text.includes("<!DOCTYPE html>") || text.includes("<html")) {
    throw new Error(`Could not access sheet "${sheetName}". Make sure the Google Sheet is public.`);
  }
  return parseCSV(text);
}


/* =========================================================
   NORMALIZE / FIND COLUMN
   ========================================================= */

function normalize(value) {
  return String(value || "").trim().toUpperCase().replace(/\s+/g, " ");
}

function findColumn(headers, names) {
  const nh = headers.map(h => normalize(h));
  for (const name of names) {
    const index = nh.indexOf(normalize(name));
    if (index !== -1) return index;
  }
  return -1;
}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData() {
  document.getElementById("slide-content").innerHTML =
    `<div class="loading">Loading Google Sheet...</div>`;

  try {
    const [dataRows, teacherRows] = await Promise.all([
      fetchSheet(DATA_SHEET),
      fetchSheet(TEACHERS_SHEET)
    ]);

    /* --- STUDENTS --- */
    if (!dataRows.length) throw new Error("DATA sheet is empty.");

    const dataHeaders = dataRows[0];

    const nameIndex   = findColumn(dataHeaders, ["İSİM SOYİSİM","ISIM SOYISIM","NAME","STUDENT","STUDENT NAME"]);
    const levelIndex  = findColumn(dataHeaders, ["NORM_SEVIYE","NORM SEVIYE","YENI DONEM SEVIYE","LEVEL"]);
    const timeIndex   = findColumn(dataHeaders, ["ZAMAN","TIME","GROUP"]);
    const statusIndex = findColumn(dataHeaders, ["Kayıt Durumu (KY/YK)","KAYIT DURUMU (KY/YK)","KAYIT DURUMU","STATUS"]);
    const ageIndex    = findColumn(dataHeaders, ["YAŞ","YAS","AGE"]);

    if (nameIndex  === -1) throw new Error("Could not find student name column in DATA.");
    if (levelIndex === -1) throw new Error("Could not find level column in DATA.");
    if (timeIndex  === -1) throw new Error("Could not find ZAMAN/TIME column in DATA.");

    students = dataRows.slice(1).map(row => ({
      name:   row[nameIndex]   || "",
      level:  row[levelIndex]  || "BELİRSİZ",
      time:   row[timeIndex]   || "",
      status: statusIndex === -1 ? "" : row[statusIndex] || "",
      age:    ageIndex    === -1 ? "" : row[ageIndex]    || ""
    })).filter(s => s.name.trim() !== "");

    /* --- TEACHERS --- */
    teachers = [];
    if (teacherRows.length > 0) {
      const th  = teacherRows[0];
      const gi  = findColumn(th, ["GROUP","GRUP"]);
      const li  = findColumn(th, ["LEVEL","SEVİYE","SEVIYE"]);
      const tni = findColumn(th, ["TEACHER","TEACHER NAME","ÖĞRETMEN","OGRETMEN","MODERES","MODARES"]);
      const ci  = findColumn(th, ["CLASSROOM","SINIF","ROOM","DERSLİK","DERSLIK"]);

      if (gi !== -1 && li !== -1 && tni !== -1) {
        teachers = teacherRows.slice(1).map(row => ({
          group:     normalize(row[gi]),
          level:     normalize(row[li]),
          teacher:   String(row[tni] || "").trim(),
          classroom: ci === -1 ? "" : String(row[ci] || "").trim()
        })).filter(x => x.group && x.level);
      }
    }

    if (mergeMode) {
      renderMergeView();
    } else {
      renderSlide(currentSlide);
    }

    document.getElementById("updated").textContent =
      "Updated " + new Date().toLocaleTimeString();

  } catch (error) {
    console.error(error);
    document.getElementById("slide-content").innerHTML = `
      <div class="error">
        <strong>Could not load Google Sheet.</strong><br><br>
        ${escapeHTML(error.message)}<br><br>
        Make sure both tabs are named exactly <strong>DATA</strong> and <strong>Teachers</strong>.
        Also make sure the Google Sheet is accessible publicly.
      </div>`;
  }
}


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getTeacherInfo(groupKey, level) {
  const found = teachers.find(t =>
    t.group === normalize(groupKey) && t.level === normalize(level)
  );
  return {
    teacher:   found && found.teacher   ? found.teacher   : "—",
    classroom: found && found.classroom ? found.classroom : "—"
  };
}

function getStudentsForGroup(groupKey) {
  return students.filter(student => {
    const time = normalize(student.time);
    if (groupKey === "MW") return time.includes("MW");
    if (groupKey === "TT") return time.includes("TT");
    if (groupKey === "SA") return time === "SA" || time === "SA-SU";
    if (groupKey === "SU") return time === "SU" || time === "SA-SU";
    return false;
  });
}

const levelOrder = [
  "A1.1","A1.2","A1.3",
  "A2.1","A2.2","A2.3","A2.3 MINI",
  "B1.1","B1.2","B1.3",
  "B2.1","B2.2","B2.3",
  "BELİRSİZ"
];

function groupByLevel(list) {
  const map = {};
  list.forEach(student => {
    const level = student.level || "BELİRSİZ";
    if (!map[level]) map[level] = [];
    map[level].push(student);
  });
  return Object.entries(map).sort(([a], [b]) => {
    const ai = levelOrder.indexOf(normalize(a));
    const bi = levelOrder.indexOf(normalize(b));
    return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
  });
}

function getInitials(name) {
  const parts = String(name).trim().split(/\s+/);
  if (!parts.length) return "?";
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}

function statusHTML(status) {
  const s = normalize(status);
  if (s === "KY") return `<span class="status ky">Renewal</span>`;
  if (s === "YK") return `<span class="status yk">New Reg.</span>`;
  return `<span class="status empty">—</span>`;
}

function studentRowHTML(student, crossMerge = false) {
  return `
    <div class="student-row">
      <div class="avatar">${escapeHTML(getInitials(student.name))}</div>
      <div class="student-name">${escapeHTML(student.name)}</div>
      ${student.age ? `<span class="age-badge">${escapeHTML(student.age)}</span>` : ""}
      ${statusHTML(student.status)}
    </div>`;
}


/* =========================================================
   WITHIN-GROUP MERGE LOGIC
   =========================================================
   Rules:
   1. First group students by age (8-10, 10+, unknown)
   2. Within each age group, sort by level
   3. Merge only if:
      - level is NOT in NEVER_MERGE
      - both levels are in the same CEFR group
      - student count < MERGE_THRESHOLD
   ========================================================= */

function computeWithinGroupMergedCards(groupKey) {
  const list = getStudentsForGroup(groupKey);
  if (!list.length) return [];

  // Group by age first
  const byAge = {};
  list.forEach(s => {
    const ag = getAgeGroup(s.age);
    if (!byAge[ag]) byAge[ag] = [];
    byAge[ag].push(s);
  });

  const allCards = [];

  AGE_GROUP_ORDER.forEach(ageKey => {
    if (!byAge[ageKey]) return;

    const ageStudents = byAge[ageKey];
    const byLevel     = groupByLevel(ageStudents);

    if (!byLevel.length) return;

    const items = byLevel.map(([level, studs]) => ({ level, students: studs }));
    const used  = new Array(items.length).fill(false);
    const cards = [];

    for (let i = 0; i < items.length; i++) {
      if (used[i]) continue;

      const isSmall  = items[i].students.length < MERGE_THRESHOLD;
      const neverMrg = NEVER_MERGE.map(l => normalize(l)).includes(normalize(items[i].level));

      if (!isSmall || neverMrg) {
        // standalone card
        cards.push({
          levels:   [items[i].level],
          students: [...items[i].students],
          ismerged: false,
          ageGroup: ageKey
        });
        used[i] = true;
      } else {
        // find next unused neighbour in same CEFR group
        let partner = -1;
        for (let j = i + 1; j < items.length; j++) {
          if (!used[j] && canMerge(items[i].level, items[j].level)) {
            partner = j;
            break;
          }
        }

        if (partner !== -1) {
          cards.push({
            levels:   [items[i].level, items[partner].level],
            students: [...items[i].students, ...items[partner].students],
            ismerged: true,
            ageGroup: ageKey,
            perLevel: [
              { level: items[i].level,       students: items[i].students },
              { level: items[partner].level, students: items[partner].students }
            ]
          });
          used[i]       = true;
          used[partner] = true;
        } else {
          // no valid neighbour — show standalone even if small
          cards.push({
            levels:   [items[i].level],
            students: [...items[i].students],
            ismerged: false,
            ageGroup: ageKey
          });
          used[i] = true;
        }
      }
    }

    allCards.push({ ageKey, cards });
  });

  return allCards;
}


/* =========================================================
   CROSS-GROUP MERGE LOGIC
   =========================================================
   Find levels that are small (< threshold) across different
   day groups and suggest merging them together.
   Rules:
   - Same age group
   - Same CEFR group (or same level)
   - Neither level is in NEVER_MERGE
   - Both are small (< MERGE_THRESHOLD)
   ========================================================= */

function computeCrossGroupMerges() {
  // Collect all small levels across all groups, keyed by ageGroup + level
  // structure: { ageGroup_level: [{ groupKey, students }] }

  const smallByAgeLevel = {};

  groups.forEach(group => {
    const list = getStudentsForGroup(group.key);
    const byLevel = groupByLevel(list);

    // Also group by age within this group
    const byAge = {};
    list.forEach(s => {
      const ag = getAgeGroup(s.age);
      if (!byAge[ag]) byAge[ag] = [];
      byAge[ag].push(s);
    });

    AGE_GROUP_ORDER.forEach(ageKey => {
      if (!byAge[ageKey]) return;
      const ageStudents = byAge[ageKey];
      const byLevelAge  = groupByLevel(ageStudents);

      byLevelAge.forEach(([level, studs]) => {
        const neverMrg = NEVER_MERGE.map(l => normalize(l)).includes(normalize(level));
        if (neverMrg) return;
        if (studs.length < MERGE_THRESHOLD) {
          const key = `${ageKey}||${normalize(level)}`;
          if (!smallByAgeLevel[key]) smallByAgeLevel[key] = [];
          smallByAgeLevel[key].push({ groupKey: group.key, level, students: studs, ageKey });
        }
      });
    });
  });

  // Now find groups of small levels that can be merged cross-group
  // Two entries can merge if they are in the same CEFR group
  // We also want to suggest merges across different levels in same CEFR group

  const suggestions = [];
  const usedKeys    = new Set();

  const allKeys = Object.keys(smallByAgeLevel);

  // First pass: exact same level across groups (easiest merge)
  allKeys.forEach(key => {
    if (usedKeys.has(key)) return;
    const entries = smallByAgeLevel[key];
    if (entries.length < 2) return; // need at least 2 groups

    usedKeys.add(key);
    const [ageKey, level] = key.split("||");
    suggestions.push({
      type:     "same-level",
      ageKey,
      level,
      entries,
      totalStudents: entries.reduce((s, e) => s + e.students.length, 0)
    });
  });

  // Second pass: different levels in same CEFR group, same age group
  // Group remaining small entries by ageGroup + CEFR group
  const byCEFR = {};
  allKeys.forEach(key => {
    if (usedKeys.has(key)) return;
    const entries = smallByAgeLevel[key];
    const [ageKey, level] = key.split("||");
    const cefrGroup = getCEFRGroup(level);
    if (!cefrGroup) return;

    const cefrKey = `${ageKey}||${cefrGroup}`;
    if (!byCEFR[cefrKey]) byCEFR[cefrKey] = [];
    entries.forEach(e => byCEFR[cefrKey].push({ ...e, key }));
  });

  Object.entries(byCEFR).forEach(([cefrKey, entries]) => {
    if (entries.length < 2) return;
    // Group by level so we show perLevel breakdown
    const [ageKey, cefrGroup] = cefrKey.split("||");
    const perLevel = {};
    entries.forEach(e => {
      const lk = `${e.groupKey}||${normalize(e.level)}`;
      if (!perLevel[lk]) perLevel[lk] = { groupKey: e.groupKey, level: e.level, students: [] };
      perLevel[lk].students.push(...e.students);
    });

    suggestions.push({
      type:    "same-cefr",
      ageKey,
      cefrGroup,
      entries: Object.values(perLevel),
      totalStudents: entries.reduce((s, e) => s + e.students.length, 0)
    });
  });

  return suggestions;
}


/* =========================================================
   RENDER NORMAL SLIDE
   ========================================================= */

function renderSlide(index) {
  const group   = groups[index];
  const list    = getStudentsForGroup(group.key);
  const byLevel = groupByLevel(list);

  const badge = document.getElementById("group-badge");
  badge.textContent      = group.label;
  badge.style.background = group.color;
  document.getElementById("days-label").textContent = group.days + " · " + group.time;

  let html = `
    <div class="slide-header">
      <div>
        <div class="group-title">${escapeHTML(group.days)}</div>
        <div class="group-time">${escapeHTML(group.time)}</div>
      </div>
      <div class="group-meta">
        <div class="meta-chip">
          <span class="label">Students</span>
          <span class="value">${list.length}</span>
        </div>
      </div>
    </div>`;

  if (!list.length) {
    html += `<div class="loading">No students in this group.</div>`;
  } else {
    html += `<div class="levels-grid">`;
    byLevel.forEach(([level, studentsInLevel]) => {
      const info = getTeacherInfo(group.key, level);
      html += `
        <div class="level-card">
          <div class="level-card-header">
            <div class="level-name">${escapeHTML(level)}</div>
            <div class="teacher">Teacher: <strong>${escapeHTML(info.teacher)}</strong></div>
            <div class="classroom">Classroom: <strong>${escapeHTML(info.classroom)}</strong></div>
            <div class="student-count-row">Students: <strong>${studentsInLevel.length}</strong></div>
          </div>
          <div class="student-list">`;
      studentsInLevel.forEach(student => { html += studentRowHTML(student); });
      html += `</div></div>`;
    });
    html += `</div>`;
  }

  document.getElementById("slide-content").innerHTML = html;
  document.getElementById("slide-counter").textContent = `${index + 1} / ${groups.length}`;
  document.querySelectorAll(".dot").forEach((dot, i) =>
    dot.classList.toggle("active", i === index)
  );
}


/* =========================================================
   RENDER MERGE VIEW
   ========================================================= */

function renderMergeView() {
  document.getElementById("group-badge").textContent      = "⚡";
  document.getElementById("group-badge").style.background = "#7c3aed";
  document.getElementById("days-label").textContent       = "Merged View";
  document.getElementById("slide-counter").textContent    = "Merge View";

  const withinActive = activeMergeTab === "within";

  let html = `
    <div class="merge-view-header">
      <div class="merge-view-title">Merged Level View</div>
      <div class="merge-view-sub">Levels with fewer than ${MERGE_THRESHOLD} students — merged by age group then by CEFR level</div>
    </div>

    <div class="merge-section-tabs">
      <button class="merge-tab ${withinActive ? 'active' : ''}" onclick="switchMergeTab('within')">
        ⚡ Within Group Merges
      </button>
      <button class="merge-tab ${!withinActive ? 'cross-active' : ''}" onclick="switchMergeTab('cross')">
        🔀 Cross-Day Merges
      </button>
    </div>

    <div class="merge-section ${withinActive ? 'visible' : ''}" id="within-section">
      ${renderWithinSection()}
    </div>

    <div class="merge-section ${!withinActive ? 'visible' : ''}" id="cross-section">
      ${renderCrossSection()}
    </div>`;

  document.getElementById("slide-content").innerHTML = html;
  document.querySelectorAll(".dot").forEach(dot => dot.classList.remove("active"));
}

function renderWithinSection() {
  let html = "";

  groups.forEach(group => {
    const ageGroups   = computeWithinGroupMergedCards(group.key);
    const mergedCards = ageGroups.flatMap(ag => ag.cards.filter(c => c.ismerged));

    html += `
      <div class="merge-group-section">
        <div class="merge-group-label">
          <span class="merge-group-badge" style="background:${group.color}">${group.label}</span>
          <span class="merge-group-name">${escapeHTML(group.days)}</span>
        </div>`;

    if (!mergedCards.length) {
      html += `<div class="merge-no-merges">✓ No merges needed — all levels have ${MERGE_THRESHOLD}+ students</div>`;
    } else {
      ageGroups.forEach(({ ageKey, cards }) => {
        const mergedInAge = cards.filter(c => c.ismerged);
        if (!mergedInAge.length) return;

        html += `<div class="age-group-title">${ageGroupLabel(ageKey)}</div>`;
        html += `<div class="levels-grid">`;

        mergedInAge.forEach(card => {
          const title = card.levels.join(" + ");
          html += `
            <div class="level-card merged">
              <div class="level-card-header">
                <div class="level-name">
                  ${escapeHTML(title)}
                  <span class="merge-tag">MERGED</span>
                </div>
                <div class="teacher">Total students: <strong>${card.students.length}</strong></div>
              </div>
              <div class="student-list">`;

          if (card.perLevel) {
            card.perLevel.forEach(pl => {
              html += `<div class="level-divider">${escapeHTML(pl.level)} (${pl.students.length})</div>`;
              pl.students.forEach(s => { html += studentRowHTML(s); });
            });
          } else {
            card.students.forEach(s => { html += studentRowHTML(s); });
          }

          html += `</div></div>`;
        });

        html += `</div>`;
      });
    }

    html += `</div>`;
  });

  return html;
}

function renderCrossSection() {
  const suggestions = computeCrossGroupMerges();

  let html = `
    <div class="cross-section-header">
      🔀 These are suggested merges between different day groups — levels that are small across multiple groups and could share a class.
    </div>`;

  if (!suggestions.length) {
    html += `<div class="merge-no-merges">✓ No cross-day merges needed — all levels have ${MERGE_THRESHOLD}+ students in their own groups</div>`;
    return html;
  }

  // Group by age
  const byAge = {};
  suggestions.forEach(s => {
    if (!byAge[s.ageKey]) byAge[s.ageKey] = [];
    byAge[s.ageKey].push(s);
  });

  AGE_GROUP_ORDER.forEach(ageKey => {
    if (!byAge[ageKey]) return;

    html += `<div class="age-group-title">${ageGroupLabel(ageKey)}</div>`;
    html += `<div class="levels-grid">`;

    byAge[ageKey].forEach(sug => {
      if (sug.type === "same-level") {
        const groupLabels = sug.entries.map(e => e.groupKey).join(" + ");
        html += `
          <div class="level-card cross-merged">
            <div class="level-card-header">
              <div class="level-name">
                ${escapeHTML(sug.level)}
                <span class="cross-merge-tag">CROSS</span>
              </div>
              <div class="teacher">Groups: <strong>${escapeHTML(groupLabels)}</strong> · Total: <strong>${sug.totalStudents}</strong></div>
            </div>
            <div class="student-list">`;

        sug.entries.forEach(e => {
          html += `<div class="level-divider cross">${escapeHTML(e.groupKey)} — ${escapeHTML(e.level)} (${e.students.length})</div>`;
          e.students.forEach(s => { html += studentRowHTML(s, true); });
        });

        html += `</div></div>`;

      } else if (sug.type === "same-cefr") {
        const levelNames = [...new Set(sug.entries.map(e => e.level))].join(" + ");
        const groupNames = [...new Set(sug.entries.map(e => e.groupKey))].join(" + ");
        html += `
          <div class="level-card cross-merged">
            <div class="level-card-header">
              <div class="level-name">
                ${escapeHTML(levelNames)}
                <span class="cross-merge-tag">CROSS</span>
              </div>
              <div class="teacher">Groups: <strong>${escapeHTML(groupNames)}</strong> · Total: <strong>${sug.totalStudents}</strong></div>
              <div class="classroom">CEFR group: <strong>${escapeHTML(sug.cefrGroup)}</strong></div>
            </div>
            <div class="student-list">`;

        sug.entries.forEach(e => {
          html += `<div class="level-divider cross">${escapeHTML(e.groupKey)} — ${escapeHTML(e.level)} (${e.students.length})</div>`;
          e.students.forEach(s => { html += studentRowHTML(s, true); });
        });

        html += `</div></div>`;
      }
    });

    html += `</div>`;
  });

  return html;
}


/* =========================================================
   MERGE TAB SWITCHER
   ========================================================= */

function switchMergeTab(tab) {
  activeMergeTab = tab;
  renderMergeView();
}


/* =========================================================
   NAV DOTS
   ========================================================= */

function buildDots() {
  const container = document.getElementById("nav-dots");
  container.innerHTML = "";
  groups.forEach((group, index) => {
    const dot = document.createElement("div");
    dot.className = "dot";
    if (index === 0) dot.classList.add("active");
    dot.title = group.days;
    dot.addEventListener("click", () => {
      if (mergeMode) {
        mergeMode = false;
        document.getElementById("merge-tab-btn").classList.remove("active");
      }
      currentSlide = index;
      resetTimer();
      renderSlide(currentSlide);
    });
    container.appendChild(dot);
  });
}


/* =========================================================
   MERGE TAB BUTTON
   ========================================================= */

document.getElementById("merge-tab-btn").addEventListener("click", () => {
  mergeMode = !mergeMode;
  document.getElementById("merge-tab-btn").classList.toggle("active", mergeMode);

  if (mergeMode) {
    paused = true;
    document.getElementById("pause-btn").textContent = "▶ Resume";
    renderMergeView();
  } else {
    paused = false;
    document.getElementById("pause-btn").textContent = "⏸ Pause";
    renderSlide(currentSlide);
    resetTimer();
  }
});


/* =========================================================
   TIMER
   ========================================================= */

function resetTimer() {
  elapsed  = 0;
  lastTick = performance.now();
  document.getElementById("timer-bar").style.width = "100%";
}

function tick(now) {
  if (!paused && !mergeMode) {
    if (lastTick !== null) elapsed += now - lastTick;
    lastTick = now;

    const pct = Math.max(0, 100 - (elapsed / SLIDE_DURATION) * 100);
    document.getElementById("timer-bar").style.width = pct + "%";

    if (elapsed >= SLIDE_DURATION) {
      currentSlide = (currentSlide + 1) % groups.length;
      renderSlide(currentSlide);
      elapsed = 0;
    }
  } else {
    lastTick = now;
  }
  requestAnimationFrame(tick);
}


/* =========================================================
   PAUSE / REFRESH
   ========================================================= */

document.getElementById("pause-btn").addEventListener("click", () => {
  if (mergeMode) return;
  paused = !paused;
  document.getElementById("pause-btn").textContent = paused ? "▶ Resume" : "⏸ Pause";
});

document.getElementById("refresh-btn").addEventListener("click", async () => {
  const btn = document.getElementById("refresh-btn");
  btn.textContent = "↻ Loading...";
  await loadData();
  btn.textContent = "↻ Refresh";
  if (!mergeMode) resetTimer();
});


/* =========================================================
   START
   ========================================================= */

buildDots();
loadData();
resetTimer();
requestAnimationFrame(tick);

</script>
</body>
</html>
