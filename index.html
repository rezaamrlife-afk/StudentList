<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmericanLife — Student Groups</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #f5f7fb;
  font-family: Arial, Helvetica, sans-serif;
  color: #171717;
}

.screen {
  min-height: 100vh;
  background: #f5f7fb;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 16px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 20;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  font-size: 21px;
  font-weight: 700;
  color: #111827;
}

.logo span {
  color: #2563eb;
}

.group-badge {
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
}

.days-label {
  font-size: 13px;
  color: #6b7280;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 18px;
}

.nav-dots {
  display: flex;
  gap: 7px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d1d5db;
  cursor: pointer;
}

.dot.active {
  background: #2563eb;
}

.timer-bar-wrap {
  width: 100px;
  height: 3px;
  background: #e5e7eb;
  border-radius: 4px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  background: #2563eb;
}

.btn {
  border: 1px solid #d1d5db;
  background: #fff;
  color: #374151;
  padding: 7px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 12px;
}

.btn:hover {
  background: #f3f4f6;
}

/* MAIN */
.slide {
  flex: 1;
  padding: 28px 30px;
}

.slide-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  gap: 20px;
}

.group-title {
  font-size: 30px;
  font-weight: 700;
  color: #111827;
}

.group-meta {
  display: flex;
  align-items: center;
  gap: 10px;
}

.meta-chip {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  padding: 7px 13px;
  border-radius: 20px;
  font-size: 12px;
}

.meta-chip .label {
  color: #9ca3af;
  margin-right: 5px;
}

.meta-chip .value {
  font-weight: 700;
  color: #111827;
}

/* LEVEL GRID */
.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 14px;
}

.level-card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.03);
}

.level-card-header {
  padding: 12px 16px;
  background: #fafafa;
  border-bottom: 1px solid #eeeeee;
}

.level-name {
  font-size: 14px;
  font-weight: 700;
  color: #2563eb;
}

.teacher {
  margin-top: 5px;
  font-size: 12px;
  color: #555;
}

.teacher strong {
  color: #111827;
}

.classroom {
  margin-top: 3px;
  font-size: 12px;
  color: #555;
}

.classroom strong {
  color: #111827;
}

.student-list {
  padding: 5px 0;
}

.student-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-bottom: 1px solid #f0f0f0;
}

.student-row:last-child {
  border-bottom: none;
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #eef2ff;
  color: #2563eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  flex-shrink: 0;
}

.student-name {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  color: #374151;
}

.status {
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 10px;
  font-weight: 600;
}

.status.ky {
  color: #15803d;
  background: #dcfce7;
}

.status.yk {
  color: #c2410c;
  background: #ffedd5;
}

.status.empty {
  color: #6b7280;
  background: #f3f4f6;
}

/* FOOTER */
.footer {
  padding: 12px 30px;
  background: #ffffff;
  border-top: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.legend {
  display: flex;
  gap: 15px;
}

.legend-item {
  font-size: 11px;
  color: #6b7280;
}

.slide-counter {
  font-size: 12px;
  color: #9ca3af;
}

.loading {
  text-align: center;
  padding: 70px 20px;
  color: #6b7280;
}

.error {
  background: #fff1f2;
  border: 1px solid #fecdd3;
  color: #be123c;
  padding: 18px;
  border-radius: 10px;
}

/* MOBILE */
@media (max-width: 700px) {
  .header {
    padding: 14px 16px;
  }

  .days-label {
    display: none;
  }

  .header-right {
    gap: 8px;
  }

  .timer-bar-wrap {
    display: none;
  }

  .slide {
    padding: 20px 16px;
  }

  .slide-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .group-title {
    font-size: 24px;
  }

  .levels-grid {
    grid-template-columns: 1fr;
  }

  .footer {
    padding: 12px 16px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <header class="header">

    <div class="header-left">
      <div class="logo">
        American<span>Life</span>
      </div>

      <div id="group-badge" class="group-badge">
        MW
      </div>

      <div id="days-label" class="days-label">
        Monday & Wednesday
      </div>
    </div>

    <div class="header-right">

      <div class="nav-dots" id="nav-dots"></div>

      <div class="timer-bar-wrap">
        <div id="timer-bar" class="timer-bar"></div>
      </div>

      <button id="refresh-btn" class="btn">
        ↻ Refresh
      </button>

      <button id="pause-btn" class="btn">
        ⏸ Pause
      </button>

    </div>

  </header>

  <main class="slide">

    <div id="slide-content">
      <div class="loading">
        Loading Google Sheet...
      </div>
    </div>

  </main>

  <footer class="footer">

    <div class="legend">
      <div class="legend-item">🟢 Enrolled (KY)</div>
      <div class="legend-item">🟠 Not enrolled (YK)</div>
      <div class="legend-item">⚪ Status not specified</div>
    </div>

    <div id="updated" class="slide-counter">
      Loading...
    </div>

    <div id="slide-counter" class="slide-counter">
      1 / 4
    </div>

  </footer>

</div>


<script>

/* =========================================================
   GOOGLE SHEET
   ========================================================= */

const SHEET_ID =
  "1EP-k7eBQ9w7BUhJ-mdng70EtTPXhDHNMib5lbSXyJBw";

const DATA_SHEET =
  "DATA";

const TEACHERS_SHEET =
  "Teachers";


/* =========================================================
   GROUPS
   ========================================================= */

const groups = [

  {
    key: "MW",
    label: "MW",
    days: "Monday & Wednesday",
    color: "#2563eb"
  },

  {
    key: "TT",
    label: "TT",
    days: "Tuesday & Thursday",
    color: "#ea580c"
  },

  {
    key: "SA",
    label: "SA",
    days: "Saturday",
    color: "#16a34a"
  },

  {
    key: "SU",
    label: "SU",
    days: "Sunday",
    color: "#9333ea"
  }

];


/* =========================================================
   DATA
   ========================================================= */

let students = [];
let teachers = [];

let currentSlide = 0;
let paused = false;

const SLIDE_DURATION = 15000;

let elapsed = 0;
let lastTick = null;


/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];
  let cell = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {

    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {
      cell += '"';
      i++;
      continue;
    }

    if (char === '"') {
      insideQuotes = !insideQuotes;
      continue;
    }

    if (char === "," && !insideQuotes) {
      row.push(cell.trim());
      cell = "";
      continue;
    }

    if ((char === "\n" || char === "\r") && !insideQuotes) {

      if (char === "\r" && next === "\n") {
        i++;
      }

      row.push(cell.trim());

      if (row.some(x => x !== "")) {
        rows.push(row);
      }

      row = [];
      cell = "";

      continue;
    }

    cell += char;
  }

  if (cell !== "" || row.length) {
    row.push(cell.trim());
    rows.push(row);
  }

  return rows;
}


/* =========================================================
   FETCH SHEET
   ========================================================= */

async function fetchSheet(sheetName) {

  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;

  const response = await fetch(url, {
    cache: "no-store"
  });

  if (!response.ok) {
    throw new Error(
      `Google Sheet returned ${response.status}`
    );
  }

  const text = await response.text();

  if (
    text.includes("<!DOCTYPE html>") ||
    text.includes("<html")
  ) {
    throw new Error(
      `Could not access sheet "${sheetName}". Make sure the Google Sheet is public.`
    );
  }

  return parseCSV(text);
}


/* =========================================================
   NORMALIZE
   ========================================================= */

function normalize(value) {

  return String(value || "")
    .trim()
    .toUpperCase()
    .replace(/\s+/g, " ");

}


/* =========================================================
   FIND COLUMN
   ========================================================= */

function findColumn(headers, names) {

  const normalizedHeaders =
    headers.map(h => normalize(h));

  for (const name of names) {

    const index =
      normalizedHeaders.indexOf(normalize(name));

    if (index !== -1) {
      return index;
    }

  }

  return -1;
}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData() {

  document.getElementById("slide-content").innerHTML =
    `<div class="loading">Loading Google Sheet...</div>`;

  try {

    const [dataRows, teacherRows] =
      await Promise.all([

        fetchSheet(DATA_SHEET),

        fetchSheet(TEACHERS_SHEET)

      ]);


    /* -----------------------------
       STUDENTS
       ----------------------------- */

    if (!dataRows.length) {
      throw new Error("DATA sheet is empty.");
    }

    const dataHeaders = dataRows[0];

    const nameIndex =
      findColumn(dataHeaders, [
        "İSİM SOYİSİM",
        "ISIM SOYISIM",
        "NAME",
        "STUDENT",
        "STUDENT NAME"
      ]);

    const levelIndex =
      findColumn(dataHeaders, [
        "NORM_SEVIYE",
        "NORM SEVIYE",
        "YENI DONEM SEVIYE",
        "LEVEL"
      ]);

    const timeIndex =
      findColumn(dataHeaders, [
        "ZAMAN",
        "TIME",
        "GROUP"
      ]);

    const statusIndex =
      findColumn(dataHeaders, [
        "Kayıt Durumu (KY/YK)",
        "KAYIT DURUMU (KY/YK)",
        "KAYIT DURUMU",
        "STATUS"
      ]);


    if (nameIndex === -1) {
      throw new Error(
        "Could not find student name column in DATA."
      );
    }

    if (levelIndex === -1) {
      throw new Error(
        "Could not find level column in DATA."
      );
    }

    if (timeIndex === -1) {
      throw new Error(
        "Could not find ZAMAN/TIME column in DATA."
      );
    }


    students = dataRows
      .slice(1)
      .map(row => ({

        name: row[nameIndex] || "",

        level:
          row[levelIndex] ||
          "BELİRSİZ",

        time:
          row[timeIndex] ||
          "",

        status:
          statusIndex === -1
            ? ""
            : row[statusIndex] || ""

      }))
      .filter(s => s.name.trim() !== "");


    /* -----------------------------
       TEACHERS
       ----------------------------- */

    teachers = [];

    if (teacherRows.length > 0) {

      const teacherHeaders =
        teacherRows[0];

      const groupIndex =
        findColumn(teacherHeaders, [
          "GROUP",
          "GRUP"
        ]);

      const teacherLevelIndex =
        findColumn(teacherHeaders, [
          "LEVEL",
          "SEVİYE",
          "SEVIYE"
        ]);

      const teacherNameIndex =
        findColumn(teacherHeaders, [
          "TEACHER",
          "TEACHER NAME",
          "ÖĞRETMEN",
          "OGRETMEN",
          "MODERES",
          "MODARES"
        ]);

      const classroomIndex =
        findColumn(teacherHeaders, [
          "CLASSROOM",
          "SINIF",
          "ROOM",
          "DERSLİK",
          "DERSLIK"
        ]);


      if (
        groupIndex !== -1 &&
        teacherLevelIndex !== -1 &&
        teacherNameIndex !== -1
      ) {

        teachers =
          teacherRows
            .slice(1)
            .map(row => ({

              group:
                normalize(row[groupIndex]),

              level:
                normalize(row[teacherLevelIndex]),

              teacher:
                String(
                  row[teacherNameIndex] || ""
                ).trim(),

              classroom:
                classroomIndex === -1
                  ? ""
                  : String(
                      row[classroomIndex] || ""
                    ).trim()

            }))
            .filter(x =>
              x.group &&
              x.level
            );

      }

    }


    renderSlide(currentSlide);

    document.getElementById("updated").textContent =
      "Updated " +
      new Date().toLocaleTimeString();


  } catch (error) {

    console.error(error);

    document.getElementById("slide-content").innerHTML = `
      <div class="error">

        <strong>Could not load Google Sheet.</strong>

        <br><br>

        ${escapeHTML(error.message)}

        <br><br>

        Make sure both tabs are named exactly:

        <strong>DATA</strong>

        and

        <strong>Teachers</strong>.

        <br><br>

        Also make sure the Google Sheet is accessible publicly.

      </div>
    `;

  }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   GET TEACHER
   ========================================================= */

function getTeacherInfo(groupKey, level) {

  const g =
    normalize(groupKey);

  const l =
    normalize(level);


  const found =
    teachers.find(t =>
      t.group === g &&
      t.level === l
    );


  return {
    teacher: found && found.teacher ? found.teacher : "—",
    classroom: found && found.classroom ? found.classroom : "—"
  };

}


/* =========================================================
   GET STUDENTS FOR GROUP
   ========================================================= */

function getStudentsForGroup(groupKey) {

  return students.filter(student => {

    const time =
      normalize(student.time);

    if (groupKey === "MW") {
      return time.includes("MW");
    }

    if (groupKey === "TT") {
      return time.includes("TT");
    }

    if (groupKey === "SA") {
      return (
        time === "SA" ||
        time === "SA-SU"
      );
    }

    if (groupKey === "SU") {
      return (
        time === "SU" ||
        time === "SA-SU"
      );
    }

    return false;

  });

}


/* =========================================================
   LEVEL ORDER
   ========================================================= */

const levelOrder = [

  "A1.1",
  "A1.2",
  "A1.3",

  "A2.1",
  "A2.2",
  "A2.3",
  "A2.3 MINI",

  "B1.1",
  "B1.2",
  "B1.3",

  "B2.1",
  "B2.2",
  "B2.3",

  "BELİRSİZ"

];


/* =========================================================
   GROUP BY LEVEL
   ========================================================= */

function groupByLevel(list) {

  const map = {};

  list.forEach(student => {

    const level =
      student.level || "BELİRSİZ";

    if (!map[level]) {
      map[level] = [];
    }

    map[level].push(student);

  });


  return Object.entries(map)
    .sort(([a], [b]) => {

      const ai =
        levelOrder.indexOf(
          normalize(a)
        );

      const bi =
        levelOrder.indexOf(
          normalize(b)
        );

      return (
        (ai === -1 ? 999 : ai) -
        (bi === -1 ? 999 : bi)
      );

    });

}


/* =========================================================
   INITIALS
   ========================================================= */

function getInitials(name) {

  const parts =
    String(name)
      .trim()
      .split(/\s+/);

  if (!parts.length) {
    return "?";
  }

  return (
    parts[0][0] +
    (parts[1] ? parts[1][0] : "")
  ).toUpperCase();

}


/* =========================================================
   STATUS
   ========================================================= */

function statusHTML(status) {

  const s =
    normalize(status);

  if (s === "KY") {

    return `
      <span class="status ky">
        Enrolled
      </span>
    `;

  }

  if (s === "YK") {

    return `
      <span class="status yk">
        Not enrolled
      </span>
    `;

  }

  return `
    <span class="status empty">
      —
    </span>
  `;

}


/* =========================================================
   RENDER
   ========================================================= */

function renderSlide(index) {

  const group =
    groups[index];

  const list =
    getStudentsForGroup(group.key);

  const byLevel =
    groupByLevel(list);


  /* HEADER */

  const badge =
    document.getElementById(
      "group-badge"
    );

  badge.textContent =
    group.label;

  badge.style.background =
    group.color;


  document.getElementById(
    "days-label"
  ).textContent =
    group.days;


  /* CONTENT */

  let html = `

    <div class="slide-header">

      <div class="group-title">
        ${escapeHTML(group.days)}
      </div>

      <div class="group-meta">

        <div class="meta-chip">

          <span class="label">
            Students
          </span>

          <span class="value">
            ${list.length}
          </span>

        </div>

      </div>

    </div>

  `;


  if (!list.length) {

    html += `
      <div class="loading">
        No students in this group.
      </div>
    `;

  } else {

    html += `
      <div class="levels-grid">
    `;


    byLevel.forEach(
      ([level, studentsInLevel]) => {

        const info =
          getTeacherInfo(
            group.key,
            level
          );


        html += `

          <div class="level-card">

            <div class="level-card-header">

              <div class="level-name">
                ${escapeHTML(level)}
              </div>

              <div class="teacher">
                Teacher:
                <strong>
                  ${escapeHTML(info.teacher)}
                </strong>
              </div>

              <div class="classroom">
                Classroom:
                <strong>
                  ${escapeHTML(info.classroom)}
                </strong>
              </div>

            </div>

            <div class="student-list">

        `;


        studentsInLevel.forEach(student => {

          html += `

            <div class="student-row">

              <div class="avatar">
                ${escapeHTML(
                  getInitials(student.name)
                )}
              </div>

              <div class="student-name">
                ${escapeHTML(student.name)}
              </div>

              ${statusHTML(
                student.status
              )}

            </div>

          `;

        });


        html += `

            </div>

          </div>

        `;

      }
    );


    html += `</div>`;

  }


  document.getElementById(
    "slide-content"
  ).innerHTML = html;


  /* COUNTER */

  document.getElementById(
    "slide-counter"
  ).textContent =
    `${index + 1} / ${groups.length}`;


  /* DOTS */

  document
    .querySelectorAll(".dot")
    .forEach((dot, i) => {

      dot.classList.toggle(
        "active",
        i === index
      );

    });

}


/* =========================================================
   DOTS
   ========================================================= */

function buildDots() {

  const container =
    document.getElementById(
      "nav-dots"
    );

  container.innerHTML = "";


  groups.forEach(
    (group, index) => {

      const dot =
        document.createElement("div");

      dot.className =
        "dot";

      if (index === 0) {
        dot.classList.add("active");
      }

      dot.title =
        group.days;

      dot.addEventListener(
        "click",
        () => {

          currentSlide =
            index;

          resetTimer();

          renderSlide(
            currentSlide
          );

        }
      );

      container.appendChild(dot);

    }
  );

}


/* =========================================================
   TIMER
   ========================================================= */

function resetTimer() {

  elapsed = 0;

  lastTick =
    performance.now();

  document.getElementById(
    "timer-bar"
  ).style.width = "100%";

}


function tick(now) {

  if (!paused) {

    if (lastTick !== null) {

      elapsed +=
        now - lastTick;

    }

    lastTick = now;


    const percentage =
      Math.max(
        0,
        100 -
        (elapsed / SLIDE_DURATION) *
        100
      );


    document.getElementById(
      "timer-bar"
    ).style.width =
      percentage + "%";


    if (
      elapsed >=
      SLIDE_DURATION
    ) {

      currentSlide =
        (currentSlide + 1) %
        groups.length;

      renderSlide(
        currentSlide
      );

      elapsed = 0;

    }

  } else {

    lastTick = now;

  }


  requestAnimationFrame(tick);

}


/* =========================================================
   PAUSE
   ========================================================= */

document
  .getElementById("pause-btn")
  .addEventListener(
    "click",
    () => {

      paused =
        !paused;

      document.getElementById(
        "pause-btn"
      ).textContent =
        paused
          ? "▶ Resume"
          : "⏸ Pause";

    }
  );


/* =========================================================
   REFRESH
   ========================================================= */

document
  .getElementById("refresh-btn")
  .addEventListener(
    "click",
    async () => {

      const button =
        document.getElementById(
          "refresh-btn"
        );

      button.textContent =
        "↻ Loading...";

      await loadData();

      button.textContent =
        "↻ Refresh";

      resetTimer();

    }
  );


/* =========================================================
   START
   ========================================================= */
