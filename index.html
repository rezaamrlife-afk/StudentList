      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background:#e87040"></div>
        Not enrolled (YK)
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background:#aaa"></div>
        Status not specified
      </div>

    </div>

    <div class="slide-counter" id="slide-counter"></div>

  </div>

</div>

<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const SHEET_ID =
"1EP-k7eBQ9w7BUhJ-mdng70EtTPXhDHNMib5lbSXyJBw";

const STUDENT_GID =
"610591116";

const TEACHER_GID =
"0";

/*
  IMPORTANT:
  If your Teachers tab has another gid,
  replace TEACHER_GID above.
*/


/* =========================================================
   GROUPS
========================================================= */

const groups = [

  {
    key: "MW",
    label: "MW",
    days: "Monday & Wednesday"
  },

  {
    key: "TT",
    label: "TT",
    days: "Tuesday & Thursday"
  },

  {
    key: "SA",
    label: "SA",
    days: "Saturday"
  },

  {
    key: "SU",
    label: "SU",
    days: "Sunday"
  }

];


/* =========================================================
   LEVELS
========================================================= */

const levels = [

  "A1.1",
  "A1.2",
  "A1.3",

  "A2.1",
  "A2.2",
  "A2.3",

  "B1.1",
  "B1.2",
  "B1.3",

  "B2.1",
  "B2.2",
  "B2.3"

];


/* =========================================================
   STATE
========================================================= */

let students = [];

let teachers = [];

let currentSlide = 0;

let currentTab = "students";

let paused = false;

let timer = 0;

const SLIDE_DURATION = 15000;


/* =========================================================
   GOOGLE SHEET CSV
========================================================= */

async function loadSheet(gid) {

  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;

  const response = await fetch(url);

  if (!response.ok) {

    throw new Error(
      "Google Sheet API returned " + response.status
    );

  }

  const text = await response.text();

  return parseCSV(text);
}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];

  let value = "";

  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {

    const char = text[i];

    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {

      value += '"';

      i++;

    }

    else if (char === '"') {

      insideQuotes = !insideQuotes;

    }

    else if (char === "," && !insideQuotes) {

      row.push(value.trim());

      value = "";

    }

    else if (
      (char === "\n" || char === "\r") &&
      !insideQuotes
    ) {

      if (value !== "" || row.length > 0) {

        row.push(value.trim());

        rows.push(row);

        row = [];

        value = "";

      }

    }

    else {

      value += char;

    }

  }

  if (value !== "" || row.length > 0) {

    row.push(value.trim());

    rows.push(row);

  }

  if (!rows.length) return [];

  const headers = rows[0].map(h =>
    h.trim().toUpperCase()
  );

  return rows.slice(1).map(r => {

    const obj = {};

    headers.forEach((h, i) => {

      obj[h] = (r[i] || "").trim();

    });

    return obj;

  });

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value) {

  return String(value || "")
    .trim()
    .toUpperCase();

}


/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadStudents() {

  students = await loadSheet(STUDENT_GID);

  students = students
    .map(s => {

      return {

        name:
          s["İSİM SOYİSİM"] ||
          s["ISIM SOYISIM"] ||
          s["NAME"] ||
          "",

        level:
          s["NORM_SEVIYE"] ||
          s["NORM SEVIYE"] ||
          s["YENI DONEM SEVIYE"] ||
          "",

        time:
          s["ZAMAN"] ||
          s["TIME"] ||
          "",

        status:
          s["KAYIT DURUMU (KY/YK)"] ||
          s["KAYIT DURUMU"] ||
          s["STATUS"] ||
          ""

      };

    })

    .filter(s => s.name);

}


/* =========================================================
   LOAD TEACHERS
========================================================= */

async function loadTeachers() {

  try {

    teachers = await loadSheet(TEACHER_GID);

  }

  catch (error) {

    console.warn(
      "Teachers sheet could not be loaded:",
      error
    );

    teachers = [];

  }

}


/* =========================================================
   GET STUDENTS
========================================================= */

function getStudentsForGroup(groupKey) {

  return students.filter(s => {

    const t = normalize(s.time);

    if (groupKey === "MW")
      return t.includes("MW");

    if (groupKey === "TT")
      return t.includes("TT");

    if (groupKey === "SA")
      return t === "SA" || t === "SA-SU";

    if (groupKey === "SU")
      return t === "SU" || t === "SA-SU";

    return false;

  });

}


/* =========================================================
   INITIALS
========================================================= */

function getInitials(name) {

  const parts =
    name.trim().split(/\s+/);

  return (
    (parts[0]?.[0] || "") +
    (parts[1]?.[0] || "")
  ).toUpperCase();

}


/* =========================================================
   LEVEL SORT
========================================================= */

function levelSort(a, b) {

  const order = [

    "A1.1",
    "A1.2",
    "A1.3",

    "A2.1",
    "A2.2",
    "A2.3",

    "B1.1",
    "B1.2",
    "B1.3",

    "B2.1",
    "B2.2",
    "B2.3",

    "BELİRSİZ"

  ];

  return (
    order.indexOf(a) -
    order.indexOf(b)
  );

}


/* =========================================================
   GET TEACHER
========================================================= */

function getTeacher(group, level) {

  const result = teachers.find(t => {

    const g =
      normalize(
        t["GROUP"] ||
        t["GRUP"]
      );

    const l =
      normalize(
        t["LEVEL"] ||
        t["SEVİYE"] ||
        t["SEVIYE"]
      );

    return (
      g === normalize(group) &&
      l === normalize(level)
    );

  });

  if (!result) return "";

  return (
    result["TEACHER"] ||
    result["TEACHER NAME"] ||
    result["MODERATOR"] ||
    ""
  ).trim();

}


/* =========================================================
   GROUP STUDENTS BY LEVEL
========================================================= */

function groupByLevel(list) {

  const map = {};

  list.forEach(student => {

    const level =
      student.level ||
      "BELİRSİZ";

    if (!map[level])
      map[level] = [];

    map[level].push(student);

  });

  return Object.entries(map)
    .sort(([a], [b]) =>
      levelSort(a, b)
    );

}


/* =========================================================
   RENDER STUDENTS
========================================================= */

function renderStudents(groupIndex) {

  const group =
    groups[groupIndex];

  const list =
    getStudentsForGroup(group.key);

  const grouped =
    groupByLevel(list);

  document.getElementById(
    "group-badge"
  ).textContent = group.label;

  document.getElementById(
    "days-label"
  ).textContent = group.days;

  const teacherText =
    "Teacher: TBD";

  document.getElementById(
    "slide-content"
  ).innerHTML = `

    <div class="slide-header">

      <div class="group-title">
        ${group.days}
      </div>

      <div class="group-meta">

        <div class="meta-chip">
          <span class="label">
            Students
          </span>

          <span class="value">
            ${list.length}
          </span>
        </div>

        <div class="teacher-chip">
          ${teacherText}
        </div>

      </div>

    </div>

    ${
      grouped.length
      ?
      `<div class="levels-grid">

        ${grouped.map(
          ([level, list]) => `

          <div class="level-card">

            <div class="level-card-header">

              <span class="level-name">
                ${level}
              </span>

              <span class="level-count">
                ${list.length}
              </span>

            </div>

            ${list.map(
              student => `

              <div class="student-row">

                <div class="avatar">
                  ${getInitials(student.name)}
                </div>

                <div class="student-name">
                  ${student.name}
                </div>

                <div
                  class="status-dot ${
                    normalize(student.status) === "KY"
                      ? "ky"
                      :
                    normalize(student.status) === "YK"
                      ? "yk"
                      :
                        "empty"
                  }">
                </div>

              </div>

            `).join("")}

          </div>

        `
        ).join("")}

      </div>`
      :
      `<div class="loading">
        No students in this group.
      </div>`
    }

  `;

  updateDots();

  document.getElementById(
    "slide-counter"
  ).textContent =
    `${groupIndex + 1} / ${groups.length}`;

}


/* =========================================================
   RENDER TEACHERS
========================================================= */

function renderTeachers() {

  document.getElementById(
    "group-badge"
  ).textContent = "Teachers";

  document.getElementById(
    "days-label"
  ).textContent =
    "Group & Level Assignments";

  let rows = "";

  groups.forEach(group => {

    levels.forEach(level => {

      const teacher =
        getTeacher(
          group.key,
          level
        );

      rows += `

        <tr>

          <td>
            <span class="group-code">
              ${group.key}
            </span>
          </td>

          <td>
            ${level}
          </td>

          <td>

            ${
              teacher
              ?
              `<span class="teacher-name">
                ${teacher}
              </span>`
              :
              `<span class="no-teacher">
                Not assigned
              </span>`
            }

          </td>

        </tr>

      `;

    });

  });

  document.getElementById(
    "slide-content"
  ).innerHTML = `

    <div class="teachers-container">

      <div class="teachers-title">
        Teachers
      </div>

      <table class="teacher-table">

        <thead>

          <tr>
            <th>GROUP</th>
            <th>LEVEL</th>
            <th>TEACHER</th>
          </tr>

        </thead>

        <tbody>

          ${rows}

        </tbody>

      </table>

    </div>

  `;

  document.getElementById(
    "slide-counter"
  ).textContent = "Teachers";

}


/* =========================================================
   RENDER
========================================================= */

function render() {

  if (currentTab === "students") {

    renderStudents(currentSlide);

  }

  else {

    renderTeachers();

  }

}


/* =========================================================
   TABS
========================================================= */

document
  .getElementById("students-tab")
  .addEventListener("click", () => {

    currentTab = "students";

    document
      .getElementById("students-tab")
      .classList.add("active");

    document
      .getElementById("teachers-tab")
      .classList.remove("active");

    render();

  });


document
  .getElementById("teachers-tab")
  .addEventListener("click", () => {

    currentTab = "teachers";

    document
      .getElementById("teachers-tab")
      .classList.add("active");

    document
      .getElementById("students-tab")
      .classList.remove("active");

    render();

  });


/* =========================================================
   DOTS
========================================================= */

function buildDots() {

  const container =
    document.getElementById(
      "nav-dots"
    );

  container.innerHTML = "";

  groups.forEach(
    (group, index) => {

      const dot =
        document.createElement("div");

      dot.className =
        "dot" +
        (index === 0
          ? " active"
          : "");

      dot.title =
        group.days;

      dot.addEventListener(
        "click",
        () => {

          currentSlide =
            index;

          timer = 0;

          render();

        }
      );

      container.appendChild(dot);

    }
  );

}


/* =========================================================
   UPDATE DOTS
========================================================= */

function updateDots() {

  document
    .querySelectorAll(".dot")
    .forEach(
      (dot, index) => {

        dot.classList.toggle(
          "active",
          index === currentSlide
        );

      }
    );

}


/* =========================================================
   PAUSE
========================================================= */

document
  .getElementById("btn-pause")
  .addEventListener(
    "click",
    () => {

      paused = !paused;

      document
        .getElementById(
          "btn-pause"
        )
        .textContent =
        paused
        ? "▶ Resume"
        : "⏸ Pause";

    }
  );


/* =========================================================
   AUTO SLIDES
========================================================= */

setInterval(
  () => {

    if (
      paused ||
      currentTab !== "students"
    ) return;

    timer += 1000;

    if (
      timer >=
      SLIDE_DURATION
    ) {

      timer = 0;

      currentSlide =
        (currentSlide + 1) %
        groups.length;

      render();

    }

  },
  1000
);


/* =========================================================
   START
========================================================= */

async function start() {

  document.getElementById(
    "slide-content"
  ).innerHTML = `
    <div class="loading">
      Loading Google Sheet...
    </div>
  `;

  try {

    await loadStudents();

    await loadTeachers();

    buildDots();

    render();

  }

  catch (error) {

    console.error(error);

    document.getElementById(
      "slide-content"
    ).innerHTML = `

      <div class="error">

        <strong>
          Could not load Google Sheet.
        </strong>

        <br><br>

        ${error.message}

        <br><br>

        Make sure the Google Sheet
        is publicly accessible.

      </div>

    `;

  }

}

start();

</script>

</body>
