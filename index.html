<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AmericanLife Groups</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #f5f6f8;
  color: #171717;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.screen {
  min-height: 100vh;
  background: #f5f6f8;
  display: flex;
  flex-direction: column;
}

/* ================= HEADER ================= */

.header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  font-size: 21px;
  font-weight: 700;
  color: #171717;
  letter-spacing: .01em;
}

.logo span {
  color: #5674d9;
}

.group-badge {
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
}

.days-label {
  font-size: 13px;
  color: #777;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.nav-dots {
  display: flex;
  gap: 7px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d1d5db;
  cursor: pointer;
}

.dot.active {
  background: #5674d9;
}

.timer-bar-wrap {
  width: 120px;
  height: 4px;
  background: #e5e7eb;
  border-radius: 4px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  background: #5674d9;
  transition: width .1s linear;
}

.btn {
  background: #ffffff;
  border: 1px solid #dcdfe5;
  color: #555;
  font-size: 12px;
  padding: 7px 13px;
  border-radius: 7px;
  cursor: pointer;
}

.btn:hover {
  background: #f2f3f5;
}

/* ================= CONTENT ================= */

.slide {
  flex: 1;
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.slide-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.group-title {
  font-size: 30px;
  font-weight: 650;
  color: #171717;
}

.group-meta {
  display: flex;
  align-items: center;
  gap: 10px;
}

.meta-chip {
  background: #ffffff;
  border: 1px solid #e1e4e8;
  padding: 6px 13px;
  border-radius: 20px;
  font-size: 12px;
}

.meta-chip .label {
  color: #888;
  margin-right: 6px;
}

.meta-chip .value {
  font-weight: 700;
  color: #333;
}

.teacher-summary {
  background: #eef2ff;
  border: 1px solid #dbe2ff;
  color: #5674d9;
  padding: 6px 13px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

/* ================= LEVEL GRID ================= */

.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
  gap: 13px;
  align-items: start;
}

.level-card {
  background: #ffffff;
  border: 1px solid #e1e4e8;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.03);
}

.level-card-header {
  padding: 11px 15px;
  border-bottom: 1px solid #edf0f2;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.level-left {
  display: flex;
  align-items: center;
  gap: 9px;
}

.level-name {
  font-size: 14px;
  font-weight: 700;
  color: #5674d9;
}

.level-count {
  min-width: 23px;
  height: 23px;
  padding: 0 7px;
  border-radius: 20px;
  background: #eef2ff;
  color: #5674d9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
}

.teacher-name {
  font-size: 11px;
  color: #888;
  font-weight: 500;
}

.teacher-name.assigned {
  color: #333;
  font-weight: 650;
}

.teacher-name.pending {
  color: #b07a00;
}

/* ================= STUDENTS ================= */

.student-list {
  padding: 5px 0;
}

.student-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 15px;
  border-bottom: 1px solid #f0f1f3;
}

.student-row:last-child {
  border-bottom: none;
}

.avatar {
  width: 29px;
  height: 29px;
  border-radius: 50%;
  background: #eef2ff;
  color: #5674d9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  flex-shrink: 0;
}

.student-name {
  flex: 1;
  font-size: 12.5px;
  color: #333;
  font-weight: 500;
}

.student-status {
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 10px;
  white-space: nowrap;
}

.student-status.ky {
  background: #eaf8f0;
  color: #268456;
}

.student-status.yk {
  background: #fff0ea;
  color: #c65d32;
}

.student-status.empty {
  background: #f1f1f1;
  color: #999;
}

/* ================= FOOTER ================= */

.footer {
  padding: 12px 32px;
  background: #ffffff;
  border-top: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.legend {
  display: flex;
  gap: 18px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #777;
}

.legend-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.slide-counter {
  font-size: 11px;
  color: #999;
}

.refresh-status {
  font-size: 11px;
  color: #999;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 800px) {

  .header {
    padding: 15px;
  }

  .header-right {
    gap: 10px;
  }

  .days-label {
    display: none;
  }

  .timer-bar-wrap {
    display: none;
  }

  .slide {
    padding: 20px 15px;
  }

  .slide-header {
    align-items: flex-start;
    flex-direction: column;
    gap: 10px;
  }

  .levels-grid {
    grid-template-columns: 1fr;
  }

  .footer {
    padding: 10px 15px;
  }
}
</style>
</head>

<script>

/* =========================================================
   GOOGLE SHEETS
   ========================================================= */

const SPREADSHEET_ID =
  "1EP-k7eBQ9w7BUhJ-mdng70EtTPXhDHNMib5lbSXyJBw";


/*
  IMPORTANT:

  Your Google Sheet should have these tabs:

  1. Students
  2. Teachers

  Students columns:

  İSİM SOYİSİM
  BİTİRDİKLERİ SEVİYE
  YENI DONEM SEVIYE
  YAŞ
  DOĞUM TAR.
  ZAMAN
  DAHA ÖNCEKİ SEANSI
  Kayıt Durumu (KY/YK)
  NOT
  NORM_SEVIYE
  RANK
  KEY


  Teachers columns:

  GROUP
  LEVEL
  TEACHER
*/


const SHEET_STUDENTS = "Students";
const SHEET_TEACHERS = "Teachers";


/* =========================================================
   GROUPS
   ========================================================= */

const groups = [

  {
    key: "MW",
    label: "MW",
    days: "Monday & Wednesday",
    color: "#5674d9"
  },

  {
    key: "TT",
    label: "TT",
    days: "Tuesday & Thursday",
    color: "#e87040"
  },

  {
    key: "SA",
    label: "SA",
    days: "Saturday",
    color: "#4caf82"
  },

  {
    key: "SU",
    label: "SU",
    days: "Sunday",
    color: "#9b6ce0"
  }

];


/* =========================================================
   LEVEL ORDER
   ========================================================= */

const levelOrder = [

  "A1.1",
  "A1.2",
  "A1.3",

  "A2.1",
  "A2.2",
  "A2.3",
  "A2.3 mini",

  "B1.1",
  "B1.2",
  "B1.3",

  "B2.1",
  "B2.2",
  "B2.3",

  "BELİRSİZ"

];


/* =========================================================
   STATE
   ========================================================= */

let students = [];
let teachers = [];

let currentSlide = 0;

let paused = false;

let elapsed = 0;

let lastTick = null;

let raf = null;

const SLIDE_DURATION = 15000;


/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];

  let cell = "";

  let insideQuotes = false;


  for (let i = 0; i < text.length; i++) {

    const char = text[i];

    const next = text[i + 1];


    if (char === '"' && insideQuotes && next === '"') {

      cell += '"';

      i++;

    }

    else if (char === '"') {

      insideQuotes = !insideQuotes;

    }

    else if (char === "," && !insideQuotes) {

      row.push(cell);

      cell = "";

    }

    else if (
      (char === "\n" || char === "\r") &&
      !insideQuotes
    ) {

      if (char === "\r" && next === "\n") {
        i++;
      }

      row.push(cell);

      rows.push(row);

      row = [];

      cell = "";

    }

    else {

      cell += char;

    }

  }


  if (cell.length || row.length) {

    row.push(cell);

    rows.push(row);

  }


  return rows;

}


/* =========================================================
   NORMALIZE
   ========================================================= */

function normalize(value) {

  return String(value || "")
    .trim()
    .toUpperCase()
    .replace(/\s+/g, " ");

}


/* =========================================================
   FIND COLUMN
   ========================================================= */

function findColumn(headers, possibleNames) {

  const normalizedHeaders =
    headers.map(normalize);


  for (const name of possibleNames) {

    const index =
      normalizedHeaders.indexOf(
        normalize(name)
      );

    if (index !== -1) {
      return index;
    }

  }


  return -1;

}


/* =========================================================
   FETCH GOOGLE SHEET
   ========================================================= */

async function fetchSheet(sheetName) {

  const url =
    `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;


  const response =
    await fetch(url, {
      cache: "no-store"
    });


  if (!response.ok) {

    throw new Error(
      `Google Sheet returned ${response.status}`
    );

  }


  const text =
    await response.text();


  if (
    text.includes("<!DOCTYPE") ||
    text.includes("<html")
  ) {

    throw new Error(
      "Google Sheet is not publicly accessible."
    );

  }


  return parseCSV(text);

}


/* =========================================================
   LOAD STUDENTS
   ========================================================= */

async function loadStudents() {

  const rows =
    await fetchSheet(
      SHEET_STUDENTS
    );


  if (!rows.length) {
    return [];
  }


  const headers = rows[0];


  const nameCol =
    findColumn(
      headers,
      [
        "İSİM SOYİSİM",
        "ISIM SOYISIM",
        "NAME",
        "STUDENT"
      ]
    );


  const timeCol =
    findColumn(
      headers,
      [
        "ZAMAN",
        "TIME",
        "GROUP"
      ]
    );


  const levelCol =
    findColumn(
      headers,
      [
        "NORM_SEVIYE",
        "NORM SEVIYE",
        "YENI DONEM SEVIYE",
        "LEVEL"
      ]
    );


  const statusCol =
    findColumn(
      headers,
      [
        "Kayıt Durumu (KY/YK)",
        "KAYIT DURUMU (KY/YK)",
        "KAYIT DURUMU",
        "STATUS"
      ]
    );


  if (nameCol === -1) {

    throw new Error(
      "Student name column not found."
    );

  }


  return rows
    .slice(1)
    .filter(row =>
      row.some(cell =>
        String(cell || "").trim()
      )
    )
    .map(row => {

      return {

        name:
          row[nameCol] || "",

        time:
          timeCol >= 0
            ? row[timeCol] || ""
            : "",

        level:
          levelCol >= 0
            ? row[levelCol] || "BELİRSİZ"
            : "BELİRSİZ",

        status:
          statusCol >= 0
            ? row[statusCol] || ""
            : ""

      };

    });

}


/* =========================================================
   LOAD TEACHERS
   ========================================================= */

async function loadTeachers() {

  const rows =
    await fetchSheet(
      SHEET_TEACHERS
    );


  if (!rows.length) {
    return [];
  }


  const headers = rows[0];


  const groupCol =
    findColumn(
      headers,
      [
        "GROUP",
        "GRUP"
      ]
    );


  const levelCol =
    findColumn(
      headers,
      [
        "LEVEL",
        "SEVİYE",
        "SEVIYE"
      ]
    );


  const teacherCol =
    findColumn(
      headers,
      [
        "TEACHER",
        "TEACHER NAME",
        "ÖĞRETMEN",
        "OGRETMEN",
        "MODERATOR"
      ]
    );


  if (
    groupCol === -1 ||
    levelCol === -1 ||
    teacherCol === -1
  ) {

    console.warn(
      "Teachers sheet columns not found."
    );

    return [];

  }


  return rows
    .slice(1)
    .filter(row =>
      row.some(cell =>
        String(cell || "").trim()
      )
    )
    .map(row => {

      return {

        group:
          normalize(
            row[groupCol]
          ),

        level:
          normalize(
            row[levelCol]
          ),

        teacher:
          String(
            row[teacherCol] || ""
          ).trim()

      };

    });

}


/* =========================================================
   TEACHER LOOKUP
   ========================================================= */

function getTeacher(
  groupKey,
  level
) {

  const targetGroup =
    normalize(groupKey);

  const targetLevel =
    normalize(level);


  const exact =
    teachers.find(t =>

      normalize(t.group) === targetGroup &&
      normalize(t.level) === targetLevel

    );


  return exact
    ? exact.teacher
    : "";

}


/* =========================================================
   GROUP STUDENTS
   ========================================================= */

function getStudentsForGroup(
  groupKey
) {

  return students.filter(student => {

    const time =
      normalize(student.time);


    if (groupKey === "MW") {

      return time.includes("MW");

    }


    if (groupKey === "TT") {

      return time.includes("TT");

    }


    if (groupKey === "SA") {

      return (
        time === "SA" ||
        time === "SA-SU"
      );

    }


    if (groupKey === "SU") {

      return (
        time === "SU" ||
        time === "SA-SU"
      );

    }


    return false;

  });

}


/* =========================================================
   GROUP BY LEVEL
   ========================================================= */

function groupByLevel(
  list
) {

  const map = {};


  list.forEach(student => {

    let level =
      String(
        student.level || "BELİRSİZ"
      ).trim();


    if (
      !level ||
      level === "?"
    ) {

      level = "BELİRSİZ";

    }


    if (!map[level]) {

      map[level] = [];

    }


    map[level].push(student);

  });


  return Object
    .entries(map)
    .sort(
      ([a], [b]) => {

        const ai =
          levelOrder.indexOf(a);

        const bi =
          levelOrder.indexOf(b);


        return (
          (ai === -1 ? 999 : ai) -
          (bi === -1 ? 999 : bi)
        );

      }
    );

}


/* =========================================================
   INITIALS
   ========================================================= */

function getInitials(
  name
) {

  const parts =
    String(name)
      .trim()
      .split(/\s+/);


  if (!parts.length) {
    return "?";
  }


  return (
    parts[0][0] +
    (
      parts.length > 1
        ? parts[1][0]
        : ""
    )
  ).toUpperCase();

}


/* =========================================================
   STATUS
   ========================================================= */

function statusLabel(
  status
) {

  const s =
    normalize(status);


  if (s === "KY") {

    return {
      text: "Enrolled",
      className: "ky"
    };

  }


  if (s === "YK") {

    return {
      text: "Not enrolled",
      className: "yk"
    };

  }


  return {
    text: "Status not specified",
    className: "empty"
  };

}


/* =========================================================
   RENDER SLIDE
   ========================================================= */

function renderSlide(
  groupIndex
) {

  const group =
    groups[groupIndex];


  const groupStudents =
    getStudentsForGroup(
      group.key
    );


  const byLevel =
    groupByLevel(
      groupStudents
    );


  /* HEADER */

  const badge =
    document.getElementById(
      "group-badge"
    );


  badge.textContent =
    group.label;


  badge.style.background =
    group.color;


  document.getElementById(
    "days-label"
  ).textContent =
    group.days;


  /* TEACHER COUNT */

  const assignedTeachers =
    byLevel.filter(
      ([level]) =>
        getTeacher(
          group.key,
          level
        )
    ).length;


  const teacherText =
    assignedTeachers === byLevel.length &&
    byLevel.length > 0
      ? "Teachers assigned"
      : "Teacher assignment pending";


  /* CONTENT */

  const content =
    document.getElementById(
      "slide-content"
    );


  content.innerHTML = `

    <div class="slide-header">

      <div>

        <div class="group-title">
          ${group.days}
        </div>

      </div>


      <div class="group-meta">

        <div class="meta-chip">

          <span class="label">
            Students
          </span>

          <span class="value">
            ${groupStudents.length}
          </span>

        </div>


        <div class="teacher-summary">

          ${teacherText}

        </div>

      </div>

    </div>


    ${
      groupStudents.length === 0

      ? `

        <div class="level-card"
             style="padding:30px;text-align:center;color:#888;">

          No students in this group.

        </div>

      `

      : `

        <div class="levels-grid">

          ${byLevel.map(
            ([level, list]) => {

              const teacher =
                getTeacher(
                  group.key,
                  level
                );


              return `

                <div class="level-card">

                  <div class="level-card-header">

                    <div class="level-left">

                      <span class="level-name">
                        ${level}
                      </span>

                      <span class="level-count">
                        ${list.length}
                      </span>

                    </div>


                    <span
                      class="teacher-name ${
                        teacher
                          ? "assigned"
                          : "pending"
                      }"
                    >

                      ${
                        teacher
                          ? teacher
                          : "TBD"
                      }

                    </span>

                  </div>


                  <div class="student-list">

                    ${list.map(
                      student => {

                        const status =
                          statusLabel(
                            student.status
                          );


                        return `

                          <div class="student-row">

                            <div class="avatar">
                              ${getInitials(
                                student.name
                              )}
                            </div>


                            <div class="student-name">
                              ${student.name}
                            </div>


                            <div
                              class="student-status ${status.className}"
                            >
                              ${status.text}
                            </div>

                          </div>

                        `;

                      }
                    ).join("")}

                  </div>

                </div>

              `;

            }
          ).join("")}

        </div>

      `

    }

  `;


  /* COUNTER */

  document.getElementById(
    "slide-counter"
  ).textContent =
    `${groupIndex + 1} / ${groups.length}`;


  /* DOTS */

  document
    .querySelectorAll(".dot")
    .forEach(
      (dot, index) => {

        dot.classList.toggle(
          "active",
          index === groupIndex
        );

      }
    );

}


/* =========================================================
   BUILD NAV DOTS
   ========================================================= */

function buildDots() {

  const wrap =
    document.getElementById(
      "nav-dots"
    );


  wrap.innerHTML = "";


  groups.forEach(
    (group, index) => {

      const dot =
        document.createElement(
          "div"
        );


      dot.className =
        "dot";


      dot.title =
        group.days;


      dot.addEventListener(
        "click",
        () => {

          currentSlide =
            index;

          resetTimer();

          renderSlide(
            currentSlide
          );

        }
      );


      wrap.appendChild(
        dot
      );

    }
  );

}


/* =========================================================
   REFRESH
   ========================================================= */

async function refreshData() {

  const refreshStatus =
    document.getElementById(
      "refresh-status"
    );


  refreshStatus.textContent =
    "Updating...";


  try {

    /*
      Load both tabs.
    */

    const [
      newStudents,
      newTeachers
    ] = await Promise.all([

      loadStudents(),

      loadTeachers()

    ]);


    students =
      newStudents;


    teachers =
      newTeachers;


    renderSlide(
      currentSlide
    );


    const now =
      new Date();


    refreshStatus.textContent =
      "Updated " +
      now.toLocaleTimeString();


    console.log(
      "Students:",
      students
    );


    console.log(
      "Teachers:",
      teachers
    );


  }

  catch (error) {

    console.error(
      error
    );


    refreshStatus.textContent =
      "Could not load Google Sheet";


    document.getElementById(
      "slide-content"
    ).innerHTML = `

      <div
        class="level-card"
        style="
          padding:35px;
          text-align:center;
          color:#c65d32;
        "
      >

        <div style="
          font-size:16px;
          font-weight:700;
          margin-bottom:8px;
        ">

          Could not load Google Sheet.

        </div>

        <div style="
          font-size:12px;
          color:#888;
        ">

          ${error.message}

        </div>

      </div>

    `;

  }

}


/* =========================================================
   TIMER
   ========================================================= */

function resetTimer() {

  elapsed = 0;

  lastTick =
    performance.now();


  document.getElementById(
    "timer-bar"
  ).style.width =
    "100%";

}


function tick(now) {

  if (!paused) {

    if (lastTick !== null) {

      elapsed +=
        now - lastTick;

    }


    lastTick =
      now;


    const percentage =
      Math.max(
        0,
        100 -
        (
          elapsed /
          SLIDE_DURATION
        ) * 100
      );


    document.getElementById(
      "timer-bar"
    ).style.width =
      percentage + "%";


    if (
      elapsed >=
      SLIDE_DURATION
    ) {

      currentSlide =
        (
          currentSlide + 1
        ) % groups.length;


      renderSlide(
        currentSlide
      );


      resetTimer();

    }

  }

  else {

    lastTick =
      now;

  }


  raf =
    requestAnimationFrame(
      tick
    );

}


/* =========================================================
   PAUSE BUTTON
   ========================================================= */

document
  .getElementById(
    "btn-pause"
  )
  .addEventListener(
    "click",
    () => {

      paused =
        !paused;


      document.getElementById(
        "btn-pause"
      ).textContent =
        paused
          ? "▶ Resume"
          : "⏸ Pause";

    }
  );


/* =========================================================
   REFRESH BUTTON
   ========================================================= */

document
  .getElementById(
    "refresh-btn"
  )
  .addEventListener(
    "click",
    async () => {

      await refreshData();

      resetTimer();

    }
  );


/* =========================================================
   AUTO REFRESH
   ========================================================= */

/*
  Check Google Sheet every 60 seconds.

  So if you change a student's:
  - level
  - time
  - KY/YK
  - name

  the screen updates automatically.
*/

setInterval(
  refreshData,
  60000
);


/* =========================================================
   START
   ========================================================= */

buildDots();

renderSlide(0);

resetTimer();

refreshData();

raf =
  requestAnimationFrame(
    tick
  );

</script>
